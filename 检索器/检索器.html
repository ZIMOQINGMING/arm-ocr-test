", "(二) 类型", "", "狭义上的混同，根据混同事实发生的原因不同，分为两类，分别是: 概括承受和特定承受。", "", "1. 概括承受。", "", "(1) 债权人继承债务人的遗产或债务人继承债权人的遗产而导致债权债务同归于一人。", "", "[例] 儿子小王向其父王某借款 200 万元用于做生意。后王某因车福死亡。儿子小王", "是王某的唯一继承人。请问: 该 200 万元债务是否消灭?", "", "答: 消灭。因为 200 万元债权债务同归于小王一人，债因混同而消灭。", "", "(2) 第三人同时继承债权人和债务人的遗产。", "", "[例] 儿子小王向其父王某借款 200 万元用于做生意。后王某和小王因车祸同时死亡。", "孙子小小王是二人的唯一继承人人。请问: 该 200 万元债务是否消灭?", "", "答: 消灭。因为 200 万元债权债务同归于小小王一人，俩因混同而消灭。", "", "(3) 债权人和债务人为企业时的合并。", "", "[例| 甲公司欠乙公司货款 50 万元，乙公司欠甲公司租金 50 万元。后甲公司被乙公", "司兼并 (吸收合并) 。请问: 甲公司与乙公司之间的债是否消灭?", "", "答: 消灭。因为 50 万元债权债务同归于乙公司一家公司，债因混同而消灭。", "", "2. 特定承受。", "", "(1) 债务人受让债权人的债权，如债权人与债务人签订合同后，债权人将合同权利转", "让给债务人。", "", "(2) 债权人承受债务人的债务。", "", "四答案: B。", "", "102", "专题十九 @ 合同 (债) 的权利义务终止", "", "(三) 法律效果", "", "债权和债务同归于一人的，债权债务终止，但是损害第三人利益的除外。例如甲以对", "乙的债权为两设定权利质权，融后甲乙之间的债权债务即使混同，为了保护质权人丙的利", "益，作为权利质权之标的物的债权并不消灭。再如，债权人甲请求执行法院扣押债务人乙", "对第三人丙的债权，关后乙丙之间的债权债务虽然发生混同，但为了保护债权人甲的利", "益，被扣押的债权并不消灭，甲仍然可以继续请求法院就该债权强制执行。", "", "103", "男人本", "", "约责任规定在《民法典》第三编合同第一分编通则第八章 (第 577一594 条) ，共", "", "18 条。本专题主要涉及两个方面的问题: 1. 违约责任的基本原理; 2. 违约责任的五种形", "", "式。本专题每年必考,在复", "序言: 民事责任的体系", "", "民事责任-|", "", "习过程中必须牢牢掌握。", "", "三缔约过失责任 (财产性 )", "", "基林质可二特和(和对)", "构成要件", "上 违约页任       继续履行", "(到产性)       采取补救措施", "五种形式 上| 损害赔偿全", "违约金", "定例", "人南任上 凡人于机任(物丰人", "", "非财产性民事责任〈 精神损害赔偿 )", "", "一、违约责任的基本原理", "[ 温区提示] 该考点历年来共直接考查5 次且主观题亦重点考查，在备考中必须重点关注。", "", "(一) 含义", "违约责任，是指当事人", "(二) 特征", "", "不履行或不适当履行合同义务而应承担的民事责任。", "", "1. 双方违约和与有过失。", "", "《民法典》第 592 条共 1", "", "(1) 双方违约。", "双方违约，是指合同当", "", "条确立了双方违约和与有过失。", "", "事人双方都违反了各自的义务，有两个违约行为，并相互造成", "", "了损害，双方应各自承担相", "", "104", "", "应的违约责任。", "专题二十 违约责任", "", "(2) 与有过失。", "", "与有过失 ，又称过失相抵、混合过错，是指合同中作为受损失的一方对损害的发生也", "有过错时，应违约方的请求，应当扣减相应的损失赔偿额。", "", "与有过失是计算违约损害赔偿范围的重要规则。当事人一方违约造成对方损失 ，对方", "对损失的发生有过错的，可以减少相应的损失赔偿额。", "", "2. 相对性。", "", "《民法典》第 593 条共 1 条确立了违约责任的相对性。", "", "违约责任的相对性系合同相对性原理在违约责任上的具体应用。具体内容为: 当事人", "方因第三人的原因造成违约的，应当依法向对方承担违约责任。当事人一方和第三人之", "间的纠纷，依照法律规定〈侵权责任) 或按照约定 (违约责任) 处理。", "", "[例1] 孟某将自己的手表出卖给马某，双方 来共直接考查 8 次且主观题亦考查， 《民法典合同编通则解", "释》第59条 (共1条) 进一步解释了合同僵局，在备考中必须重点关注。", "", "《民法典》第 580、581 条共 2 条规定了继续履行的违约责任。", "", "1. 含》", "", "继续履行，又称实际履行、强制实际履行，是指当合同一方当事人违约时， 了人", "权请求法院或仲裁机构强制违约方按照合同约定的给付内容履行义务，而不得以支付违", "金或赔偿损失的方法代替履行。", "", "2. 种类。", "", "(1) 金钱债务的继续履行。", "", "金钱债务 ，不仅包括合同价款、劳动报酬，还包括租赁合同中的租金和借款合同中主", "债务的利息等。金钱债务的标的物为货币，货币作为一般等价物，是一 种纯粹的可蔡代", "物，具有高度的流通性。因此，人金钱债务原则上必须实际履行，违约方不得以任何理由针", "对非违约方的履行请求作出抗辩。", "", "[ 萌主点拨] 金钱债务，原则上不存在履行不能的问题。", "", "(2) 非金钱债务的继续履行。", "", "当事人一方不履行非金钱债务或履行非金钱债务不符合约定的，对方可以请求履行，", "但是有三个除外，分别是", "", "法律上或事实上不和 履行 〈特定之债) 。", "", "第一，法律上不能履行。", "", "法律上不能履行，是指实际履行违反法律或行政法规的强制性规定的情形。如买卖合", "同标的物因法律或行政法规的新规定而成为禁止流通物。", "", "(债务人)  借款合同  (债权人)", "甲           乙", "", "房屋/抵押/未登记", "丙", "(抵押人)", "(当事人法律关系示意图)", "", "[例| 甲向乙借款，丙与乙约定以自有虏屋担保〈抵押) 该笔借款。丙仅将房本交给", "乙，未按约定办理抵押登记。借款到期后甲无力清偿，丙的房屋被法院另行查封。请问:", "乙是否有权请求两继续履行担保合同，办理房屋抵押登记?", "", "答: 无权。因为房屋已被法院查封，法律上不能履行。", "", "第二，事实上不能履行。", "", "事实上不能履行，是指合同的履行在客观上不能或永久不能。如作为合同标的物的特", "定物灭失。", "", "109", "民法 \\专题讲座精讲卷", "", "区 随党练习 |", "", "甲公司未取得商铺预售许可证，便与李某签订了《商铺认购书》，约定李某支付认", "购金即可取得商铺优先认购权，商铺正式认购时甲公司应优先通知李某选购。双方还约", "定了认购面积和房价，但对楼号、房型未作约定。李某依约支付了认购金。甲公司取得", "预售许可后，未通知李某前来认购，将商铺售世。关于《商铺认购书》，下列哪一表述", "是正确的? (2012-3-10，单)了", "", "A. 无效，因甲公司未取得预售许可证即对外销售", "", "B. 不成立，因合同内容不完整", "", "C.， 甲公司未履行通知义务，构成根本违约", "", "D. 甲公司须承担继续履行的违约责任", "", "@债务的标的不适于强制履行(劳务之债) 或履行费用过高。", "", "债务的标的不适于强制履行，是指债务的性质不宜直接强制履行。如委托合同、技术", "开发合同、演出合同、出版合同、绘本合同等合同的主给付义务，这类债务通常都具有人", "身依附性，不能由第三人赫代懂行或在性质上决定了不适于直接强制执行。但是，这类债", "务虽然不宜直接强制执行，却有采取起代有履行或间接强制的余地。", "", "[曾主点拨] 间接强制履行", "", "当事人一方不履行债务或履行债务不符合约定，存在第三人共代履行的可能性，所产", "生的玲代履行费用属于守约方因对方违约造成的损失范围，由违约方承担不仅符合公平原", "则，也有利于促使当事人积极主动履行合同义务。因此，为了完善和速约责任制度，充分保", "护守约方-方的合法权益,《民法典》第 581 条新增加了间接强制履行制度， 当事人--方", "不履行债务或履行债务不符合约定，根据债务的性质不得强制履行的，对方可以请求其负", "担由第三人蔡代履行的费用。", "", "[例] 某演出公司与“黑衣子”四人演唱组合订立演出合同〔无名合同) ，约定由该", "组合在某晚会上演唱自创歌昌2_3 首，每首酬金 2 万元。不久，组合内部四人发生矛盾，", "铁解散该组合，无法再履行演出合同。请问: 某演出公司是否可以请求继续履行?", "", "答; 不可以。因为债务的标的劳务之债) 不适于强制履行。", "", "@@债权人在合理期限内未请求履行。", "", "未请求履行包括未采取任何主张履行请求权的方式，既没有向法院起诉，也没有直接", "向债务人主张履行。这里的“合理期限”是一个不确定的概念，既非诉讼时效，亦非除斥", "期间。合理期限的长短需要结合这一规则的规范目的具体地加以判断，有的案件可能短", "些，有的案件可能长些。", "", "3. 合同全局。", "", "合同人局，即违约方起诉解除合同制度。《民法典》第 580 条第 2 款: 有前款规定的", "除外情形之一，致使不能实现合同目的的，人民法院或仲裁机构可以根据当事人的请求终", "止合同权利义务关系，但是不影响违约责任的承担。", "", "四 答案: C。", "", "110", "专题二十 违约责任", "", "在违约方已经不能履行合同的情况下，虽然有权援引《民法典》第 580 条第 1 款来对", "抗守约方的实际履行主张，但合同关系并不因此消灭债务在合同预定的期限内始终存", "在，无法请求终止合同。守约方可以解除合同，但却拒绝行使解除权，违约方想申请终止", "却无法律依据。因此，形成了合同僵局。在此情况下，赋予违约方解除合同的权利，有利", "于破解合同僵局，实现实质正义，促进市场经济发展。对于不能履行的交易，以鼓励交易", "的名义强制履行，并不是鼓励交易的真义，而应当允许违约方起诉请求解除合同。", "", "违约方起诉解除合同的构成要件有三:", "", "(1) 违约方起诉请求解除合同主观上必须是韭恶意的。", "", "该要件的目的是防止违约方实施机会主义行为而侵害守约方的利益。违约方在履行困", "难或履行对其经济上不合理时就选择故意违约，将诱发道德风险，违反了任何人不能从其", "不法行为中获利的原则。实践中，经常发生因房屋价格上涨，违约方一房数卖、恶意违约", "的情形。如果任由违约方解除合同，将严重危害交易秩序和交易安全。", "", "(2) 违约方继续履行合同对其显失公平。", "", "在形成合同僵局的情况下，法律上允许违约方提起诉讼解除合同，目的在于纠正利益", "失衡现象，从而平衡当事人之间的利益关系，最终实现实质正义。", "", "(3) 守约方拒绝解除合同违反了诚信原则。", "", "实践中，在出现合同从局时，享有合同解除权的一方当事人拒绝行使解除权，常常是", "为了向对方索要高价，这就违反了诚信和公平原则。如果任由守约方拒绝解除合同，可能", "造成双方利益严重失衡。因此，法律上有必要予以纠正。", "", "《最高人民法院公报案例》2006 年第 6 期", "新宇公司诉冯某商铺买卖合同纠纷案", "", "1998 年 10 月19 日，新宇公司与冯某签订了一份商铺买卖合同，约定: 新宇公司向冯", "某出售时代广场第二层编号为 2B050 的商铺，建筑面积 22.50 平方米，总价款 368184 元。", "合同签订后，汉某按约支付了全部价款。1998 年11 月3 日,新宇公司将 2B050 号商铺交", "付冯某使用，但一直未办理产权过户手续。时代广场两次停业。新宇公司的新股东为盘活", "资产、重新开业，拟对时代广场的全部经营面积进行调整，重新规划布局，为此陆续与大", "部分小业主解除了商铺买卖合同，并开始在时代广场内施工。", "", "2003 年3月17 日,新宇公司致因冯某，通知其解除双方签订的商铺买卖合同。3 月", "27 日，新宇公司拆除了汉某所购商铺的玻璃幕墙及部分管线设施。6 月 30 日，新字公司", "再次向冯某致因，冯某不同意解除合同。由于冯某坚持不退商铺，新字公司不能继续施", "工，6 万平方米建筑闲置，新字公司向法院起诉解除合同。", "", "南京市玄武区人民法院认为: 新宇公司在回收了大部分业主的商铺后，拟对时代广场", "重新进行规划布局，争取再次开业。冯某坚持新宇公司必须按每平方米 30 万元的高价回", "收其商铺，和否则就要求继续履行商铺买卖合同。虽经调解，由于双方当事人互不信任，不", "能达成调解协议，以至于新宇公司的6 万平方米建筑和冯某的 22. 50 平方米商铺均处于闲", "置状态。考虑到冯某所购商铺，只是新宇公司在时代广场里分割出售的 150 余间商铺中的", "", "111", "民法 \\专题讲座精讲卷", "", "一间。在以分割商铺为标的物的买卖合同中，买方对商铺享有的权利，不能等同于独立商", "铺。为有利于物业整体功能的发挥，买方行使权利必须符合其他业主的整体意志 本", "代广场的大部分业主已经退回商铺， 支持新字公司对时代广场重新规划有局的工作，", "", "的时代广场内不再具有商铺经营的氛围条件。冯某以其在时代广场中只 化罗", "铺，要求新宇公司继续履行本案合同，不仅违背大多数商铺业主的意愿，影响时代广场物", "业整体功能的发挥，且由于时代广场内失去了精品商铺的经营条件，再难以通过经营商铺", "营利，继续履行实非其本意。", "", "考虑到时代广场位于阅市区，现在仅因双方当事人之间的互不信任而被闲置，这种情", "况不仅使双方当事人的利益受损，且造成社会财富的极大浪费，不利于社会经济发展。从", "衡平双方当事人目前利益受损状况和今后长远利益出发，依照公平和诚信原则，尽管双方", "当事人之间存在的商铺买卖合同关系合法有效，尽管冯某在履行合同过程中没有任何违约", "", "行为，本案的商铺买卖合同也应当解除。鉴于冯某在履行商铺买卖合同中没有任何过错，", "在商铺买卖合同解除后，其因商铺买卖合同而获得的利益必须得到合理充分的补偿，补偿", "标准是保证汉某能在与时代广场同类的地区购得面积相同的美似商铺。", "新宇公司同意在商铺买卖合同解除后，除返还冯某原付的购房价款、赔偿该商铺的增", "值款外，还给双革补款.48 万元， 这一 数字足以使汉某的现实噬得利益不因合同解除而减", "少，应予确认。", "", "据此，南京市玄武区人民法院于2004年4月30 日判决新宇公司与冯某签订的商铺", "买卖合同予以解除; 新宇公司返还冯某的商铺价款 368184 元，赔偿冯某商铺的增值额", "163516 元; 新宇公司赔偿冯某逾期办理房屋权属登记过户手续的违约人金及其他经济损失", "48 万元。", "", "冯某不服一审判决，向南京市中级人民法院上诉。南京市中级人民法院维持了合同解", "除的判项，同时将违约金及其他经济损失增加到 68 万元。", "", "[新法速递]", "", "《民法典合同编通则解释》(共 9 部分 69 条) 冯云去", "", "条文序号   第 59 条", "", "条文主旨   合同终止的时间", "", "条文来源   新增制度", "", "考试价值   相对重点 (客观阶段和主观阶段均要准备)", "", "关联法条    《民法典》第 580 条第 2 款", "", "当事人一方依据《民法典》第 580 条第 2 款的规定请求终止合同权利义务关系的，", "人民法院一般应当以起诉状副本送达对方的时间作为合同权利义务关系终止的时间。", "条文内容   根据案件的具体情况，以其他时间作为合同权利义务关系终止的时间更加符合公平", "", "     ，人民法院可以以该时间作为合同权利义务关系终止的时间，但", "六攻守人这胃", "", "112", "专题二十 @ 违约责任", "", "(二) 采取补救措施", "", "[ 温划提示] 该考点历年来共直接考查 1 次，备考过程中掌握重点即可。", "", "《民法典》第 582 条共 1 条确立了甫狂履行的违约责任。", "", "环症履行，是指债务人履行的标的物、履行行为不符合当事人约定或法律规定，以至", "不能实现合同全面履行或合同目的的行为。正症履行包括珠癣给付和加害给付两类。刺症", "履行的补救措施包括修理、更换、重作、退货、减价等。", "", "(三) 损害赔偿金", "", "[ 温夫提示] 该考点历年来共直接考查 1 次, 《民法典合同编通则解释》 第 60一63 条", "(共4条) 进一步解释了违约损害赔偿可得利益的计算，在备考过程中必须重点掌握。", "", "《民法典》第 583 、584 条共 2 条确立了损害赔偿金制度。", "", "1. 含义。", "", "损害赔偿金，又称为赔偿损失，是指违约方以支付金钱的方式弥补受害方因违约行为", "而遭受损失的责任形式。", "", "2. 范围。", "", "当事人一方不履行合同义务或履行合同义务不符合约定，造成对方损失的，损失赔偿", "额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益。这里“合同履行后", "可以获得的利益”就是可得利益。通俗而言，可得利益就是“净利润”而非“毛利润\" 。", "", "可得利益，是指未来可以得到的利益。主要包括: 生产利润损失、经营利润损失和转", "售利润损失等。", "", "(1) 生产利润损失。", "", "生产设备和原材料等买卖合同违约中，因出卖人违约而造成买受人的可得利益损失通", "常属于生产利润损失 。", "", "(2) 经营利润损失 。", "", "承包经营、租赁经营合同以及提供服务或劳务的合同中，因一方违约造成的可得利益", "损失通常属于经营利润损失 。", "", "(3) 转售利润损失 。", "", "在“连环买卖”中，因原合同出卖方违约而造成其后的转售合同出售的可得利益损失", "通常属于转售利润损失。", "", "[新法速递]", "《民法典合同编通则解释》(共 9 部分 69 条) 六云云", "条文序号   第 60、61、62 条", "可得利益损失的计算、持续性定期合同中可得利益的赔偿、无法确定可得利益时的", "条文主旨   夏全", "", "条文来源       细化规定", "考试价值   相对重点 (客观阶段要准备)", "关联法条   《民法典》第 584 条", "", "113", "民法 \\专题讲座精讲卷", "", "续表", "", "条文内容", "", "第 60 条，人民法院依据《民法典》第 584 条的规定确定合同履行后可以获得的利益", "时，可以在扣除非违约方为订立、履行合同支出的费用等合理成本后，按照非违约", "方能够获得的生产利润、经  泪或者转售利润等计算。", "", "非违约方依法行使合同解除权#  了替代交易，主张按照蔡代交易价格与合同价", "格的差额确定合同履行后可以获得的利益的，人民法院依法予以支持; 替代交易价", "格明显偏离蔡代交易发生时当地的市场价格，违约方主张按照市场价格与含同价格", "的差额确定合同履行后可以获得的利益的，人民法院应予支持。", "", "非违约方依法行使合同解除权但是未实施替代交易，主张按照违约行为发生后合理", "期间内合同履行地的市场价格与合同价格的差额确定合同履行后可以获得的利益的，", "人民法院应予支持", "", "第 61 条，在以持续履行的债务为内容的定期合同 (如房屋租赁合同) 中，一方不", "履行支付价款、租金等金钱债务，对方请求解除合同，人民法院经审理认为合同应", "人的，以人人失主，人人主人、天 市场价格变化、", "剩余履行期限等因素确定非违约方寻找替代交易的合理期限，     期限对应的", "价款、租金等扣除非违约方应当支付的相应履约成本确定合 林怖行后可以站 的利", "益 〈注意: 保护违约问题，使违约方从交易中摆脱出来) 。", "", "非违约方主张按照合同解除后剩余履行期限相应的价款、租金等扣除履约成本确定", "合同履行后可以获得的利益的，人民法院不予支持。但是,剩余履行期限少于寻找", "珍代交易的合理期限的除外 〈剩余期限 VS 寻找替代交易的合理期限: 以时间短的", "来计算/注意: 与合同僵局相结合)", "", "第 62 条，    习  行后可以获得的利益难以根据本解释第 60 条、第 61 条", "的规定予以确定的， 人 法院可以综合考虑违约方因违约获得的利益、 过区方的过", "", "错程度、其他违约情节等因素，遵循公平原则和诚信原则确定", "", "法理与逻辑", "", "问题 1: 2023 年3月2日，甲公司购买乙公司的一套设备，价款 200 万元，双方签", "订了书面买卖合同。后因乙公司根本违约，甲公司解除了与乙公司的买卖合同。4", "月21 日，甲公司又与再公司签订一份设备采购协议，按照市场价结算 210 万元。请", "间: 甲公司是否有权请求乙公司赔偿实施替代交易多支付的 10 万元?", "", "答: 有权。", "", "问题 2: 2023 年3月2日，甲公司购买乙公司的一套设备，价款 200 万元，双方签", "订了书面买卖合同。后因乙公司根本违约，甲公司解除了与乙公司的买卖合同。4", "月21 日，甲公司又与丙公司签订一份设备采购协议，价款 2000 万元。请问: 甲公", "司是否有权请求乙公司赔偿实施替代交易多支付的 1800 万元?", "", "答: 无权。因为替代交易价格明显偏离替代交易发生时当地的市场价格。", "", "问题 3: 2023 年3月2日，甲公司购买乙公司的一套设备，价款 200 万元，双方签", "订了书面买卖合同。后设备价格暴涨，乙公司将同一套设备以 280 万元出卖给丙公", "司并立即交付。4 月21 日，甲  得知后欲解除与乙公司之间的设备买卖合同。请", "间: 甲公司是否有权请求乙公司赔偿 80 万元?", "", "答: 有权", "", "114", "专题二十 违约责任", "", "续表", "问题 4，甲公司将自己的商铺出租给乙公司，租期 20 年，租金 12 万元每年。1 年", "后，乙公司因生   淡，无法继续经营，欲解除合同。非违约方甲公司可否主张违", "约方乙公司赔偿剩余 19 年的租金损失 228 万元，扣除相应的履约成本 58 万元 (如", "水电费、装修费等) ，请求违约方乙公司支付 170 万元可得利益?", "答: 不可以。", "法理与逻辑  问题5: 甲公司将自己的商铺出租给乙公司，租期 20 年，租金 12 万元每年。在租期", "翻余3 个月时，因乙公司根本违约，甲公司解除了商 function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function highlight(line,terms){var out=esc(line);for(var i=0;i<terms.length;i++){var t=terms[i];
  if(!t)continue;out=out.split(esc(t)).join('<mark>'+esc(t)+'</mark>');}return out;}
function search(){
  var q=document.getElementById('q').value.trim();
  var res=document.getElementById('results'),stats=document.getElementById('stats');
  if(!q){res.innerHTML='<div class="empty">等待输入关键词…</div>';stats.textContent='';return;}
  var terms=q.split(/\s+/).filter(Boolean);
  var totalFiles=0,totalHits=0,html='';
  for(var i=0;i<window.DATA.length;i++){
    var f=window.DATA[i],lines=f.lines,matched=[];
    for(var j=0;j<lines.length;j++){
      var line=lines[j],ok=true;
      for(var k=0;k<terms.length;k++){if(line.indexOf(terms[k])<0){ok=false;break;}}
      if(ok)matched.push({n:j+1,line:line});
    }
    if(matched.length){
      totalFiles++;totalHits+=matched.length;
      var show=matched.slice(0,200);
      html+='<div class="file-block"><div class="file-head" onclick="this.parentNode.classList.toggle('collapsed')">'
        +'<span class="file-name">'+esc(f.name)+'</span>'
        +'<span class="file-count">命中 '+matched.length+' 处'+(matched.length>200?'（显示前200）':'')+'</span>'
        +'</div><div class="hits">';
      for(var m=0;m<show.length;m++){
        html+='<div class="hit"><span class="ln">'+show[m].n+'</span>'+highlight(show[m].line,terms)+'</div>';
      }
      html+='</div></div>';
    }
  }
  stats.textContent='共 '+totalFiles+' 个文件命中 '+totalHits+' 处';
  res.innerHTML=html||'<div class="empty">没有找到匹配的内容</div>';
}
document.getElementById('q').addEventListener('input',function(){
  clearTimeout(this._t);this._t=setTimeout(search,200);
});
</script>

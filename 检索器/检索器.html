t-end device", "联网系统中安装于监控现场的信息采集、编码/处理、存储、传输、安全控制等设备。", "3.1.4", "监控点 surveillance site", "前端设备安装或监控的地点或场所。", "3.1.5", "监控中心 surveillance center", "联网系统内特定的信息汇集、处理、共享节点。", "注：监控管理人员在此对联网系统进行集中管理、控制，对监控信息进行使用、处置。", "\f", "GB/T XXXX—XXXX", "3", "3.1.6", "用户终端 user terminal", "经联网系统注册并授权的、对系统内的数据和/或设备有操作需求的客户端设备。", "3.1.7", "数字接入 digital access", "前端设备或区域监控报警系统通过数字传输通道将数字视音频信号传送到监控中心的接入方式。", "注：包括前端模拟摄像机的模拟视音频信号通过 DVR、DVS 等转码设备转为数字视音频信号后通过数字传输通道传", "送到监控中心的接入方式。", "3.1.8", "模拟接入 analog access", "前端设备或区域监控报警系统通过模拟传输通道将模拟视音频信号传送到监控中心的接入方式。", "3.1.9", "模数混合型监控系统 analog & digital surveillance system", "监控中心中同时存在模拟、数字两种信号控制和处理方式的监控系统。", "3.1.10", "数字型监控系统 digital surveillance system", "监控中心中只存在数字信号控制和处理方式的监控系统。", "3.1.11", "会话初始协议 SIP:Session Initiation Protocol", "由互联网工程任务组（IETF:Internet Engineering Task Force）制定的，用于多方多媒体通信的框架", "协议。", "注：它是一个基于文本的应用层控制协议，独立于底层传输协议，用于建立、修改和终止 IP 网络上的双方或多方", "多媒体会话。", "3.1.12", "会话控制 session control", "建立、修改或结束一个或多个参与者之间通信的过程。", "3.1.13", "SIP 监控域 SIP surveillance realm", "支持本标准规定的通信协议的监控网络，通常由 SIP 服务器和注册在 SIP 服务器上的监控资源、", "用户终端、网络等组成。", "3.1.14", "非 SIP 监控域 non-SIP surveillance realm", "不支持本标准规定的通信协议的监控资源、用户终端、网络等构成的监控网络。非 SIP 监控域包", "括模拟接入设备、不支持本标准规定的通信协议的数字接入设备、模数混合型监控系统、不支持本标", "准规定的 SIP 协议的数字型监控系统。", "3.1.15", "第三方控制者 third par-ty controller", "一个 SIP 用户代理（UA），能够在另外两个用户代理之间创建会话。第三方控制者一般采用背靠", "背用户代理（B2BUA）实现。", "3.1.16", "第三方呼叫控制 third par-ty call control", "第三方控制者在另外两方或者更多方之间发起、建立会话以及释放会话的操作，负责会话方之间", "的媒体协商。", "3.1.17", "\f", "GB/T XXXX—XXXX", "4", "用户代理 user agent", "IETF RFC 3261 规定的 SIP 逻辑终端实体，由用户代理客户端（UAC）和用户代理服务器（UAS）", "组成，UAC 负责发起呼叫，UAS 负责接收呼叫并作出响应。", "3.1.18", "代理服务器 proxy server", "IETF RFC 3261 规定的 SIP 逻辑实体，通过它把来自用户代理客户端（UAC）的请求转发到用户", "代理服务端（UAS），并把 UAS 的响应消息转发回 UAC。", "一个请求消息有可能通过若干个代理服务器来传送，每一个代理服务器独立地确定路由；响应消", "息沿着请求消息相反的方向传递。", "3.1.19", "注册服务器 register server", "IETF RFC 3261 规定的 SIP 逻辑实体，是具有接收注册请求、将请求中携带的信息进行保存并提", "供本域内位置服务的功能服务器。", "3.1.20", "重定向服务器 redirect server", "IETF RFC 3261 规定的 SIP 逻辑实体，负责规划 SIP 呼叫路由。它将获得的呼叫下一跳地址信息", "告诉呼叫方，以使呼叫方根据此地址直接向下一跳发出请求，此后重定向服务器退出呼叫过程。", "3.1.21", "背靠背用户代理 back-to-back user agent", "IETF RFC 3261 规定的 SIP 逻辑实体，它作为用户代理服务端（UAS）接收请求消息并处理该消", "息，同时，为了判决该请求消息如何应答，它也作为用户代理客户端（UAC）来发送请求消息。", "注：背靠背用户代理（B2BUA）和代理服务器不同的是，B2BUA 需要维护一个它所创建的对话状态。", "3.1.22", "功能实体 functional entity", "实现一些特定功能的逻辑单元的集合。", "注：一个物理设备可以由多个功能实体组成，一个功能实体也可以由多个物理设备组成。", "3.1.23", "源设备/目标设备 source device/target device", "源设备代表主动发起会话的一方，目标设备代表最终响应会话的一方。", "3.1.24", "SIP 客户端 SIP client", "具有注册登记、建立/终止会话连接、接收和播放视音频流等功能，主要包括用户界面、用户代理", "（UA）、媒体解码模块和媒体通信模块。用户代理应符合 IETF RFC 3261 的规定，用来建立/修改/终止", "会话连接，是进行会话控制的主要模块，媒体通信模块应能用来实现媒体传输和媒体回放控制。", "3.1.25", "SIP 设备 SIP device", "具有注册、建立/终止会话连接和控制、采集/编解码以及传送视音频流等的功能实体，主要包括", "用户代理（UA）、媒体采集/编解码模块和媒体通信模块。用户代理应符合 IETF RFC 3261 规定，用来", "建立/修改/终止会话连接，是进行会话控制的主要模块，媒体通信模块主要用来实现媒体传输和媒体", "回放控制。", "注：联网系统中 SIP 设备的实现形式主要有支持 SIP 协议的网络摄像机、视频编/解码设备、数字硬盘录像机(DVR)", "和报警设备等。若 SIP 设备具有多路视音频编解码通道，每个通道宜成为一个 SIP 逻辑 UA，具有唯一的 SIP URI，", "\f", "GB/T XXXX—XXXX", "5", "并向 SIP 服务器注册。SIP 设备本身也应具有唯一的 SIP URI，并向 SIP 服务器进行注册。", "3.1.26", "中心信令控制服务器 center control server", "具有向 SIP 客户端、SIP 设备、媒体服务器和网关提供注册、路由选择以及逻辑控制功能，并且", "提供接口与应用服务器通信。组成中心信令控制的逻辑实体包括代理服务器、注册服务器、重定向服", "务器、背靠背用户代理等的一种或者几种，是负责核心 SIP 信令应用处理的 SIP 服务器。", "3.1.27", "媒体服务器 media server", "提供实时媒体流的转发服务，提供媒体的存储、历史媒体信息的检索和点播服务。媒体服务器接", "收来自 SIP 设备、网关或其他媒体服务器等设备的媒体数据，并根据指令，将这些数据转发到其他单", "个或者多个 SIP 客户端和媒体服务器。", "3.1.28", "信令安全路由网关 secure signal routing gateway", "具有接收或转发域内外 SIP 信令功能，并且完成信令安全路由网关间路由信息的传递以及路由信", "令、信令身份标识的添加和鉴别等功能，是一种具有安全功能的 SIP 服务器。", "3.1.29", "级联 cascaded networking", "两个信令安全路由网关之间按照上下级关系连接，上级中心信令控制服务器通过信令安全路由网", "关可调用下级中心信令控制服务器所管辖的监控资源，下级中心信令控制服务器通过信令安全路由网", "关向上级中心信令控制服务器上传本级中心信令控制服务器所管辖的监控资源或共享上级资源。", "3.1.30", "互联 peer-to-peer networking", "两个信令安全路由网关之间按照平级关系连接，中心信令控制服务器之间经授权可相互调用对方", "中心信令控制服务器的监控资源。", "3.2 缩略语", "下列缩略语适用于本文件。", "AES：高级加密标准（Advanced Encryption Standard）", "B2BUA：背靠背用户代理（Back to Back User Agent）", "CIF:通用中间格式（Common Intermediate Format）", "DES：数据加密标准（Data Encryption Standard）", "DNS：域名系统（Domain Name System）", "DVR：数字硬盘录像机（Digital Video Recorder）", "ID：标识编码（Identification）", "IP：因特网协议（Internet Protocol）", "IPC:网络摄像机(Internet Protocol Camera)", "IPSec：因特网安全协议（Internet Protocol Security）", "MANSCDP：监控报警联网系统控制描述协议（Monitoring and Alarming Network System Control", "Description Protocol）", "MANSRTSP：监控报警联网系统实时流协议（Monitoring and Alarming Network System Real-Time", "Streaming Protocol）", "\f", "GB/T XXXX—XXXX", "6", "MD5：信息摘要算法第5版（Message Digest Algorithm 5）", "NAT/FW：网络地址翻译/防火墙（Network Address Translator and FireWall）", "NTP：网络时间协议（Network Time Protocol）", "NVR：网络硬盘录像机（Network Video Recorder）", "PS：节目流（Program Stream）", "RTCP：实时传输控制协议（Real-time Transport Control Protocol）", "RTP：实时传输协议（Real-time Transport Protocol）", "RTSP：实时流化协议（Real-Time Streaming Protocol）", "SDP：会话描述协议（Session Description Protocol）", "SHA：安全哈希算法（Secure Hash Algorithm）", "SIP:会话初始协议(Session Initiation Protocol)", "SVAC:安全防范监控数字视音频编码(Surveillance Video and Audio Coding)", "S/MIME:安全多用途网际邮件扩充协议(Secure Multipurpose Internet Mail Extensions)", "TCP:传输控制协议(Transmission Control Protocol)", "TLS:传输层安全(Transport Layer Security)", "UA:用户代理(User Agent)", "UAC:用户代理客户端(User Agent Client)", "UAS:用户代理服务端(User Agent Server)", "UDP:用户数据报协议(User Datagram Protocol)", "URI:全局资源标识符(Universal Resource Identifier)", "XML:可扩展标记语言(EXtensible Markup Language)", "4 互联结构", "4.1 SIP 监控域互联结构", "4.1.1 概述", "联网系统的信息传输、交换、控制方面的SIP监控域互联结构见图1。图1描述了在单个SIP监控域", "内、不同SIP监控域间两种情况下，功能实体之间的连接关系。功能实体之间的通道互联协议分为会话", "通道协议、媒体（本标准主要指视/音频）流通道协议两种类型，会话通道协议见4.3.2～4.3.4的规定，", "媒体流通道协议见4.3.5和4.3.6的规定。", "\f", "GB/T XXXX—XXXX", "7", "图1 SIP监控域互联结构示意图", "4.1.2 区域内联网", "区域内的SIP监控域由SIP客户端、SIP设备、中心信令控制服务器、流媒体服务器和信令安全路由", "网关等功能实体组成。各功能实体以传输网络为基础，实现SIP监控域内联网系统的信息传输、交换和", "控制。", "4.1.3 跨区域联网", "若干个相对独立的SIP或非SIP监控域以信令安全路由网关和流媒体服务器为核心，通过IP传输网", "络，实现跨区域监控域之间的信息传输、交换、控制。", "4.1.4 联网方式", "4.1.4.1 级联", "两个信令安全路由网关之间是上下级关系，下级信令安全路由网关主动向上级信令安全路由网关", "发起注册，经上级信令安全路由网关鉴权认证后才能进行系统间通信。", "级联方式的多级联网结构示意图如图2、图3所示，信令流都应逐级转发；媒体流宜采用图3所示方", "式传送，也可跨媒体服务器传送。", "\f", "GB/T XXXX—XXXX", "8", "图2 信令级联结构示意图", "图3 媒体级联结构示意图", "4.1.4.2 互联", "信令安全路由网关之间是平级关系，需要共享对方SIP监控域的监控资源时，由信令安全路由网关", "向目的信令安全路由网关发起，经目的信令安全路由网关鉴权认证后方可进行系统间通信。", "互联方式的联网结构示意图如图4、图5所示，信令流应通过信令安全路由网关传送，媒体流宜通", "过媒体服务器传送。", "图4 信令互联结构示意图", "图5 媒体互联结构示意图", "4.2 SIP 监控域与非 SIP 监控域互联结构", "4.2.1 概述", "\f", "GB/T XXXX—XXXX", "9", "SIP 监控域与非 SIP 监控域通过网关进行互联，互联结构见图 6。网关是非 SIP 监控域接入 SIP 监", "控域的接口设备，在多个层次上对联网系统信息数据进行转换。根据转换的信息数据类型，网关逻辑", "上分为控制协议网关和媒体网关。", "图6 SIP监控域与非SIP监控域互联结构示意图", "4.2.2 控制协议网关", "控制协议网关在 SIP 监控域和非 SIP 监控域的设备之间进行网络传输协议、控制协议、设备地址", "的转换，具体功能应包括如下的一种或几种：", "a) 代理非 SIP 监控域设备在 SIP 监控域的 SIP 服务器上进行注册；", "b) 将非 SIP 监控域的网络传输协议与 5.1 中规定的网络传输协议进行双向协议转换；", "c) 将非 SIP 监控域的设备控制协议与 4.3 中规定的会话初始协议、会话描述协议、控制描述协", "议和媒体回放控制协议进行双向协议转换；", "d) 将非 SIP 监控域的设备地址与 6.1 中规定的设备地址进行双向地址转换。", "4.2.3 媒体网关", "媒体网关在 SIP 监控域和非 SIP 监控域的设备之间进行媒体传输协议、媒体数据编码格式的转换，", "具体功能应包括如下的一种或者几种：", "a) 将非 SIP 监控域的媒体传输协议和数据封装格式与 5.2 规定的媒体传输协议和数据封装格式", "进行双向协议转换；", "b) 将非 SIP 监控域的媒体数据与 6.2 中规定的媒体数据压缩编码进行双向转码。", "4.3 联网系统通信协议结构", "4.3.1 概述", "联网系统内部进行视频、音频、数据等信息传输、交换、控制时，应遵循 4.3 所规定的通信协议，", "通信协议的结构见图 7。", "\f", "GB/T XXXX—XXXX", "10", "图 7 通信协议结构图", "联网系统在进行视音频传输及控制时应建立两个传输通道：会话通道和媒体流通道。会话通道用", "于在设备之间建立会话并传输系统控制命令；媒体流通道用于传输视音频数据，经过压缩编码的视音", "频流采用流媒体协议 RTP/RTCP 传输。", "4.3.2 会话初始协议", "安全注册、实时视音频点播、历史视音频的回放等应用的会话控制采用 IETF RFC 3261（SIP）规", "定的 REGISTER、INVITE 等请求和响应方法实现，历史视音频回放控制采用 SIP 扩展协议 IETF RFC 2976", "规定的 INFO 方法实现，前端设备控制、信息查询、报警事件通知和分发等应用的会话控制采用 SIP", "扩展协议 IETF RFC 3428 规定的 MESSAGE 方法实现。", "SIP 消息应支持基于 UDP 和 TCP 的传输。", "互联的系统平台及设备不应向对方的 SIP 端口发送应用无关消息，避免应用无关消息占用系统平", "台及设备的 SIP 消息处理资源。", "本标准基于 IETF RFC 3261 等基础性协议，进行监控联网各项业务功能的规定，本标准中各项功", "能如有特殊规定应遵循本标准，否则应遵循 IETF RFC 3261 等引用协议。", "4.3.3 会话描述协议", "联网系统有关设备之间会话建立过程的会话协商和媒体协商应采用 IETF RFC 4566（SDP）协议", "描述，主要内容包括会话描述、媒体信息描述、时间信息描述。会话协商和媒体协商信息应采用 SIP", "消息的消息体携带传输。", "4.3.4 控制描述协议", "联网系统有关前端设备控制、报警信息、设备目录信息等控制命令应采用监控报警联网系统控制", "描述协议（MANSCDP）描述，见附录 A。联网系统控制命令应采用 SIP 消息 MESSAGE 的消息体携", "带传输。", "4.3.5 媒体回放控制协议", "历史视音频的回放控制命令应采用监控报警联网系统实时流协议（MANSRTSP），协议描述见附", "录 B，实现设备在端到端之间对视音频流的正常播放、快速、暂停、停止、随机拖动播放等远程控制。", "历史媒体的回放控制命令采用 SIP 消息 INFO 的消息体携带传输。", "4.3.6 媒体传输和媒体编解码协议", "媒体流在联网系统 IP 网络上传输时应支持 RTP 传输，媒体流发送源端应支持控制媒体流发送峰", "值功能。RTP 的负载应采用如下两种格式之一：基于 PS 封装的视音频数据或视音频基本流数据，见", "附录 C。媒体流的传输应采用 IETF RFC 3550 规定的 RTP 协议，提供实时数据传输中的时间戳信息及", "各数据流的同步；应采用 IETF RFC 3550 规定的 RTCP 协议，为按序传输数据包提供可靠保证，提供", "流量控制和拥塞控制。", "\f", "GB/T XXXX—XXXX", "11", "5 传输要求", "5.1 网络传输协议要求", "联网系统网络层应支持 IP 协议，传输层应支持 TCP 和 UDP 协议。", "5.2 媒体传输协议要求", "视音频流在基于 IP 的网络上传输时应支持 RTP/RTCP 协议；视音频流的数据封装格式应符合 4.3.6", "中的要求。", "视音频流在基于 IP 的网络上传输时宜扩展支持 TCP 协议，协议应符合附录 L 的规定。", "5.3 信息传输延迟时间", "当信息（包括视音频信息、控制信息及报警信息等）经由 IP 网络传输时，端到端的信息延迟时", "间（包括发送端信息采集、编码、网络传输、信息接收端解码、显示等过程所经历的时间）应满足下", "列要求：", "a) 前端设备与信号直接接入的监控中心相应设备间端到端的信息延迟时间应不大于 2s；", "b) 前端设备与用户终端设备间端到端的信息延迟时间应不大于 4s。", "5.4 网络传输带宽", "联网系统网络带宽设计应能满足前端设备接入监控中心、监控中心互联、用户终端接入监控中心", "的带宽要求，并留有余量。前端设备接入监控中心单路的网络传输带宽应不低于512kbps,重要场所的", "前端设备接入监控中心单路的网络传输带宽应不低于2Mbps，各级监控中心间网络单路的网络传输带宽", "应不低于2.5Mbps。", "5.5 网络传输质量", "联网系统 IP 网络的传输质量（如传输时延、包丢失率、包误差率、虚假包率等）应符合如下要", "求：", "a）网络时延上限值为 400ms；", "b）时延抖动上限值为 50ms；", "c）丢包率上限值为 1×10-3；", "d）包误差率上限值为 1×10-4。", "5.6 视频帧率", "本地录像时可支持的视频帧率应不低于25帧/s；图像格式为CIF时，网络传输的视频帧率应不低于", "25帧/s；图像格式为4CIF以上时，网络传输的视频帧率应不低于15帧/s，重要图像信息宜25帧/s。", "6 交换要求", "6.1 统一编码规则", "6.1.1 ID 统一编码规则", "联网系统应对前端设备、监控中心设备、用户终端 ID 进行统一编码，该编码具有全局唯一性。编", "码应采用编码规则 A（20 位十进制数字字符编码），见附录 D 中的 D.1；局部应用系统也可用编码规则", "B（18 位十进制数字字符编码），见附录 D 中的 D.2。联网系统管理平台之间的通信、管理平台与其他", "系统之间的通信应采用本章规定的统一编码标识联网系统的设备和用户。", "6.1.2 SIP URI 编码规则", "参照 IETF RFC 3261，规定联网系统中 SIP 消息的 From、To 头域中的 SIP URI 格式如下：", "sip[s]:username@domain;uri-parameters", "其中，用户名 username 的命名应保证在同一个 SIP 监控域内具有唯一性，宜采用 6.1.1 规定的 ID", "统一编码；domain 宜采用 ID 统一编码的前十位编码，扩展支持十位编码加“.spvmn.cn”后缀格式,", "或采用 IP:port 格式，port 宜采用 5060；uri-parameters 可用于携带扩展参数。", "\f", "GB/T XXXX—XXXX", "12", "SIP 消息中其他头域的 SIP URI 取值符合 IETF RFC 3261 信令通信规定即可。", "6.2 媒体压缩编解码", "联网系统中视频压缩编解码和音频编解码应符合附录 E 的相关要求，采用视频编解码标准 H.264", "或 MPEG-4，应优先采用 GB/T 25724-2010（简称 SVAC）；音频编解码标准推荐采用 G.711、G.723.1、", "G.729 或 SVAC。", "6.3 媒体存储封装格式", "联网系统中，视音频等媒体数据的存储封装格式应为PS格式（见ISO/IEC 13818-1:2000）。", "6.4 SDP 定义", "联网系统中SIP消息体中携带的SDP内容应符合IETF RFC 2327 - SDP Session Description Protocol的", "相关要求，应有字段见附录F。", "6.5 网络传输协议的转换", "应支持将非 SIP 监控域的网络传输协议与 5.1 中规定的网络传输协议进行双向协议转换。", "6.6 控制协议的转换", "应支持将非 SIP 监控域的设备控制协议与 4.3 中规定的会话初始协议、会话描述协议、控制描述", "协议和媒体回放控制协议进行双向协议转换。", "6.7 媒体传输协议的转换", "应支持将非 SIP 监控域的媒体传输协议和数据封装格式与 5.2 中规定的媒体传输协议和数据封装", "格式进行双向协议转换。", "6.8 媒体数据格式的转换", "应支持将非 SIP 监控域的媒体数据转换为符合 6.2 中规定的媒体编码格式的数据。", "6.9 与其他系统的数据交换", "联网系统通过接入网关提供与综合接处警系统、卡口系统等其他应用系统的接口。接口的基本要", "求、功能要求、数据规范、传输协议和扩展方式应符合附录 G 的要求，联网系统与其他系统接口的消", "息格式应符合附录 G 的要求。", "6.10 信令字符集", "联网系统与设备的 SIP 信令字符集宜采用 GB 2312 编码格式。", "7 控制要求", "7.1 注册", "应支持设备或系统进入联网系统时向SIP服务器进行注册登记的工作模式。", "如果设备或系统注册不成功，宜延迟一定的随机时间后重新注册。", "设备或系统注册的会话控制过程见9.1。", "7.2 实时视音频点播", "应支持按照指定设备、指定通道进行图像的实时点播，支持多用户对同一图像资源的同时点播。", "实时视音频点播的会话控制过程见9.2，会话描述信息采用6.4中规定的格式。", "7.3 设备控制", "应支持向指定设备发送控制信息，如球机/云台控制、录像控制、报警设备的布防/撤防等，实现", "对设备的各种动作进行遥控。", "设备控制的会话控制过程见9.3，设备控制命令采用附录A规定的XML格式。", "7.4 报警事件通知和分发", "应能实时接收报警源发送来的报警信息，根据报警处置预案将报警信息及时分发给相应的用户终", "端或系统、设备。", "报警信息的接收和分发的会话控制过程见9.4，报警事件通知命令采用附录A规定的XML格式。", "\f", "GB/T XXXX—XXXX", "13", "7.5 设备信息查询", "应支持分级查询并获取联网系统中注册设备或系统的目录信息、状态信息等，其中设备目录信息", "包括设备ID、设备名、设备厂家名称、设备型号、设备地址、设备口令、设备类型、设备状态、设备", "安装地址、设备归属单位、父设备ID等信息。", "设备目录查询的会话控制过程见9.5.2，设备目录查询命令采用附录A规定的XML格式。", "应支持查询设备的基本信息，如设备厂商、设备型号、版本、支持协议类型等信息。", "设备信息查询的会话控制过程见9.5.2，设备信息查询命令采用附录A规定的XML格式。", "7.6 状态信息报送", "应支持以主动报送的方式搜集、检测网络内的监控设备、报警设备、相关服务器以及连接的联网", "系统的运行情况。状态信息报送的会话过程见9.6，状态信息报送命令采用附录A规定的XML格式。", "7.7 历史视音频文件检索", "应支持对指定设备上指定时间段的历史视音频文件进行检索。", "历史视音频检索过程见9.7。", "7.8 历史视音频回放", "应支持对指定设备或系统上指定时间的历史视音频数据进行远程回放，回放过程应支持正常播放、", "快速播放、慢速播放、画面暂停、随机拖放等媒体回放控制。", "历史视音频回放的会话控制和视音频回放控制过程见9.8，会话描述信息采用SDP协议规定的格", "式，视音频回放控制命令应采用附录B规定的MANSRTSP协议格式。", "7.9 历史视音频文件下载", "应支持对指定设备指定时间段的历史视音频文件进行下载。", "历史视音频下载过程见9.9。", "7.10 网络校时", "联网系统内的IP网络服务器设备宜支持NTP(见IETF RFC 2030)协议的网络统一校时服务。网络校", "时设备分为时钟源和客户端，支持客户/服务器的工作模式；时钟源应支持TCP/IP、UDP及NTP协议，", "能将输入的或自身产生的时间信号以标准的NTP信息包格式输出。", "联网系统内的IP网络接入设备应支持SIP信令的统一校时，接入设备应在注册时接受来自SIP服务", "器通过消息头Date域携带的授时。", "7.11 订阅和通知", "宜支持订阅和通知机制，支持事件以及目录订阅和通知。具体协议信令流程见9.11。", "7.12 语音广播和语音对讲", "宜支持语音广播、语音对讲机制。协议信令流程见9.12。", "8 传输、交换、控制安全性要求", "8.1 设备身份认证", "应对接入系统的所有设备进行统一的编码，设备编码规范见 6. 1 中的规定。接入设备认证应根据", "不同情况采用不同的认证方式。对于非标准 SIP 设备，宜通过网关进行认证。", "在低安全级别应用情况下，应采用基于口令的数字摘要认证方式对设备进行身份认证，认证流程", "见 9.1 和 IETF RFC 3261 的第 22 章；在高安全级别应用情况下，应采用基于数字证书的认证方式对设", "备进行身份认证，认证流程见 9.1。", "8.2 数据加密", "在高安全级别应用情况下，宜在网络层采用 IPSec 或在传输层采用 TLS 对 SIP 消息实现逐跳安全", "加密；宜在应用层采用 S/MIME 机制的端到端加密（见 IETF RFC 3261 的 23.3），传输过程中宜采用", "RSA（1024 位或 2048 位）对会话密钥进行加密，传输内容宜采用 DES、3DES、AES(128) 等算法加", "\f", "GB/T XXXX—XXXX", "14", "密。", "在高安全级别应用情况下，数据存储宜采用 3DES、AES(128 位) 、SM1 等算法进行加密。", "8.3 SIP 信令认证", "应对 SIP 信令做数字摘要认证，宜支持 MD5、SHA-1、SHA-256 等数字摘要算法。在 SIP 消息头", "域中，启用 Date 域，增加 Note 域。Note＝（Digest nonce=\"\"，algorithm=），nonce 的值为数字摘要", "经过 BASE64 编码后的值，algorithm 的值为数字摘要的算法名称。信令认证的流程和方法规定见附录", "H。当跨域访问时，若该信令是由本域的用户发起，则信令安全路由网关宜将发送到外域的信令添加", "Monitor-User-Identity 头域，其取值为信令安全路由网关 ID 和用户的身份信息；若该信令不是由本域", "的用户发起，则只在原有 Monitor-User-Identity 域值前添加信令安全路由网关 ID；各段分隔符为“-”。", "用户的身份为用户 ID 以及用户身份属性信息（用户身份属性信息包括：用户隶属机构属性、用户类", "别属性和用户职级属性）。", "8.4 数据完整性保护", "联网系统宜采用数字摘要、数字时间戳及数字水印等技术防止信息的完整性被破坏，即防止恶意", "篡改系统数据。数字摘要宜采用信息摘要 5（MD5）、安全哈希算法 1（SHA-1）、安全哈希算法 256(SHA", "－256)等算法。", "8.5 访问控制", "联网系统应实现统一的用户管理和授权，在身份鉴别的基础上，系统宜采用基于属性或基于角色", "的访问控制模型对用户进行访问控制。当跨域访问时，宜采用信令 Monitor-User-Identity 携带的用户身", "份信息进行访问控制。", "9 控制、传输流程和协议接口", "9.1 注册和注销", "9.1.1 注册和注销基本要求", "SIP 客户端、网关、SIP 设备、联网系统等 SIP 代理（SIP UA）使用 IETF RFC 3261 中定义的方法", "REGISTER 进行注册和注销。注册和注销时应进行认证，认证方式应支持数字摘要认证方式，高安全", "级别的宜支持数字证书的认证方式，数字证书的格式符合附录 I 中的规定。", "SIP 代理在注册过期时间到来之前，应向注册服务器进行刷新注册，刷新注册消息流程应与 9.1.2.1", "的流程描述一致，并遵循 IETF RFC 3261 对刷新注册的规定。", "若注册失败，SIP 代理应间隔一定时间后继续发起注册过程，与上一次注册时间间隔应可调，一", "般情况下不应短于 60s。", "系统、设备注册过期时间应可配置，缺省值为 86400s（1 天），应在注册过期时间到来之前发送", "刷新注册消息，为 SIP 服务器预留适当刷新注册处理时间，注册过期时间不应短于 3600s。", "SIP 代理注册成功则认为 SIP 服务器为在线状态，注册失败则认为 SIP 服务器为离线状态；SIP", "服务器在 SIP 代理注册成功后认为其为在线状态，SIP 代理注册过期则认为其为离线状态。", "9.1.2 信令流程", "9.1.2.1 基本注册", "基本注册即采用 IETF RFC 3261 规定的基于数字摘要的挑战应答式安全技术进行注册，具体注册流", "程见图 8。", "\f", "GB/T XXXX—XXXX", "15", "1:Register", "2:401 Unauthorized", "3:Register", "4:200 OK", "SIP服务器 SIP代理", "图 8 基本注册流程示意图", "注册流程描述如下：", "a) 1：SIP 代理向 SIP 服务器发送 REGISTER 请求；", "b) 2：SIP 服务器向 SIP 代理发送响应 401，并在响应的消息头 WWW_Authenticate 字段中给出", "适合 SIP 代理的认证体制和参数；", "c) 3：SIP 代理重新向 SIP 服务器发送 REGISTER 请求，在请求的 Authorization 字段给出信任书，", "包含认证信息；", "d) 4：SIP 服务器对请求进行验证，如果检查出 SIP 代理身份合法，向 SIP 代理发送成功响应 200", "OK，如果身份不合法则发送拒绝服务应答。", "消息示范见附录 J 中的 J.1。", "9.1.2.2 基于数字证书的双向认证注册", "9.1.2.2.1 基于数字证书的双向认证注册说明", "SIP代理和SIP服务器进行双向认证。对IETF RFC 3261中定义的方法REGISTER进行如下头域扩展：", "a) Authorization 的值增加 Capability 项用来描述编码器的安全能力。当 Authorization 的值为", "Capability 时，只携带一个参数 algorithm，参数 algorithm 的值分为三部分，中间以逗号分割。", "第一部分为非对称算法描述，取值为 RSA；第二部分为摘要算法描述，取值为", "MD5/SHA-1/SHA-256 中的一个或者多个；第三部分为对称算法的描述，取值为", "DES/3DES/SM1 中的一个或者多个；", "b) WWW-Authenticate 的值增加 Asymmetric 项用来携带验证 SIP 服务器身份的数据。当", "WWW-Authenticate 的值为 Asymmetric 时，只携带参数 nonce 和 algorithm 。algorithm 的值", "取安全能力中指明的算法；", "c) Authorization 的值增加 Asymmetric 项用来携带验证编码器的数据。当 Authorization 的值为", "Asymmetric 时，携带 nonce、response、algorithm 三个参数。", "9.1.2.2.2 信令流程", "基于数字证书的双向认证注册流程见图 9。", "\f", "GB/T XXXX—XXXX", "16", "1:Register", "2:401 Unauthorized", "3:Register", "4:200 OK或4XX", "SIP服务器 SIP代理", "图 9 基于数字证书的双向认证注册流程示意图", "信令流程描述如下：", "a) 1：SIP UA 向 SIP 服务器发送 REGISTER 请求，消息头域中携带 SIP UA 安全能力。增加", "Authorization 头字段，Authorization 的值为 Capability，参数 algorithm 的值分为三部分，中间", "以逗号分割。第一部分为非对称算法描述，取值为 RSA；第二部分为摘要算法描述，取值为", "MD5/SHA-1/SHA-256 中的一个或者多个；第三部分为对称算法的描述，取值为", "DES/3DES/SM1 中的一个或者多个；", "b) 2：SIP 服务器向 SIP UA 发送一个挑战响应 401，响应的消息头域 WWW-Authenticate 取值为", "Asymmetric，参数 nonce 分为两部分 a 和 b 两部分， algorithm 的值取 SIP UA 安全能力中的", "算法；", "c) 3：SIP UA 收到 401 响应后，得到 nonce 中的 a 和 b 两部分。首先用 SIP UA 私钥解密 b，得", "到结果 c，对结果 c 用 401 响应中 algorithm 指定的算法做摘要，得到结果 d，用 sip 服务器公", "钥解密 a，得到结果 d’，与结果 d 进行匹配，如果相匹配则信任该结果，否则丢弃。SIP UA", "重新向 SIP 服务器发送 REGISTER Message(语音广播通知)", "2:200 OK", "3:Message(语音广播应答)", "4:200 OK", "图 27 SIP服务器发起广播流程示意图", "其中，信令 1、2、3、4 为语音广播通知、语音广播应答消息流程；信令 5、12、13、14、15、16", "\f", "GB/T XXXX—XXXX", "48", "为 SIP 服务器接收到客户端的呼叫请求通过 B2BUA 代理方式建立语音流接收者与媒体服务器之间的", "媒体流信令过程，信令 6～11 为 SIP 服务器通过三方呼叫控制建立媒体服务器与语音流发送者之间的", "媒体流信令过程，信令 17～20 为 SIP 服务器断开语音流接收者与媒体服务器之间的媒体流信令过程，", "信令 21～24 为 SIP 服务器断开媒体服务器与语音流发送者之间的媒体流信令过程。", "命令流程描述如下：", "a) 1：SIP 服务器向语音流接收者发送语音广播通知消息，消息中通过 To 头域标明作为目的地", "址的语音流接收者 ID，消息采用 MESSAGE 方法携带；", "b) 2：语音流接收者收到语音广播通知消息后，向 SIP 服务器发送 200 OK 响应；", "c) 3：语音流接收者向 SIP 服务器发送语音广播应答消息，消息中通过 To 头域标明作为目的地", "址的 SIP 服务器 ID，消息采用 MESSAGE 方法携带；", "d) 4：SIP 服务器收到语音广播应答消息后，向语音流接收者发送 200 OK 响应；", "e) 5：语音流接收者向 SIP 服务器发送 Invite 消息，消息中通过 To 头域标明作为目的地址的语", "音流发送者 ID，消息头域中携带 Subject 字段，表明请求的语音流发送者 ID、发送方媒体流", "序列号、语音流接收者 ID、接收方媒体流序列号等参数，SDP 消息体中 s 字段为“Play”代表", "实时点播，m 字段中媒体参数标识为“audio”表示请求语音媒体流；", "f) 6：SIP 服务器收到 Invite 请求后，通过三方呼叫控制建立媒体服务器和语音流发送者之间的", "媒体连接。向媒体服务器发送 Invite 消息，此消息不携带 SDP 消息体；", "g) 7：媒体服务器收到 SIP 服务器的 Invite 请求后，回复 200 OK 响应，携带 SDP 消息体，消息", "体中描述了媒体服务器接收媒体流的 IP、端口、媒体格式等内容；", "h) 8：SIP 服务器收到媒体服务器返回的 200 OK 响应后，向语音流发送者发送 Invite 请求，消", "息中通过 To 头域标明作为目的地址的语音流发送者 ID，消息头域中携带 Subject 字段，表明", "请求的语音流发送者 ID、发送方媒体流序列号、语音流接收者 ID、接收方媒体流序列号等", "参数，请求中携带消息 7 中媒体服务器回复的 200 OK 响应消息体，s 字段为“Play”代表实时", "点播，m 字段中媒体参数标识为“audio”表示请求语音媒体流，增加 y 字段描述 SSRC 值，f", "字段描述媒体参数；", "i) 9：语音流发送者收到 SIP 服务器的 Invite 请求后，回复 200 OK 响应，携带 SDP 消息体，消", "息体中描述了媒体流发送者发送媒体流的 IP、端口、媒体格式、SSRC 字段等内容，s 字段为", "“Play”代表实时点播，m 字段中媒体参数标识为“audio”表示请求语音媒体流；", "j) 10：SIP 服务器收到语音流发送者返回的 200 OK 响应后，向媒体服务器发送 ACK 请求，请", "求中携带消息 9 中语音流发送者回复的 200 OK 响应消息体，完成与媒体服务器的 Invite 会", "话建立过程；", "k) 11：SIP 服务器收到语音流发送者返回的 200 OK 响应后，向语音流发送者发送 ACK 请求，", "请求中不携带消息体，完成与语音流发送者的 Invite 会话建立过程；", "l) 12：完成三方呼叫控制后，SIP 服务器通过 B2BUA 代理方式建立语音流接收者和媒体服务器", "之间的媒体连接。在消息 5 中增加 SSRC 值，转发给媒体服务器；", "m) 13：媒体服务器收到 Invite 请求，回复 200 OK 响应，携带 SDP 消息体，消息体中描述了媒", "体服务器发送媒体流的 IP、端口、媒体格式、SSRC 值等内容，s 字段为“Play”代表实时点播，", "m 字段中媒体参数标识为“audio”表示请求语音媒体流；", "n) 14：SIP 服务器将消息 13 转发给语音流接收者；", "o) 15：语音流接收者收到 200 OK 响应后，回复 ACK 消息，完成与 SIP 服务器的 Invite 会话建", "立过程；", "p) 16：SIP 服务器将消息 15 转发给媒体服务器，完成与媒体服务器的 Invite 会话建立过程；", "q) 17：SIP 服务器向语音流接收者发送 BYE 消息，断开消息 5、14、15 建立的 Invite 会话；", "r) 18：语音流接收者收到 BYE 消息后回复 200 OK 响应，会话断开；", "\f", "GB/T XXXX—XXXX", "49", "s) 19：SIP 服务器向媒体服务器发送 BYE 消息，断开消息 12、13、16 建立的同媒体服务器的", "Invite 会话；", "t) 20：媒体服务器收到 BYE 消息后回复 200 OK 响应，会话断开；", "u) 21：SIP 服务器向媒体服务器发送 BYE 消息，断开消息 6、7、10 建立的同媒体服务器的 Invite", "会话；", "v) 22：媒体服务器收到 BYE 消息后回复 200 OK 响应，会话断开；", "w) 23：SIP 服务器向语音流发送者发送 BYE 消息，断开消息 8、9、11 建立的同语音流发送者", "的 Invite 会话；", "x) 24：语音流发送者收到 BYE 消息后回复 200 OK 响应，会话断开。", "注：语音广播通知消息除上述流程中通过 SIP 服务器发出外，也可由语音流发送者发出，消息中通过 To 头域标明", "作为目的地址的语音流接收者 ID，经 SIP 服务器中转后发往语音流接收者；语音流接收者处理后发送应答消息，", "消息中通过 To 头域标明作为目的地址的语音流发送者 ID，经 SIP 服务器中转后回复给语音流发送者。后续呼", "叫流程与上述流程相同。", "9.12.1.3 协议接口", "9.12.1.3.1 语音广播通知、语音广播应答命令", "消息头 Content-type 字段为 Content-type: Application/MANSCDP+xml。", "语音广播通知、语音广播应答命令采用 MANSCDP 协议格式定义，详细描述见附录 A 中的 A.2.5", "语音广播通知和 A.2.6 语音广播应答。", "消息示例如下：", "a）语音广播通知", "MESSAGE sip:31010403001370002272@192.168.0.199:5511 SIP/2.0", "From: <sip:31010400002000000001@3101040000>;tag=b05e7e60-ca00a8c0-1587-3a3-7fb52a44-3a3", "To: <sip:31010403001370002272@192.168.0.199:5511>", "Call-ID: b05e7e60-ca00a8c0-1587-3a3-2b297f29-3a3@3101040000", "CSeq: 1761796551 MESSAGE", "Via: SIP/2.0/UDP 192.168.0.202:5511;rport;branch=z9hG4bK-3a3-e3849-287ef646", "Max-Forwards: 70", "Content-Type: application/MANSCDP+xml", "Content-Length: 159", "<?xml version=\"1.0\" ?>", "<Notify>", "<CmdType>Broadcast</CmdType>", "<SN>992</SN>", "<SourceID>31010400001360000001</SourceID>", "<TargetID>31010403001370002272</TargetID>", "</Notify>", "b）语音广播应答", "MESSAGE sip:31010400002000000001@3101040000 SIP/2.0", "From: <sip:31010403001370002272@3101040300>;tag=b55b4cf8-c700a8c0-1587-a3-1ba9ac5-a3", "To: <sip:31010400002000000000@3101040000>", "Call-ID: b55b4cf8-c700a8c0-1587-a3-5eacf182-a3@3101040300", "CSeq: 1856483244 MESSAGE", "Via: SIP/2.0/UDP 192.168.0.199:5511;rport;branch=z9hG4bK-a3-27e0b-71dd2b33", "\f", "GB/T XXXX—XXXX", "50", "Max-Forwards: 70", "Content-Type: application/MANSCDP+xml", "Content-Length: 143", "<?xml version=\"1.0\" ?>", "<Response>", "<CmdType>Broadcast</CmdType>", "<SN>992</SN>", "<DeviceID>31010403001370002272</DeviceID>", "<Result>OK</Result>", "</Response>", "9.12.1.3.2 SDP 参数", "SDP 参数。传输语音流的 SDP 详细描述见附录 F SDP 定义，示例如下文所示。", "v=0", "o=64010600002020000001 0 0 IN IP4 172.20.16.3", "s=Play", "c=IN IP4 172.20.16.3", "t=0 0", "m=audio 8000 RTP/AVP 8 //标识语音媒体流内容", "a=sendonly", "a=rtpmap:8 PCMA/8000 //RTP+音频流", "y=0100000001", "f=v/////a/1/8/1 //音频参数描述", "9.12.2 语音对讲", "语音对讲功能实现中心用户与前端用户之间的一对一语音对讲功能。", "语音对讲功能由下述两个独立的流程组合实现：", "a)通过9.2的实时视音频点播功能，中心用户获得前端设备的实时视音频媒体流；", "b)通过9.12的语音广播功能，中心用户向前端对讲设备发送实时音频媒体流，语音流的封装格式可", "参考附录C中的C.2.4音频流的RTP封装章节的定义。", "\f", "GB/T XXXX—XXXX", "51", "附 录 A", "（规范性附录）", "联网系统控制描述协议（MANSCDP）命令集", "A.1 命令的名称和说明", "应用流程中命令的名称和说明如表A.1所示。", "表A.1 功能名称及其说明", "分类 名称 说明", "请求命令", "Control 表示一个控制的动作", "Query 表示一个查询的动作", "Notify 表示一个通知的动作", "应答命令 Response 表示一个请求动作的应答", "MANSCDP消息中，From、To头域URI中的ID值分别用做消息源和目的标识。MANSCDP应答命", "令中To头域URI中的ID值应使用请求命令From头域URI中的ID值。MANSCDP消息中的SN值用于与请", "求命令的匹配处理，响应命令中的SN值应使用请求命令中的SN值。MANSCDP消息中的行政区域参数", "采用附录D中D.1定义的数字编码，取值为省级2位，市级4位，区县级6位，基层接入单位8位。", "A.2 命令定义", "A.2.1 全局数据类型定义", " 本标准声明的全局数据类型如表A.2所示，全局数据类型是指XML Schema类型或是Schema元素的直", "接子项，可以在不同位置被多次引用。", "表A.2 全局类型名称及其说明", "名称 说明", "deviceIDType 设备编码类型", "statusType 状态类型", "resultType 结果类型", "PTZType 控制码类型", "recordType 录像控制类型", "guardType 布防/撤防控制类型", "itemType 设备目录项类型", "itemFileType 文件目录项类型", "全局类型规定如下：", "a) 设备编码类型", "<simpleType name=\"deviceIDType\">", "<restriction base=\"ID\">", "<!--在取值为行政区划时可为2、4、6、8位，其他情况取值为20位。-->", "<pattern value=\"(\\d{2}|\\d{4}|\\d{6}|\\d{8}|\\d{20})\"/>", "</restriction>", "</simpleType>", "b) 状态类型", "<simpleType name=\"statusType\">", "\f", "GB/T XXXX—XXXX", "52", " <restriction base = \"string\">", " <enumeration value= \"ON\"/>", " <enumeration value= \"OFF\"/>", " </restriction>", "</simpleType>", "c) 结果类型", "<simpleType name= \"resultType\">", " <restriction base= \"string\">", " <enumeration value= \"OK\" />", " <enumeration value= \"ERROR\" />", " </restriction>", "</simpleType>", "d) 控制码类型", "<simpleType name=\"PTZType\" >", " <restriction base=\"string\">", "<length value=\"8\"/>", "</restriction>", "</ simpleType >", "e) 录像控制类型", "< simpleType name=\"recordType\" >", "<restriction base=\"string\">", " <enumeration value=\"Record\" />", " <enumeration value=\"StopRecord\" />", " </restriction>", "</ simpleType >", "f) 布防/撤防控制类型", "< simpleType name=\"guardType\" >", "<restriction base=\"string\">", " <enumeration value=\"SetGuard\" />", " <enumeration value=\"ResetGuard\" />", " </restriction>", "</simpleType >", "g) 设备目录项类型", "<complexType name=\"itemType\">", " <sequence>", " <!-- 设备/区域/系统编码（必选） -->", "<element name=\"DeviceID\" type=\"tg:deviceIDType\"/>", "<!-- 设备/区域/系统名称（必选） -->", " <element name=\"Name\" type=\"string\"/>", "<!-- 当为设备时，设备厂商（必选） -->", " <element name=\" Manufacturer\" type=\"string\"/>", "<!-- 当为设备时，设备型号（必选） -->", " <element name=\" Model\" type=\"string\"/>", "\f", "GB/T XXXX—XXXX", "53", "<!-- 当为设备时，设备归属（必选） -->", " <element name=\" Owner\" type=\"string\"/>", "<!-- 行政区域（必选） -->", " <element name=\"CivilCode\" type=\"string\"/>", "<!-- 警区（可选） -->", " <element name=\"Block\" type=\"string\"/>", "<!-- 当为设备时，安装地址（必选） -->", " <element name=\"Address\" type=\"string\"/>", "<!-- 当为设备时，是否有子设备（必选）1有，0没有 -->", " <element name=\"Parental\" type=\"integer\" minInclusive value = \"0\"/>", "<!-- 父设备/区域/系统ID（必选） -->", " <element name=\"ParentID\" type=\"string\"/>", "<!-- 信令安全模式（可选）缺省为0； 0：不采用；2：S/MIME签名方式；3：S/MIME", "加密签名同时采用方式；4：数字摘要方式-->", " <element name=\" SafetyWay \" type=\"integer\" minInclusive value = \"0\"/>", "<!-- 注册方式（必选）缺省为1； 1： 符合IETF RFC 3261标准的认证注册模式；", "2： 基于口令的双向认证注册模式；3： 基于数字证书的双向认证注册模式-->", " <element name=\"RegisterWay\" type=\"integer\" minInclusive value = \"1\"/>", "<!-- 证书序列号（有证书的设备必选） -->", " <element n >", " <sequence>", "<!-- 绝对时间信息开关，取值0：关闭，1：打开（必选）-->", " <element name=\"TimeFlag\" type=\"integer\" minOccurs= \"0\"/>", "<!-- 监控事件信息开关，取值0：关闭，1：打开（必选）-->", " <element name=\"EventFlag\" type=\"integer\" minOccurs= \"0\"/>", "<!-- 报警信息开关，取值0：关闭，1：打开（必选）-->", " <element name=\"AlertFlag\" type=\"integer\" minOccurs= \"0\"/>", " </sequence>", "</complexType>", "<!--音频参数（可选）-->", "<element name=\"AudioParam\" minOccurs= \"0\">", "<complexType>", " <sequence>", "<!-- 声音识别特征参数开关，取值0：关闭，1：打开（必选）-->", " <element name=\"AudioRecognitionFlag\" type=\"integer\" />", "</sequence>", "</complexType>", "</element>", "</sequence>", "</complexType>", "</element>", "<!-- SVAC解码配置（可选） -->", "<element name=\"SVACDecodeConfig\" minOccurs= \"0\">", "<complexType>", "<sequence>", "<!-- SVC参数（可选）-->", "<element name=\"SVCParam\" minOccurs= \"0\">", "<complexType>", " <sequence>", "\f", "GB/T XXXX—XXXX", "73", "<!-- 空域编码能力，取值0：不支持；1：1级增强（1个增强层）；2：2级增强（2", "个增强层）；3：3级增强（3个增强层）（必选）-->", " <element name=\"SVCSpaceSupportMode\" type=\"integer\" />", "<!-- 时域编码能力，取值0：不支持；1：1级增强；2：2级增强；3：3级增强（必", "选）-->", " <element name=\"SVCTimeSupportMode\" type=\"integer\" />", "</sequence>", "</complexType>", "</element>", "<!--监控专用信息参数（可选）-->", "<element name=\"SurveillanceParam\" minOccurs= \"0\">", "<complexType>", " <sequence>", "<!-- 绝对时间信息显示开关，取值0：关闭，1：打开（必选）-->", " <element name=\" TimeShowFlag \" type=\"integer\" minOccurs= \"0\"/>", "<!-- 监控事件信息显示开关，取值0：关闭，1：打开（必选）-->", " <element name=\" EventShowFlag \" type=\"integer\" minOccurs= \"0\"/>", "<!-- 报警信息显示开关，取值0：关闭，1：打开（必选）-->", " <element name=\" AlerShowtFlag \" type=\"integer\" minOccurs= \"0\"/>", " </sequence>", "</complexType>", "</element>", "</sequence>", "</complexType>", "</element>", "k)设备预置位查询应答", "<!-- 命令类型：预置位查询（必选） -->", "<element name=\"CmdType\" fixed =\"PresetQuery\" />", "<!-- 命令序列号（必选） -->", "<element name=\"SN\" type=\"integer\" minInclusive value = \"1\" />", "<!-- 查询目标设备编码（必选） -->", "<element name=\"DeviceID\" type=\"tg:deviceIDType\" />", "<!—设备预置位列表,用于平台间或平台与设备间的预置位查询（必选） -->", "<element name=\"PresetList\">", "<complexType>", "<sequence>", "<!-- 当前配置的预置位记录，当未配置预置位时不填写 -->", "<element name=\"Item\" minOccurs=\"0\" maxOccurs=\" unbounded \">", "<complexType>", "<sequence>", "<!-- 预置位编码（必选） -->", "<element name=\"PresetID\" type=\"string\"/>", "<!-- 预置位名称（必选） -->", "<element name=\"PresetName\" type=\"string\"/>", "\f", "GB/T XXXX—XXXX", "74", "</sequence>", "</complexType>", "</element>", "<!-- 列表项个数，当未配置预置位时取值为0（必选） -->", "<attribute name=\"Num\" type=\"integer\"/>", "</sequence>", "</complexType>", "</element>", "l)语音广播应答", "<!-- 命令类型：广播通知（必选） -->", "<element name=\"CmdType\" fixed =\"Broadcast\" />", "<!-- 命令序列号（必选） -->", "<element name=\"SN\" type=\"integer\" minInclusive value = \"1\" />", "<!-- 语音输出设备的设备编码（必选） -->", "<element name=\"DeviceID\" type=\"tg:deviceIDType\" />", "<!-- 执行结果标志（必选） -->", "<element name=\"Result\" type=\"tg:resultType\" />", "A.3 前端设备控制协议", "A.3.1 指令格式", "指令格式见表 A.3。", "表 A.3 指令格式", "字节 字节 1 字节 2 字节 3 字节 4 字节 5 字节 6 字节 7 字节 8", "含义 A5H 组合码 1 地址 指令 数据 1 数据 2 组合码 2 校验码", "各字节定义如下：", "字节 1：指令的首字节为 A5H；", "字节 2：组合码 1，高 4 位是版本信息，低 4 位是校验位。本标准的版本号是 1.0，版本信息为 0H；", "校验位=（字节 1 的高 4 位+字节 1 的低 4 位+字节 2 的高 4 位）%16；", "字节 3：地址的低 8 位；", "字节 4：指令码；", "字节 5、6：数据 1 和数据 2；", "字节 7：组合码 2，高 4 位是数据 3，低 4 位是地址的高 4 位；在后续叙述中，没有特别指明的高", "4 位，表示该 4 位与所指定的功能无关；", "字节 8：校验码，为前面的第 1—7 字节的算术和的低 8 位，即算术和对 256 取模后的结果；", "字节 8=（字节 1+字节 2+字节 3+字节 4+字节 5+字节 6+字节 7）%256。", "地址范围 000H—FFFH（即 0—4095），其中 000H 地址作为广播地址。", "注：前端设备控制中，不使用字节 3 和字节 7 的低 4 位地址码，使用前端设备控制消息体中的<DeviceID>统一编", "码标识控制的前端设备。", "A.3.2 PTZ 指令", "PTZ 指令见表 A.4，其中 Bit5 和 Bit4 不应同时为 1，Bit3 和 Bit2 不应同时为 1；Bit1 和 Bit0 不应同", "时为 1。镜头变倍指令、云台上下指令、云台左右指令三者可以组合。", "表 A.4 PTZ 指令", "字节 位", " Bit7 Bit6 Bit5 Bit4 Bit3 Bit2 Bit1 Bit0", "\f", "GB/T XXXX—XXXX", "75", "字节 4 0 0 镜头变倍（Zoom） 云台垂直方向控制", "（Tilt）", "云台水平方向控制（Pan）", "缩小（OUT） 放大（IN） 上（Up） 下（Down） 左（Left） 右（Right）", "字节 5 水平控制速度相对值", "字节 6 垂直控制速度相对值", "字节 7 变倍控制速度相对值 地址高 4 位", "注 1：字节 4 中的 Bit5、Bit4 分别控制镜头变倍的缩小和放大，字节 4 中的 Bit3、Bit2、Bit1、Bit0 位分别控制云台上、下、左、右方向的", "转动，相应 Bit 位置 1 时，启动云台向相应方向转动，相应 Bit 位清 0 时，停止云台相应方向的转动。云台的转动方向以JianS器显示图", "像的移动方向为准。", "注 2：字节 5 控制水平方向速度，速度范围由慢到快为 00H-FFH；字节 6 控制垂直方向速度，速度范围由慢到快为 00H-FFH。", "注 3：字节 7 的高 4 位为变焦速度，速度范围由慢到快为 0H-FH；低 4 位为地址的高 4 位。", "PTZ 指令举例见表 A.5。", "表 A.5 PTZ 指令举例", "序", "号", "字节", "4", "字节 5 字节 6 字节 7 高", "4位", "功能描述", "1 20H XX XX 0H-FH 镜头以字节 7 高 4 位的数值变倍缩小", "2 10H XX XX 0H-FH 镜头以字节 7 高 4 位的数值变倍放大", "3 08H 00H-FFH XX X 云台以字节 6 给出的速度值向上方向运动", "4 04H 00H-FFH XX X 云台以字节 6 给出的速度值向下方向运动", "5 02H XX 00H-FFH X 云台以字节 5 给出的速度值向左方向运动", "6 01H XX 00H-FFH X 云台以字节 5 给出的速度值向右方向运动", "7 00H XX XX X PTZ 的所有操作均停止", "8 29H 00H-FFH 00H-FFH 0H-FH 这是一个 PTZ 组合指令的示例：", "云台以字节 5 给出的速度值向右方向运动，同时以字节 6 给出的速度值向", "上方向运动，实际上是斜向右上方向运行；与此同时，镜头以字节 7 高 4", "位的数值变倍缩小", "A.3.3 FI 指令", "FI 指令见表 A.6，其中 Bit3 和 Bit2 不应同时为 1，Bit1 和 Bit0 不应同时为 1；光圈控制和聚焦控制", "的指令可以组合。", "表 A.6 FI 指令", "字节 位", "Bit7 Bit6 Bit5 Bit4 Bit3 Bit2 Bit1 Bit0", "字节 4 0 1 0 0 光圈（Iris） 聚焦（Focus）", "缩小 放大 近 远", "字节 5 聚焦速度", "字节 6 光圈速度", "字节 7 0 0 0 0 地址高 4 位", "注 1：字节 4 中的 Bit3 为 1 时，光圈缩小；Bit2 为 1 时，光圈放大。Bit1 为 1 时，聚焦近；Bit0 为 1 时，聚焦远。", "Bit3-Bit0 的相应位清 0，则相应控制操作停止动作。", "注 2：字节 5 表示聚焦速度，速度范围由慢到快为 00H-FFH。", "注 3：字节 6 表示光圈速度，速度范围由慢到快为 00H-FFH。", "\f", "GB/T XXXX—XXXX", "76", "FI 指令举例见表 A.7。", "表 A.7 FI 指令举例", "序", "号", "字节", "4", "字节 5 字节 6 字节 7 高 4", "位", "功能描述", "1 48H XX 00H-FFH 0H 镜头以字节 6 的数值缩小光圈", "2 44H XX 00H-FFH 0H 镜头以字节 6 的数值放大光圈", "3 42H 00H-FFH XX 0H 镜头以字节 5 的数值聚焦近", "4 41H 00H-FFH XX 0H 镜头以字节 5 的数值聚焦远", "5 40H XX XX 0H 镜头停止 FI 的所有动作", "6 49H 00H-FFH 00H-FFH 0H 这是一个 FI 组合指令的示例；镜头以字节 6 的数值缩小光圈，同时以", "字节 5 的数值聚焦远", "A.3.4 预置位指令", "预置位指令见表 A.8。其中预置位数目最大为 255，0 号预留。", "表 A.8 预置位指令", "序号 字节 4 字节 5 字节 6 功能描述", "1 81H 00H 01H-FFH 设置预置位", "2 82H 00H 01H-FFH 调用预置位", "3 83H 00H 01H-FFH 删除预置位", "A.3.5 巡航指令", "巡航指令见表 A.9。", "表 A.9 巡航指令", "序号 字节 4 字节 5 字节 6 字节 7 高 4 位 功能描述", "1 84H 00H-FFH 01H-FFH X 加入巡航点", "2 85H 00H-FFH 00H-FFH X 删除一个巡航点", "3 86H 00H-FFH 01H-FFH 0H-FH 设置 “now”，表示视频停止在当前位置。", "示例：", "PAUSE RTSP/1.0", "CSeq: 1", "PauseTime: now", "B.2.3 快进/慢进命令", "\f", "GB/T XXXX—XXXX", "79", "在客户端发送的PLAY 请求消息中，应使用Scale头来控制播放的快慢，见IETF RFC 2326的12.34。", "Scale 为 1，正常播放；不等于 1，为正常播放速率的倍数；负数为倒放。", "快进/ 慢进命令应只携带 Scale 头，表示从当前位置开始以指定的倍速播放,不携带 Range 头。", "示例：", "PLAY RTSP/1.0", "CSeq: 3", "Scale: 2.0", "B.2.4 随机拖放命令", "在客户端发送的 PLAY 请求消息中，应支持 Range 头域，使用 smpte 相对时间戳范围，实现随机", "拖放播放，表示按当前播放速度跳转到 Range 头指定的时间点，不携带 Scale 头。", "示例：", "PLAY RTSP/1.0", "CSeq: 4", "Range: npt=100-", "B.2.5 停止命令", "客户端发送 TEARDOWN 请求消息，停止发送指定流，结束会话，并释放资源。", "B.2.6 应答命令", "客户端、服务器端应支持应答命令的状态码 200，4XX 以及 5XX。见 IETF RFC 2326。", "B.2.7 Scale 和 Range 头域取值范围", "Scale 头应支持的基本取值为 0.25，0.5，1，2，4。", "Range 头的值为播放录像起点的相对值，取值范围为 0 到播放录像的终点时间，参数以 s 为单位，", "不能为负值。如 Range 头的值为 0，则表示从起点开始播放，Range 头的值为 100，则表示从录像起", "点后的 100s 处开始播放，Range 头的取值为 now 表示从当前位置开始播放。", "\f", "GB/T XXXX—XXXX", "80", "附 录 C", "（规范性附录）", "基于 RTP 的视音频数据封装", "C.1 基于RTP的视音频数据PS封装", "基于RTP的PS封装首先按照ISO/IEC 13818-1:2000将视音频流封装成PS包，再将PS包以负载的方式", "封装成RTP包。", "进行PS封装时，应将每个视频帧封装为一个PS包，且每个关键帧的PS包中应包含系统头（System", "Header）和PSM（Program Stream Map），系统头和PSM放置于PS包头之后、第一个PES包之前。", "典型的视频关键帧PS包结构如图C.1所示，其中PESV为视频PES包，PESA为音频PES包，视频非", "关键帧的PS包结构中一般不包含系统头和PSM。PS包中各部分的具体数据结构参见ISO/IEC 13818-1:", "2000中的相关描述。", "图C.1 典型的视频关键帧PS包结构", "系统头应包含对PS包中码流种类的描述，其中视频和音频的流ID（stream_id）取值如下：", "a) 视频流ID：0xE0；", "b) 音频流ID：0xC0。", "针对本文档规定的几种视音频格式，PSM 中流类型（stream_type）的取值如下：", "a) MPEG-4视频流：0x10；", "b) H.264视频流：0x1B；", "c) SVAC视频流：0x80；", "d) G.711音频流：0x90；", "e) G.722.1音频流：0x92；", "f) G.723.1音频流：0x93；", "g) G.729音频流：0x99；", "h) SVAC音频流：0x9B。", "PS 包封装的其他具体技术规范详见 ISO/IEC 13818-1:2000。", "PS 包的 RTP 封装格式参照 IETF RFC2250，RTP 的主要参数设置如下：", "a) 负载类型（payload type）:96；", "b) 编码名称（encoding name）：PS；", "c) 时钟频率（clock rate）：90kHz；", "d) SDP描述中“m”字段的“media”项：video。", "C.2 基于RTP的视音频基本流封装", "该方式直接将视音频数据以负载的方式封装成 RTP 包。", "C.2.1 MPEG-4视频流的RTP封装", "MPEG-4视频流的RTP封装格式应符合IETF RFC 3016协议中的相关规定。", "MPEG-4视频流RTP包的负载类型（Payload Type）标识号选定：从IETF RFC 3551协议的表5中的动", "态范围（96-1 − 00000111", "简单档次/级别 0 00001000", "E.2.3 MPEG-4 的一致性测试", "包括比特流一致性测试和解码器的一致性测试。", "E.2.3.1 比特流一致性测试", "MPEG-4 的一致性比特流（compliant bitstream）是指实现了 ISO/IEC 14496-2:2004 在通用语法", "中定义的所有限制的比特流，包括 ISO/IEC 14496-2:2004 中第 9 章关于档次和级别的限制。", "MPEG-4 的一致性比特流应满足如下测试：当使用解码软件对 MPEG-4 视频比特流进行解码时，不", "应出现任何由比特流引起的错误或不一致。", "注：测试中不考虑由于传输而产生的错误。", "\f", "GB/T XXXX—XXXX", "93", "MPEG-4 的比特流一致性测试的附加测试见 ISO/IEC 14496-4:2004 中的描述。", "上述验证比特流一致性用到的解码软件可用 ISO/IEC 14496-5:2001 中指定的软件。", "E.2.3.2 解码器的一致性测试", "MPEG-4的视频解码器通常指某一特定档次和级别的解码器。", "MPEG-4视频解码器的一致性测试见ISO/IEC 14496-4：2004中的规定，其中简单档次L5级别的视频", "解码器一致性测试见ISO/IEC 14496-4:2004/Amd.10:2005的规定。验证解码器一致性用到的软件可参考", "ISO/ IEC 14496-5:2001中指定的软件。", "满足特定档次和级别的MPEG-4视频解码器应能正确解码相应档次和级别的MPEG-4一致性比特流。", "E.3 音频编、解码总体要求", "在联网系统中，音频编码应支持 ITU-T Rec. G.711 或 G.723.1 或 G.729 等音频编码标准，可扩", "展支持 ITU-T Rec. G.722.1 音频编码标准；音频解码应同时支持 ITU-T Rec. G.711、G.723.1 和 G.729", "音频解码标准，可扩展支持 ITU-T Rec. G.722.1 音频解码标准。", "E.4 G.711 格式", "应至少支持 ITU-T Rec. G.711-1988 中定义的 A 律。", "G.711 解码实现的正确性和精度应符合 ITU-T Rec. G.711 相应测试序列的验证要求。", "E.5 G.723.1 格式", "应支持ITU-T Rec. G.723.1-1996中定义的5.3kbit和6.3kbit语音编/解码模式，宜扩展支持ITU-T", "Rec. G.723.1 附件Annex A中的VAD/CNG模式。", "G.723.1 解码实现的正确性和精度应符合 ITU-T Rec. G.723.1-1996 相应测试序列的验证要求。", "E.6 G.729 格式", "应支持ITU-T Rec.G.729-1996中定义的语音编、解码模式，宜扩展支持ITU-T Rec. G.729-1996 附件", "Annex B中定义的静音压缩模式。", "G.729解码实现的正确性和精度应符合ITU-T Rec. G.729-1996相应测试序列的验证要求。", "\f", "GB/T XXXX—XXXX", "94", "附 录 F", "（规范性附录）", "SDP 定义", "SDP 定义", "联网系统中 SIP 消息体中携带的 SDP 内容应符合 IETF RFC 2327 - SDP Session Description", "Protocol 的相关要求。应有如下字段：", "Session description：", "v= (protocol version)", "o= (owner/creator and session identifier).", "s= (session name)", "u=* (URI of description)", "c=* (connection information - not required if included in all media)", "Time description：", "t= (time the session is active)", "Media description", "m= (media name and transport address)", "c=* (connection information - optional if included at session-level)", "b=* (bandwidth information)", "a=* 第1位为历史或实时", "媒体流的标识位，0为实时，1为历史；第2位至第6位取20位SIP监控域ID之中的4到8位作为域标", "识；例如“13010000002000000001”中取数字“10000”；第7位至第10位作为域内媒体流标识，", "是一个与当前域内产生的媒体流SSRC值后4位不重复的四位十进制整数。", "f字段： f = v/编码格式/分辨率/帧率/码率类型/码率大小a/编码格式/码率大小/采样率", "各项具体含义：", " v：后续参数为视频的参数；各参数间以 “/”分割；", "编码格式：十进制整数字符串表示", "1 –MPEG-4 2 –H.264 3 – SVAC 4 –3GP", "分辨率：十进制整数字符串表示", "1 – QCIF 2 – CIF 3 – 4CIF 4 – D1 5 –720P 6 –1080P/I", "帧率：十进制整数字符串表示 0～99", "码率类型：十进制整数字符串表示", "1 – 固定码率（CBR） 2 – 可变码率（VBR）", "码率大小：十进制整数字符串表示 0～100000 （如 1表示1kbps）", " a：后续参数为音频的参数；各参数间以 “/”分割；", "编码格式：十进制整数字符串表示", "1 – G.711 2 – G.723.1 3 – G.729 4 – G.722.1", "码率大小：十进制整数字符串", "音频编码码率： 1 — 5.3 kbps （注：G.723.1中使用）", " 2 — 6.3 kbps （注：G.723.1中使用）", "\f", "GB/T XXXX—XXXX", "96", " 3 — 8 kbps （注：G.729中使用）", " 4 — 16 kbps （注：G.722.1中使用）", " 5 — 24 kbps （注：G.722.1中使用）", " 6 — 32 kbps （注：G.722.1中使用）", " 7 — 48 kbps （注：G.722.1中使用）", " 8 — 64 kbps （注：G.711中使用）", "采样率：十进制整数字符串表示", " 1 — 8 kHz （注：G.711/ G.723.1/ G.729中使用）", " 2—14 kHz （注：G.722.1中使用）", " 3—16 kHz（注：G.722.1中使用）", " 4—32 kHz（注：G.722.1中使用）", "注1：字符串说明", "本节中使用的“十进制整数字符串”的含义为“0”～“4294967296” 之间的十进制数字字符串。", "注2：参数分割标识", "各参数间以“/”分割，参数间的分割符“/”不能省略；", "若两个分割符 “/”间的某参数为空时（即两个分割符 “/”直接将相连时）表示无该参数值；", "注3：f字段说明", "使用f字段时，应保证视频和音频参数的结构完整性，即在任何时候，f字段的结构都应是完整的结构：", "f = v/编码格式/分辨率/帧率/码率类型/码率大小a/编码格式/码率大小/采样率", "若只有视频时，音频中的各参数项可以不填写，但应保持 “a///”的结构:", "f = v/编码格式/分辨率/帧率/码率类型/码率大小a///", "若只有音频时也类似处理，视频中的各参数项可以不填写，但应保持 “v/////”的结构：", "f = v/////a/编码格式/码率大小/采样率", "f字段中视、音频参数段之间不需空格分割。", "可使用f字段中的分辨率参数标识同一设备不同分辨率的码流。", "注 4: SSRC 的使用", "SSRC 值由媒体流发送设备所在的 SIP 监控域产生，作为媒体流的标识使用。", "a）点播域内设备媒体流 SSRC 处理方式", "点播域内设备媒体流时，SSRC 值由本域监控系统产生并通过 Invite 请求发送给设备使用，设备在回复的", "200OK 消息中携带此值，设备在发送的媒体流中使用此值作为 RTP 的 SSRC 值。流程图见图 F.1。", "\f", "GB/T XXXX—XXXX", "97", "监控系统 监控设备", "Invite(SDP with SSRC)", "200 OK(SDP with SSRC)", "ACK", "使用监控系统产生的SSRC值的RTP流", "产生SSRC值", "图 F.1 域内设备媒体流 SSRC 处理流程示意图", "b）点播外域设备媒体流 SSRC 处理方式", "点播外域设备媒体流时，SSRC 由被点播域产生并在被点播域回复的 200 OK SDP 消息体中携带，被点播", "域发送的 RTP 码流使用该值作为 SSRC 值。流程图见图 F.2。", "\f", "G  "109", "附 录 H", "（规范性附录）", "数字摘要信令认证过程和方法", "H.1 数字摘要信令认证说明", "注册成功后，信令发送方与信令接收方进行交互时，采用数字摘要方式保障信令来源安全。对除", "REGISTER 消息以外的每一条消息都做数字摘要。启用了 Date 字段，扩展了信令消息的头域，在头域", "中增加 Note 字段（值为 Digest，有两个参数 nonce, algorithm）。Note＝（Digest nonce=\"\"，algorithm=），", "nonce的值为algorithm[From+to+CallID+Date+seed+消息体]数字摘要经过BASE64编码后的值，algorithm", "的值为数字摘要的算法名称，“＋”为字符串连接运算。", "Date 比对有效时间范围可设，初设值为 10min，应在校时精度范围内。Date 精确到 s。", "H.2 数字摘要信令认证流程", "数字摘要信令认证会话的流程如图 H.1 所示。", "信令发送方", "2", "信令接收方", "5", "1", "seed", " 3", "4", "seed", "6 ,", "\f", "GB/T XXXX—XXXX", "110", "图 H.1 数字摘要信令认证交互流程", "命令流程描述如下：", "a) 1：信令发送方发送信令前，需要对信令消息头域中的 From、To、Call-ID，Date、seed", "和消息体做摘要，得到结果 1，并将结果 1 作为 Note 字段的参数 nonce 的值，本次使用", "的摘要算法作为 Note 字段的参数 algorithm 的值；", "b) 2：信令发送方将信令发至信令接收方；", "c) 3：信令接收方接收信令，比对 date 与当前时间，如果时间之差在有效区间内则提取 From、", "To、Call-ID，Date、消息体、结果 1、摘要算法，使用摘要算法对 From、To、Call-ID，", "Date、seed 和消息体做摘要，得到结果 1’，匹配结果 1 和结果 1’。如果匹配成功，则信", "令认证通过，否则认证失败，丢弃该信令并终止该信令会话过程；", "d) 4：若信令接收方对收到的信令认证通过，则生成响应信令，并将即将发出的信令消息中", "的 From、To、Call-ID，Date、seed、消息体做数字摘要，得到结果 2；", "e) 5：得到结果 2 作为 Note 字段的参数 nonce 的值，本次使用的摘要算法作为 Note 字段的", "参数 algorithm 的值，将响应信令发送给信令发送方；", "f) 6：信令发送方接收到响应信令，提取 From、To、Call-ID，Date、消息体、结果 2，比对", "date 与当前时间，如果时间之在差在有效区间内，则将这些参数和 seed 一起做数字摘要，", "得到结果 2’，匹配结果 2 和 2’，如果匹配成功，则信令认证通过，否则失败，丢弃该信", "令。", "信令认证 Sip 信令举例", "INVITE sip:device01@ domain1.com:1902 SIP/2.0", "Via: SIP/2.0/UDP sipserver10@domain1.com:5060", "址;branch=z9hG4bKnashds8", "Max-Forwards: 70", "To: device01< sip:device01@ domain1.com:1902 >", "From: controller01<sip: controller01@ domain1.com:5060>;tag=1928301774", "Call-ID: a84b4c76e66710@192.168.9.205", "CSeq: 314159 INVITE", "Contact: <sip:192.168.9.205:5060", "Content-Length: 0", "Date:2008040112:20", "Note: Digest", "nonce=\"8c56a3f50903e318e1267d544e92b9d49a\"", "algorithm=MD5", "注:增加 Note 字段，值为 Digest，有两个参数 nonce, algorithm，其中 nonce 为", "BASE64[MD5[From+to+CallID+Date+seed+消息体]]。", "\f", "GB/T XXXX—XXXX", "111", "附 录 I", "（规范性附录）", "证书格式和证书撤销列表格式", "I.1 证书格式基本 媒体传输", "实时视频点播、历史视频回放与下载的TCP媒体传输应支持基于RTP封装的视音频PS流，封装格式", "参照IETF RFC 4571。", "流媒体服务器宜同时支持作为TCP媒体流传输服务端和客户端。默认情况下，前端设备向流媒体服", "务器发送媒体流时前端设备应作为TCP媒体流传输客户端，流媒体服务器作为TCP媒体流传输服务端；", "同级或跨级流媒体服务器间基于TCP协议传输视频流时，媒体流的接收方宜作为TCP媒体流传输服务", "端。", "媒体流的发送方和接收方可扩展SDP参数进行TCP媒体流传输服务端和客户端的协商，协商机制参", "考附录F及IETF RFC 4571的定义。", "\f", "GB/T XXXX—XXXX", "193", "附 录 M", "（规范性附录）", "媒体流保活机制", "平台、设备媒体流保活机制规定如下:", "a）链路建立后，码流经过的各级平台应具备媒体流丢失监测能力，若监测到媒体流丢失，应释放", "该条媒体链路，并通过会话内 Bye 消息通知上下级平台；", "b）上下级平台之间、平台与设备之间、平台与客户端之间应通过注册、状态信息报送等进行状态", "监测，若监测到媒体流接收方或媒体流发送方故障或离线，应主动释放媒体链路，停止媒体", "流的发送；", "c）通过 Subject 标识进行已发送流的清理判断。上级平台向下级平台、平台向设备发送呼叫请求", "时，应携带 Subject 头域，Subject 头域的“媒体流发送者 ID:发送方媒体流序列号”用于对媒体", "源标识，此标识与请求的码流具有对应关系。下级平台、设备在接收到呼叫请求后，应判断", "是否在发送以此媒体源标识的码流，若已经在发送，则应释放现有媒体流发送链路并按照请", "求建立新的媒体流发送链路。", "\f", "GB/T XXXX—XXXX", "194", "附 录 N", "（规范性附录）", "多响应消息传输", "目录查询响应、文件查询响应、订阅后的通知消息会出现响应、通知消息需发送多条记录的情况，", "此时可通过多条响应、通知消息对记录进行分批传送，各响应消息的 SN 值需与请求消息相同。为了", "保证多条响应、通知消息传输的稳定可靠，多条响应、通知消息发送时宜采用串行发送方式，记录发", "送方需收到上一条 SIP Message 消息的 SIP 响应后再进行后续发送处理。待发送记录条数达到百条级", "别时，为缩短传输时间宜在每条响应消息中携带多条记录，每条响应消息携带记录上限为 10000 条。", "SIP 协议栈应支持 TCP 方式的 SIP 消息收发处理，处理机制应符合 IETF RFC 3261 中第 18 章", "“Transport”的规定。", "目录查询、文件查询未查询出结果情况下返回响应中 SumNum 应取值为 0，且不携带记录列表。", "以文件查询响应作为示例如下：", "<?xml version=\"1.0\"?>", "<Response>", "<CmdType> RecordInfo </CmdType>", "<SN>17430</SN>", "<DeviceID>64010000001310000001</DeviceID>", "<Name>Camera1</Name>", "<SumNum>0</SumNum>", "</Response>", "\f", "GB/T XXXX—XXXX", "195", "附 录 O", "（规范性附录）", "目录查询应答示例说明", "行政区划、系统、设备、业务分组、虚拟组织目录项示例如下。其中，行政区划、系统、业务分", "组、虚拟组织目录项各字段应按照示例固定填写；设备目录项仅列举了附录A中的A.2.1 g）“设备目录", "项类型”中的必填字段，其他选填字段应根据实际填写。业务分组、虚拟组织代表了摄像机的特定业务", "分组下的组织结构，用于特定业务的设备树组织展示。", "a）省级行政区划目录项", "<Item>", "<DeviceID>65</DeviceID>", "<Name>XinJWeiWE自治区</Name>", "</Item>", "b）市级行政区划目录项", "<Item>", "<DeviceID>6501</DeviceID>", "<Name>乌鲁木齐市</Name>", "</Item>", "c）区县级行政区划目录项", "<Item>", "<DeviceID>650102</DeviceID>", "<Name>天山区</Name>", "</Item>", "d）基层接入单位行政区划目录项", "<Item>", "<DeviceID>65010211</DeviceID>", "<Name>燕尔窝派出所</Name>", "</Item>", "e）系统目录项", "<Item>", "<!--ID 编码 11-13 位采用 200 标识系统 ID 类型-->", "<DeviceID>65010200002000000001</DeviceID>", "<Name>天山区监控平台</Name>", "<Manufacturer>平台厂商</Manufacturer>", "<Model>平台型号</Model>", "<Owner>平台归属</Owner>", "<CivilCode>650102</CivilCode>", "<Address>平台安装地址</Address>", "<RegisterWay>1</RegisterWay>", "<Secrecy>0</Secrecy>", "</Item>", "f）业务分组目录项", "业务分组根据特定的业务需求制定，一个业务分组包含一组特定的虚拟组织，虚拟组织下可", "\f", "GB/T XXXX—XXXX", "196", "划分子虚拟组织并可挂接设备，业务分组、虚拟组织、设备间为以业务分组为根节点，虚拟组织", "为分支节点，设备为叶节点的树状层次关系。", "<Item>", "<!--业务分组标识，编码采用国标附录 D 中 D.1 中的 20 位 ID 格式，扩展 215 类型代表业务", "分组-->", "<DeviceID>65010200002150000001</DeviceID>", "<Name>业务分组名称</Name>", "<!--填写制定此业务分组所属的系统 ID-->", "<ParentID>65010200002000000001</ParentID>", "</Item>", "g）虚拟组织目录项", "<Item>", "<!--虚拟组织标识，编码采用国标附录 D.1 中的 20 位 ID 格式，扩展 216 类型代表虚拟组织-->", "<DeviceID>65010200002160000002</DeviceID>", "<Name>虚拟组织名称</Name>", "<!--父节点虚拟组织 ID，用于标识虚拟组织间的层级关系，若有父节点虚拟组织则填写此字", "段-->", "<ParentID>65010200002160000001</ParentID>", "<!--虚拟组织所属的业务分组 ID-->", "<BusinessGroupID>65010200002150000001</BusinessGroupID>", "</Item>", "h）设备目录项", "<Item>", "<DeviceID>65010200001320000009</DeviceID>", "<Name>IPC_天山视频</Name>", "<Manufacturer>设备厂商</Manufacturer>", "<Model>设备型号</Model>", "<Owner>设备归属</Owner>", "<CivilCode>650102</CivilCode>", "<!--若设备属于某组织机构下，应在 Block 字段中填写相应组织机构代码，组织机构代码应符", "合 GA/T 380-2011 规定。-->", "<Block>650102000000</Block>", "<Address>设备安装地址</Address>", "<Parental>0</Parental>", "<!--若上传目录中有此设备的父设备则应填写父设备 ID，若无父设备则应填写系统 ID；若设", "备属于某虚拟组织下，则应同时填写虚拟组织 ID；各个 ID 之间用“/”分隔。-->", "<ParentID>摄像机父设备/虚拟组织</ParentID>", "<RegisterWay>1</RegisterWay>", "<Secrecy>0</Secrecy>", "<Status>ON</Status>", "</Item>", "按照行政区划进行设备树展示使用行政区划、设备目录类型，示例见图O.1。", "\f", "GB/T XXXX—XXXX", "197", "图O.1 行政区划设备树示意图", "按照业务分组进行设备树展示使用业务分组、虚拟组织、设备目录类型，示例见图O.2。", "图O.2 业务分组设备树示意图", "\f", "GB/T XXXX—XXXX", "198", "附 录 P", "（规范性附录）", "域间目录订阅通知", "P.1 基本要求", "联网系统间采用订阅通知机制实现状态变化的设备信息的传送，用于提供联网系统间设备状态一致", "性的维护机制。SIP域可通过订阅方式订阅其他SIP域的全部或部分目录的离线、上线、增加、删除、更", "新等变更信息；被订阅域在目录变更后，应将变更事件通知订阅域。订阅通知消息使用IETF RFC 3265", "规定的SUBSCRIBE、NOTIFY方法实现。", "某一SIP域可进行其他多个SIP域目录信息的订阅，也可接受其他多个SIP域的订阅。本域保存订阅", "目录、被订阅目录列表，在本域被订阅目录变更后向订阅域发送通知消息，订阅域接收到通知消息后进", "行相应更新处理。", "P.2 应用场景及处理逻辑", "P.2.1 相邻域间目录订阅通知", "P.2.1.1应用场景", "相邻域为SIP消息路由直接相邻的两级联网系统。订阅关系如图P.1所示。", "图P.1 相邻域间目录订阅通知示意图", "P.2.1.2 处理逻辑", "P.2.1.2.1 初始订阅", "A域向B域发送初始订阅消息，开始订阅B域设备状态。Expire头域携带订阅过期时间应可配置，默", "认600s。B域在过期时间到来时未收到刷新订阅消息则移除A域的订阅状态。", "为保持两个域间目录状态一致，订阅域在进行初始订阅成功后需默认被订阅对象范围内的目录状态", "为在线，被订阅域在收到初始订阅消息后，需要通知被订阅对象范围内目录的离线和其他异常状态。", " a）A域向B域发送订阅消息，订阅参数可以为B域系统ID、B域下级系统ID、B域范围内行政区划编", "码、B域设备ID、B域上报的业务分组ID、虚拟组织ID。", "− 订阅对象为B域系统ID时，B域检测到直属目录和下级域的目录变更事件时应向A域发送通知", "消息；", "− 订阅对象为B域下级系统ID时，B域检测到对应此ID的下级系统范围内的目录变更事件时应向", "A域发送通知消息；", "− 订阅对象为B域范围内行政区划编码时，B域检测到属于此行政区划的目录变更事件时应向A", "域发送通知消息；", "− 订阅对象为B域设备ID时，B域检测到该设备及其下属子设备发生目录变更事件时应向A域发", "送通知消息；", "− 订阅对象为B域上报的业务分组ID、虚拟组织ID时，B域检测到该业务分组、虚拟组织下属虚", "拟组织、设备发生目录变更事件时应向A域发送通知消息。", "b）B域在检测到被订阅范围内目录变更事件时应根据接收的订阅者列表，向处于订阅有效期的域", "\f", "GB/T XXXX—XXXX", "199", "发送目录状态通知消息。", "P.2.1.2.2 刷新订阅", " A域在初始订阅成功之后，应在过期之前向B域发送刷新订阅消息，进行订阅状态维护。", "刷新订阅消息与初始订阅消息属于同一会话，并且Expire头域值大于0。", "P.2.1.2.3 取消订阅", "若A域不再订阅B域目录变更，应向B域发送取消订阅请求。取消订阅请求应与初始订阅请求属于", "同一会话，并且Expire头域值为0。B域收到取消订阅请求后应移除A域的订阅状态，目录变更后不再通", "知A域。", " B域可通过发送subscription-state头域为terminated的NOTIFY消息主动结束订阅，NOTIFY消息体可", "为空，订阅方接收到该消息后回复200 OK响应。", "P.2.2 跨级域间目录订阅通知", "P.2.2.1应用场景", "跨级域为SIP消息路由不直接相邻的两级平台。订阅关系如图P.2所示。", "图P.2 跨级域间目录订阅通知示意图", "P.2.2.2 处理逻辑", "如图P.2所示，跨级域间状态订阅通知仅在A域、C域维护订阅状态，进行订阅通知逻辑处理。A域", "和C域的处理方式与P.2.1.2相同。", "消息途径的中间域B域需进行SIP订阅通知消息的路由处理。", "P.3 命令流程", "订阅通知流程如图P.3所示。", "\f", "GB/T XXXX—XXXX", "200", "订阅域 被订阅域", "1:SUBSCRIBE(初始订阅)", "2:200 OK", "5:NOTIFY", "6:200 OK", ".", ".", ".", "7:SUBSCRIBE(刷新订阅)", "8:200 OK", "9:NOTIFY", "10:200 OK", ".", ".", ".", "11:SUBSCRIBE(取消订阅)", "12:200 OK", "3:NOTIFY", "4:200 OK", "图P.3 订阅通知信令流程示意图", "命令流程描述如下：", "a) 1：订阅域向被订阅域发送初始订阅 SUBSCRIBE 消息，订阅目的域的目录变更事件，消息头", "域中使用 Event 头域描述订阅事件，消息体中携带订阅的详细参数，使用 Expire 头域指定订", "阅过期时间；", "b) 2：被订阅域设备收到订阅消息后，向订阅域发送 200 OK 响应；", "c) 3：对于初始订阅操作，被订阅域立即发送 NOTIFY 消息携带离线及其他异常状态设备目录，", "消息头域中使用 Event 头域描述订阅事件；", "d) 4：订阅域收到 NOTIFY 消息后回复 200 OK 响应；", "e) 5：被订阅域目录变更后，通过 NOTIFY 消息将变更事件通知订阅域，消息头域中使用 Event", "头域描述订阅事件；", "f) 6：订阅域收到 NOTIFY 消息后回复 200 OK 响应；", "g) 7：订阅域在过期之前向被订阅域发送刷新订阅 SUBSCRIBE 消息，订阅目的域的目录变更事", "\f", "GB/T XXXX—XXXX", "201", "件，消息头域中使用 Event 头域描述订阅事件，消息体中携带订阅的详细参数，使用 Expire", "头域指定订阅过期时间；", "h) 8：被订阅域设备收到订阅消息后，向订阅域发送 200 OK 响应；", "i) 9：被订阅域目录变更后，通过 NOTIFY 消息将变更事件通知订阅域，消息头域中使用 Event", "头域描述订阅事件；", "j) 10：订阅域收到 NOTIFY 消息后回复 200 OK 响应；", "k) 11：订阅域向被订阅域发送取消订阅 SUBSCRIBE 消息，消息头域中使用 Event 头域描述订", "阅事件，消息体中携带订阅的详细参数，Expire 头域值为 0；", "l) 12：被订阅域设备收到订阅消息后，向订阅域发送 200 OK 响应，取消向订阅域发送目录变", "更通知消息。", "消息示范见 J.22。", "P.4 协议接口", "通知消息发送时应进行多条通知消息传输处理，宜采用附录 M 中提供的方式对通知消息的发送进", "行控制，宜进行传输数据过滤处理，避免因设备频繁上下线等异常情况造成系统间传输大量无用数据", "影响系统性能。", "P.4.1 订阅通知消息 Event 头域", " SUBSCRIBE 消息、NOTIFY 消息需携带 Evnet 头域描述订阅事件。Event 头域格式为", "“Catalog;id=num”其中，num 为数字取值，具体说明参见 IETF RFC 3258。", "P.4.2 订阅通知命令消息体", "P.4.2.1 订阅消息", "订阅消息消息体示例如下：", "<?xml version=\"1.0\"?>", "<Query>", "<!-- 命令类型：目录订阅（必选） -->", "<CmdType>Catalog</CmdType>", "<!-- 命令序列号（必选） -->", "<SN>命令序列号</SN>", "<!-- 订阅的系统/行政区划/设备/业务分组/虚拟组织编码（必选） -->", "<DeviceID>订阅编码</ DeviceID>", "</Query>", "P.4.2.2 通知消息", "通知消息消息体示例如下，增加/更新目录通知消息中 Item 的字段参数应遵循附录 A 中 A.2.1 g）", "的规定：", "<?xml version=\"1.0\"?>", "<Notify>", "<!-- 命令类型：目录订阅（必选） -->", "<CmdType>Catalog</CmdType>", "<!-- 命令序列号（必选） -->", "<SN>命令序列号</SN>", "<!-- 订阅的系统/行政区划/设备/业务分组/虚拟组织编码（必选） -->", "<DeviceID>订阅编码</DeviceID>", "<!-- 通知消息中 SumNum 取值与 DeviceList 中 Num 取值相同（必选） -->", "<SumNum>2</SumNum>", "<DeviceList Num=＂2＂>", "\f", "GB/T XXXX—XXXX", "202", "<Item>", " <!-- 状态改变的系统/设备/行政区划编码（必选） -->", " <DeviceID>编码 1</DeviceID>", "<!-- 状态改变事件 ON：上线，OFF：离线，VLOST：视频丢失，DEFECT：故障，", "ADD：增加，DEL：删除，UPDATE：更新（必选） -->", " <Event>OFF</Event>", "</Item>", "<Item>", " <!-- 状态改变的系统/设备/行政区划编码（必选） -->", " <DeviceID>编码 n</DeviceID>", "<!-- 状态改变事件 ON：上线，OFF "(要物合同", "", "(诺成性合同和实践性合同区别示意图", "", "标准: 成立标志。", "", "1. 诺成性合同。", "", "诺成性合同，又称非要物合同，是指只要行为人意思表示合意合同即成立。诺成性合", "同 〈非要物合同) 就是“一诺即成” ，即意思表示合意=合同成立。合同编第二分编中的", "绝大多数有名合同 〈典型合同) 均属于诺成性合同。", "", "2. 实践性合同。", "", "实践性合同，又称要物合同，是指除意思表示合意外，还需以物的交付为成立要件的", "合同。实践性合同 〈要物合同) 的本质 系荆子当事人反悔权， 即意思表示合意+交付标的", "物=合同成立。典型的实践性合同共包括四个，两个与钱有关，即定金合同和自然人之间", "的借款合同;两个与物有关，即保管合同和借用合同。", "", "民法 \\专题讲座精讲卷", "", "[例1] 孟某前往北京一家宝马轿车 4S 店看车，后孟某和 4S 店签订了书面定金合同，", "约定第二天重某交付定金 10 万元，4S 店将一全宝马轿车出卖给重某。第二天，备某反悔，", "不想买车了。请问: 4S 店可否基于书面定金合同追究和孟某的违约责任?", "", "答: 不可以。因为定金合同属于实践性合同，定金合同自交付定金时成立，在交付定", "金之前，重某随时可以反悔。", "", "[例2] 孟某向马某借款 100 万元，双方签订了书面借款合同  ， 多第一下胃革将 10 让", "交付给孟某。第二天，马某反悔。请问: 孟某可耕基于世面备款合同追究马鞭的和违约责任", "", "答: 不可以。因为自然人之间的借款合同属于实践性合同， 依头各同自拓供 (六作)", "借款时成立，在提供〈交付) 借款之前，马某随时可以反忆。", "", "(五) 要式合同和不要式合同", "", "区分标准: 是否需要特定形式。", "", "1. 要式合同 〈主要是书面合同) 。", "", "要式合同，是指法律要求必须具备一定形式的合同。最典型的要式合同就是典型担保", "合同，包括抵押合同、质押合同、保证合同和定金合同。", "", "2. 不要式合同。", "", "不要式合同，是指法律不要求必须具备一定形式的合同。最典型的不要式合同就是买", "卖合同。", "", "(六) 本约和预约", "", "[ 温馨提示] 该考点历年来共直接考查2 次，属于常考点,《民法典合同编通则解释》第", "6一8条 (共3条) 进一步细化了预约合同问题，在客观题和主观题备考中均应当重点关注。", "", "《民法典》第 495 条共 1 条确立了预约制度。", "", "1. 本约。", "", "本约，是指因履行预约而订立的合同。", "", "2. 预约。", "", "实践中，为了规避法律的监管、审批等行政手续 (如商品房买卖合同中的预售许可", "证) 或处于合同强势或优势地位的一 全 往往会采用预约手段。", "", "预约，是指约定将来订立一定合同的合同。当事人约定在将来一定期限内订立合同的", "认购书、订购书、预订书等， 机成预约合同。 本 -方不履行预约合同约定的订立合同", "义务的，对方可以请求其承担预约合同的违约责任。", "", "据此可知，预约与本约系相互独立的两个合同，二者存在“牵连关系\" 。违反预约亦", "构成违约，依法应当承担违约责任，但是不得强制履行本约。", "", "[昔主点拨]", "预约合同和本约合同的成立", "情形     要件1            要件2           法律后果", "情形1 | 约定在将来一定矣 | 能够确定将来所要订立合同的主体、标的等内容 | 预约合同成立", "限内订立合同", "为担保在将来一定", "情形2 | 期限内订立合同交 | 能够确定将来所要订立合同的主体、标的等内容 | 预约合同上成立", "付了定金", "", "专题十三 @ 合同的基本原理", "", "续表", "情形     要件 1            要件2           法律后果", "_    未约定在将来一定 | 难以确定将来所要订立合同的主体、标的等内容      .", "情形                                           据约合同不成也", "站有3 | 期限内订立合同 。 | (仅表达交易的意向)            术科合同不民", "约定在将来一定思", "情形4  约定在次来一定基 难以确定将来所要订立合同的主体、标的等内容 | 预约合同不成立", "限内订立合同", "未明确约定在将来", "已就合同标的、数量、价款或者报酬等主要 2. 方式。", "", "(1) 原则。", "", "承诺原则上应当采用通知 〈书面或口头) 的方式作出。", "", "(2) 例外。", "", "在签名、盖章或按指印之前，当事人一方已经履行主要义务，对方接受时，该合同", "成立。", "", "(3) 承诺迟延。", "", "人含义。", "", "《民法典》第 486 条规定了承诺迟延制度。承诺迟延，又称逾期承诺、超期承诺，是", "指受要约人超过承诺期限发出承诺，或在承诺期限内发出承诺，按照通常情形不能及时到", "达要约人。", "", "@效力。", "", "第一，原则。承诺本应在承诺期限内作出，超过有效的承诺期限，要约已经失效，对", "于失效的要约发出承诺， 不能当然发生承诺的效力。基于对要约人的保护了及交易效率的", "考虑。原则上 ，承诺迟延的，该承讲为新要约〈反要约) 。", "", "新要约〈反要约) ，是指承诺迟延不具有承诺的效力，不产生承诺生效、合同成立的", "法律效果，对要约人不具有法律约束力，只能将其视为一 种希望与他人订立合 同的意思", "表示。", "", "第二，例外。商事交易中，也可能出现尽管承诺迟延，但是市场情形并未发生重大变", "化，要约人依然希望以原条件与受要约人订立合同的情况。此时，如果要求承诺迟延一律", "为新要约，则要约人必须对其再行承诺后合同才能成立，徒劳增加了法律关系的不确定", "性。因此，如果要约人收到迟延的承诺后，认可该迟延承诺的效力，及时通知受要约人该", "迟延的承诺有效，从尊重当事人意思自治及促进交易的角度，应当认定该迟延的承诺具有", "承诺的法律效力，双方当事人合同成立。", "", "因此，要约人及时通知受要约人该承诺有效的，合同成立。", "", "人”基于商机对商事交易的重要作用，期限内对要约人有利的合同条款，可能期限一过就会对要约人不利，甚至", "导致损失，要约人之前所和希望的从合同中得到的预期利益可能随着期限的超过而失去。此时不能当然地认为承诺到达", "了要约人合同就成立，否则将严重损害要约人的利益。", "", "21", "民法 \\专题讲座精讲卷", "", "[例| 甲指定3 月31 日为承诺的最后期限。乙的承诺于4月3日送达甲。甲仍然对该", "合同有兴趣 ，愿意接受乙的逾期承诺，并且立即通知了乙。虽然该通知是4月3日送达", "乙，但合同于4月3 日成立。", "", "(4) 承诺迟到。", "", "加含义。", "", "《民法典》第 487 条规定了承诺迟到制度。承诺迟到，是指受要约人在承诺期限内发", "出承诺，按照通常情形能够及时到达要约人，但是因其他原因致使承诺到达要约人时超过", "承诺期限的情形。", "", "@效力。", "", "第一，原则。尽管受要约人选择了最适当的方式，也为承诺到达预留了合理的在途时", "间，按照通常情形该承诺本应当在承诺期限内到达要约人，但是在某些情形下 ，还会因为", "受要约人所不能控制的因素而造成承诺迟到。如系统服务器出现严重故障，导致网络传输", "中断，电子邮件形式作出的承诺通知延误送达;， 邮局错误操作，导致信件形式的承诺延期", "数天到达; 电报故障;，信困误投等。此种情形下 ，送达风险完全由受要约人承担则在要约", "人和受要约人之间显失公平，且此时受要约人往往对承诺迟到的情形训不知情，本来合理", "预期承诺在承诺期限内到大要约人，承诺生效，合同成立，甚至已经开始为合同履行预做", "准备。因此，承诺迟到的，该承诺原则上有效，产生合同成立的法律效果。", "", "第二，例外。对于迟到的承诺，如果要约人不愿意接受，即负有及时通知受要约人因", "退到的承诺而不接受该承诺的义务。要约人及时发出迟到通知后，该迟到的承诺不生效，", "合同不成立。如果要约人仍于发出迟到通知，则该迟到的承诺有效，合同成立。", "", "原则: 为新要约〈反要约)", "|", "", "例外: 要约人及时通知(权利 ) ，承诺有效，合同成立", "承诺", "原则: 承诺有效，合同成立", "ia", "", "例外: 要约人及时通知(义务 ) ，承诺不生效，为新要约〈《反要约 )", "(承诺迟延和人迟到法律效果体系框架图)", "", "[例] 家住北京市海演区的孟某于2023 年4月1日在家中书写一份要约，内容为欲将", "自己的欧米茵手表以 27500 元出售给位于广州市越秀区的周某。孟某于4月2日将信件投", "入邮简，该信件于4月5 日到达周某住所的邮箱内。周某于4月8 日将该信件拆封后获悉", "该要约的内容。", "", "周某经过考虑后于4月9 日回复信件上书两个大字“可以\"，并于当天将该信件投 公平的，也容易诱发", "(一) 含义", "", "第三人代为履行〈清偿) ，是指第三人在无合同约定的情况下自愿代债务人履行合同", "义务。", "", "(二) 产生原因", "", "1. 第三人基于与债务人的特殊关系或情感，为了避免债务人陷人不利境地或帮助债", "务人摆脱受困状态，如亲属之间互相帮助。", "", "2. 对债务的履行与债务人县有共同利益，为了避免共同利益受损，如连环买卖中第", "二手出卖人未结清其对第一手出卖人货款的情况下向第三人出售货物，第一手出卖人为债", "权人，第二手出卖人即为债务人，此时逾期付款可能造成前一合同解除，从而导致第三人", "购买货物目的落空、债务人亦可能因此承担违约责任。此时，债务人和第三人对于第一手", "合同的履行具有共同利益，为了避免该共同利益受损，第三人会代债务人付清货款。", "", "3. 通过第三人代为履行〈清偿) 方式实现对债务人的赠与。不管出于哪种目的，第", "三人在无合同约定情形下代为履行〈清偿) 行为是主动且自愿的，而非被迫或被动的。", "", "37", "民法 \\专题讲座精讲卷", "", "(三) 构成要件", "", "1. 合同未约定第三人具有履行义务。", "", "第三人不是合同当事人，如果合同已约定由第三人履行，则应适用由第三人履行的合", "同规则。", "", "2. 债务人不履行债务。", "", "债务人不履行债务，包括:", "", "(1) 债务人已明确拒绝履行债务的意思表示。", "", "(2) 债务人虽未明确表示拒绝，但在约定的债务履行期限内或未约定履行期限时在合", "理期限内无实际履行行为。", "", "(3) 债务人明显丧失履行能力，如经营状况严重恶化等。", "", "(4) 债务人亲自履行或委托他人履行已不具有可能性，如债务人在最后履行期限临近", "前因病锚迷或被逮捕等。", "", "3. 第三人对履行该债务具有合法利益。", "", "(1) 转租中次承租人代为支付租金〈代为履行抗辩权) ，以避免自身承租的权利遭受", "损害。", "", "(2) 和母公司为子公司代为偿还债务。由于子公司的债务可能会对母公司的信用评级产", "生不利影响。因此，母公司可以代子公司清偿债务。", "", "(3) 在抵押权人与抵押人约定禁止抵押物转让且已经办理登记手续时，抵押物的买受", "人可以清偿债务人的债务，从而消灭抵押权，进而取得抵押物的所有权〈涤除权) 。", "", "4. 根据债务性质、合同约定或法律规定，未明确将第三人代为履行排除在外。", "", "(1) 依据债务性质不能由第三人代为清偿。例如表演应当由债务人亲自履行，而不能", "由第三人代为清偿。", "", "(2) 按照当事人的约定不得由第三人代为清偿。例如当事人约定承揽工作必须由承揽", "人完成，即不得将该工作交第三人完成。", "", "(3) 依据法律规定不得由第三人代为清偿。例如建设工程主体结构的施工必须由承包", "人亲自完成，不得转包他人。即使经过发包人同意，转包合同也无效。", "", "四、双务合同 ( 买卖合同) 履行中的抗辩权", "[温葛提示] 该考点历年来共直接考查4次。", "", "无先后顺序 ”双方均有同时履行抗辩权 ( 取货时付款 )", "", "双务合同懂行中", "的抗辩权                       先履行一方。 不安抗内权", "", "有先后顺序", "后履行一方”先履行抗辩权( 顺序履行抗辩权 )", "", "(双务合同履行中的抗辩权体系框架图)", "专题十六 @ 合同 (债) 的履行", "", "(一) 相同点", "", "合同履行中的抗辩权均须双方当事人基于同一双务合同而互负对待给付义务，主要是", "同一个买卖合同。同时，在性质上，三者均属于延期性抗辩权。", "", "(二) 不同点", "", "1. 先后顺序。", "", "对于同时履行抗辩权而言，合同中未约定先后履行顺序。而不安抗辩权和先履行抗辩", "权均约定先后履行顺序。", "", "2. 行权主体。", "", "当事人互负债务，没有先后履行顺序的，应当同时履行。一方在对方履行之前有权拒", "绝其履行请求。一方在对方履行债务不符合约定时，有权拒绝其相应的履行请求。", "", "据此可知，同时履行抗辩权乃合同双方当事人均可行使的权利2。与此相对应，不安", "", "抗状权只能", "", "由先履行一方行使，而先履行抗辩权只能由后履行一方行使。", "", "3. 行权理由。", "", "同时履行抗辩权和先履行抗辩权的行权理由均属于相应的抗淮。具体而言;", "(1) 主给付义务的不  文砷确认为由，主张债权人提起的诉讼不符合代位权行使条件的，人", "民法院不予支持", "", "本条第 1 寺的重点在于“重复起诉”问题。债权人代位权诉讼不成立的原因有很", "多，举其一合，如两个债权都未到期，法院当然会判决驳回原告债权人的诉讼请求。", "但是，2 个月后，两个债权都已经到期，债权人再次起诉，是否构成重复起诉? 答:", "不构成。此时，债权人根据新的事实再次起诉，法院应当受理。", "本条第 2 款的重点在于“院止浪  法资源\"。在债权人代位权诉讼中，法院当然", "要对债权人与债务人之间的债权债务关系的真实性、合法性和有效性进行审理，否", "则，无法支持债权人 (原告) 的诉讼请求。但是，这种真实性、合法性和有效性无", "须以“生效法律文蔬” (如判决书、戴决书) 为唯一证据，和否则，债权人在向相对", "人提起代位权诉讼之前还要单独起诉或仲裁债务人，债权得到生效法律文书确认后", "再提起债权人代位权之诉，这显然是司法资源的浪费", "", "(13) 如徐菜向马某提起代位权诉讼后，乔某无正当理由减免马某的债务或延长马某", "的履行期限。马某以上述理由向徐某抗辩的，法院如何处理?", "", "答: 不予支持。", "", "[ 新法速递]", "", "法理与逻辑", "", "《民法典合同编通则解释》(共 9 部分 69 条) 冯支去", "条文序号   第41条", "", "条文主旨   代位权诉讼中债务人处分行为的限制", "", "条文来源   新增制度", "", "考试价值   绝对重点 〈客观阶段和主观阶段均要准备)", "", "50", "专题十七 @ 合同 (债) 的保全", "", "续表", "", "关联法条", "", "《民法典》第 535、536 条", "", "条文内容", "", "债权人提起代位权诉讼后，债务人无正当理由减免相对人的债务或者延长相对人的", "必行期限，相对人以此向债权人抗辩的，人民法院不予支持", "", "法理与逻辑", "", "为保护债权人利益，防止债务人实施不当行为诈害债权 〈债权人代位权与债权人撤", "销权的竞合) ，违反诚信原则。因此，在债权人提起代位权诉讼后，应当对债务人对", "自己债权的处分进", "在债权人提起代位", "", "权之诉后，债务人再实施族害债权的行为，该行为必须进行限制", "fi权人利益，与合同 〈债) 的保全制度的核心功能〈保护债权人", "利益) 相毒离。司法裁判实践中，典型的情形有二: 其一，无正当理由减免相对人", "的债务，比如直接免除债务，这将直接导致货权人行使代位权之诉的基础袁失。其", "二，无正当理由攻长相对人的履行期限，比如延长 100 年，这将直接导致债权人行", "使代位权之诉的构成要件不成立。如果人允许上述两种不当行为的发生，将彻底架空", "债权人代位权之诉，使得《民法典》第 535 条成为一纸空文，这是法律所不能容届", "的。因此，必须对债务人的行为进行限制", "", "(14) 如徐某胜诉后，应由谁承担必要费用?", "", "答: 重某。因为重某急于行权有过错。", "", "(15) 如徐某胜诉后，马某应将该 1000 万元给付给备某还是直接给付给徐某?", "", "答: 基于谁起诉谁受益规则，直接向徐某进行给付。", "", "(16) 如徐某胜诉后，曹某应谁承担保证责任?", "", "答: 基于谁起诉谁受益规则，直接向徐某承担保证责任。", "", "(17) 如马某将 1000 万元给付给徐某后产生何种法律效果?", "", "答:; 徐某和重某之间的 1000 万元债权终止; 重某和马某之间的 2000 万元债权相应终", "", "止 1000 万元。", "", "(18) 代位权诉讼结束后，孟某立即向马某主张剩余的 1000 万元债权，马某可耕以", "", "“诉讼时效已过”为由进行抗辩?", "", "答: 不可以。因为债权人提起代位权诉讼的，应当认定对债权人的债权和债务人的债", "权均发生诉讼时效中断〈重新起算/3 年) 的效力。", "[例2] 徐某对孟某享有 1000 万元债权于 2023 年 12 月 10 日到期。熏某对马某享有", "", "2000 万元债权于 2020 年 10 月 10 日到期 (3 年诉讼时效期间: 2020 年 10 月 11 日一2023", "年10 月10日)。经查，孟某除对马某的 2000 万元到期债权外，无其他责任财产。根据上", "", "述案情及示意图，请回答如下问题:", "代备某之位，以自己的名义起诉", "        L      仍于        和      |", "1000万元                                                                       2000万元", "", "徐某      -          备某     本    马某", "(债权人)    未到其        (债务人) 。。 旬将超过下从本要 (相对人)", "诉讼中原告              诉讼中应当             诉讼中被千", "", "追加为第三人", "人", "", "向重某进行给付〈《入库规则 )", "(债权人代位保存权诉讼当事人法律关系示意图)", "51", "民法 \\专题讲座精讲卷", "", "(1) 假设今天为2023 年4月21 日。徐某是否有权向马某提起债权人代位权之诉?", "", "答: 可以。因为债权人的债权到期前，债务人的权利存在诉讼时效期间即将届满情", "形，影响债权人的债权实现的，债权人可以行使代位权。", "", "(2) 如徐某在 2023 年 12 月 10 日前胜诉，马某应将该 1000 万元给付给孟某还是直接", "给付给徐某?", "", "答: 基于入库规则，马某应当将 1000 万元向重某进行给付。", "", "(一) 基本原理", "", "1. 含义。", "", "债权人代位权，是指当债务人仍于行使其对相对人的权利而害及债权人的债权时，债", "权人为保全其债权，可以自己的名义代为行使债务人对相对人之权的权利。该权利最早起", "源于法国习惯法，又称“间接诉权”或“代位诉权”。", "", "2. 成立条件。", "", "债权人提起代位权诉讼的，必须同时符合如下 4 个条件，分别是:", "", "(1) 原则上，债权人对债务人、债务人对相对人的权利均合法且到期。", "", "这里“权利”包括债权本身以及与该债权有关的从权利。至于发生原因在所不问，无", "论是公法上的债权 〈税收债权) 还是私法上的债权 (合同之债、缔约过失之债、无因管", "理之债、不当得利之债、侵权之债、担保人追偿权之债等) 均可以成为代位权的基础。", "", "[萌主点拨] 代位权的客体", "", "所有权不能成为代位权的客体。因为第三人占有债务人财产而无所有权取得依据，完", "全可以通过强制执行程序解决; 若第三人取得债务人财产有合同依据，债权人刘可通过撤", "销权之诉等法律路径否定第三人取得所有权的原因行为。", "", "(2) 债务人仍于行使权利。", "", "只要债务人未采用诉讼或仲裁的方式均构成“仍于行使”。", "", "如果债务人已经对相对人提起诉讼或仲裁，再允许债权人提起代位权诉讼就违反了重", "复诉讼原则。此时，债权人可以采取保全措施或经执行程序救济。", "", "(3) 债务人仍于行使权利已危害债权人的债权 〈有直接因果关系) 。", "", "(4) 债务人的权利非专属于债务人自身。", "", "专属于债务人自身的债权，是指基于扶养关系、抚养关系、购养关系、继承关系产生", "的给付请求权和劳动报酬、退休金、养老金、抚作金、安置费、人寿保险、人身伤害赔偿", "请求权等权利。", "", "(二) 诉讼当事人和管辖", "", "债权人代位权必须通过诉讼方式行使。", "", "1. 当事人。", "", "(1) 原告: 债权人。", "", "债权人以自己的名义向法院提起代位权之诉，代位权的行使范围以债权人的债权", "为限。", "52", "", "专题十七 @ 合同 (债) 的保全", "", "(2) 被告: 债务人的相对人。", "", "(3) 第三人: 债务人。债权人以债务人的相对人为被告向法院提起代位权诉讼，未将", "债务人列为第三人的，法院应当追加债务人为第三人。", "", "[戎主点拨] 法院是应当追加而非可以追加。", "", "2. 管辖。", "", "债权人对债务人的相对人提起代位权诉讼的，由被告住所地法院管轿，但是依法应当", "适用专属管辖规定的除外。", "", "(三) 法律效果", "", "1. 债务人的相对人可援用对债务人的抗辩对抗货权人 (抗辩权的移转) ，但基于合同", "相对性原理，不得以仲裁条款为由进行抗辩。在代位权诉讼中，相对人对债务人的抗辩，", "可以向债权人主张。债务人在代位权诉讼中对债权人的债权提出异议，经审查异议成立", "的，法院应当裁定驳回债权人的起诉。", "", "2. 债权人行使代位权的必要费用，由债务人负担。", "", "3. 法院认定代位权成立的，由债务人的相对人向债权人履行义务。", "", "该规则确立了“优先受偿权说”的法定性。“优先受偿权说”认为，代位权行使将产生", "优先受偿效力，哪个债权人行使代位权所获财产，就归属于该债权人。这种优先受偿性，是", "因代位权诉讼的启动，基于债的保全这一性质而生，如同诉讼保全一般的程序性清偿在先，", "其理论基础在于债权人对债务人的债权保全有提供财产担保和诉讼付出上的贡献。", "", "4. 债权人接受履行后，债权人与债务人、债务人与相对人之间相应的权利义务终止。", "债务人对相对人的权利被采取保全、执行措施，或债务人破产的，依照相关法律的规定处", "理。因此，相对人的给付产生两个法律效果: 〈1) 债权人与债务人之间的债权消灭; (2) 债", "务人与相对人之间的债权相应的消灭。", "", "5. 债权人提起代位权诉讼的，应当认定对债权人的债权和债务人的债权均发生诉讼", "时效中断的效力。", "", "二、债权人撤销权 (之诉)", "", "[温坦提示] 该考点历年来共直接考查8 次且主观题亦重点考查,《民法典合同编通则", "解释》第42-46条〔共5条) 进一步解释了债权人撤销权之诉，在备考中必须重点关注。", "", "在考试范围内，其性质属于综合性权利〈即采折中说) 而不属于形成权。在学习债权", "人撤销权时，应结合债权人代位权对比学习。", "", "[例] 营某对孟基享有 1000 万债权，和营某多次催促，孟某拖延不还。后曹某告知孟某", "必须在半个月内 〔寅限期) 还钱，否则起诉。孟某立即将家中仅有的值钱物品九成新电冰", "箱和彩电各一台以 150 元的价格卖给知情 (非善意/有过错) 的马鞭，被章某发现。章某", "认为，孟某的行为侵害了自己的合法权益，聘请律师向法院起诉，请求撤销孟某的行为，", "为此向律师支付代理费 2 万元。根据上述案情及示意图，请回答如下问题;", "", "53", "民法 \\专题讲座精讲卷", "", "债权人撤销权之诉", "[元         |         诈害债权的行;           |", "曹某     DO     备某      人 的      马基", "(债权人)      合法有区伟权 (债务人)      前合同成立后         (相对人)", "诉讼中原告                     共同被入                         共同被告", "", "|", "", "撤销后，同时请求马某向和孟某返还", "( 债权人撤销权诉讼当事人法律关系示意图)", "", "(1) 如曹某欲提起债权人撤销权之诉应当符合哪些构成要件?", "", "答: 4要件。分别是:", "", "@债权人对债务人有合法有效的债权;", "", "@主观上，债务人具有诈害债权的恶意;", "", "国客观上，债务人实施了诈害债权的行为;", "", "国债务人的行为已危害债权人的债权 〈(即导致自己陷入无资力而无法清偿其债务/因", "果关系) 。", "", "(2) 曹某向孟某提起债权人撤销权之诉应以谁的名义提起?", "", "答: 自己的名义。", "", "(3) 在该案中，诉讼地位如何确定?", "", "答: 原告: 曹某; 共同被告; 孟某和马某。", "", "(4) 该案应由何地人民法院管辖?", "", "答: 重某或马某的住所地法院管辖，但是依法应当适用专属管辖 (强制性规则，不允", "许排除适用) 规定的除外。", "", "[ 新法速递]", "", "《民法典合同编通则解释》(共 9 部分 69 条) 训去去", "条文序号   第44条", "条文主旨    俩权人撤销权诉讼的当事人、管辖和合并审理", "条文来源   重大制度修改 〈原《合同法解释一》第24、25 条)", "考试价值    绝对重点 〈客观阶段和主观阶段均要准各)", "关联法条   《民法典》第 538、539、542 条", "债权人依据《民法典》第 538 条、第 539 条的规定提起撤销权诉讼的，应当以债务", "人和债务人的相对人为共同被告，由债务人或者相对人的住所地人民法院管辖，但", "条文内容    是依法应当适用专属管辖规定的除外。", "两个以上债权人就债务人的同一行为提起撤销权诉讼的，人民法院可以合并审理", "", "(诉的合并)", "本条属于重大制度修改。因为债权人行使撤销权的标的是债务人和相对人之间的民", "", "事法律行为，主要是合同行为，而合同行为系双友民事法律行为。因此，理应将俩", "法理与逻辑   务人和相对人作为共同被告。", "", "为提高审判效率，防止浪费司法资源以及不同法院得出不同结论的“同案不同判”", "的烧从局面。两个以上债权人起诉的，法院可以合并审理", "", "专题十七 @ 合同 (债) 的保全", "", "(S$) 曹某对和孟某享有 1000 万元债权，如取某将价值 2000 万元的大米赠与马某，曹某", "以孟某和马某作为共同被告提起债权人撤销权之诉。法院如何处理?", "", "答: 法院应支持 1000 万元价值的大米返还。因为在债权人撤销权诉讼中，被撤销行为", "的标的可分，当事人主张在受影响的债权范围内撤销债务人的行为的，人民法院应予支持。", "", "(6) 曹某对孟某享有 1000 万元债权，如孟某将价值 2000 万元的一套别墅赠与马某，", "曹某以重某和马某作为共同被告提起债权人撤销权之诉。法院如何处理?", "", "答: 法院应支持别墅全部返还。因为被撤销行为的标的不可分，债权人主张将债务人", "的行为全部撤销的，人民法院应予支持。", "", "(7) 如法院认定草某的债权人撤销权成立，应否一并支持草某提出的由孟某承担合理", "的律师代理费的诉讼请求?", "", "答: 应支持。", "", "(8) 如曹某的债权人撤销权成立，则曹某为此支付的合理的律师代理费、差旅费应当", "由谁承担?", "", "答: 应由了重某和马某共同承担，因为马某有过错。", "", "[新法速递]", "", "《民法典合同编通则解释》(共 9 部分 69 条) 冯支去", "", "条文序号    第 45 条", "条文主旨   债权人撤销权的效力范围及“必要费用”的认定", "条文来源   细化规定、延续性规定 〈(《合同法解释一》第 26 条) 、新增规定", "考试价值   相对重点 (〈客观阶段和主观阶段均要准备)", "关联法条    《民法典》第 540 条", "在  人撤销权诉讼中，被撤销行为的标的可分，当事人主张在受影响的债权范围", "内撤销债务人的行为的，人民法院应予支持; 被撤销行为的标的不可分，债权人主", "条文内容   张将债务人的行为全部撤销的，人民法院应予支持。", "债权人行使撤销权所支付的合理的律师代理费、差旅费等费用，可以认定为《民法", "典》第 540 条规定的“必要费用”", "本条第 1 款属于新增制度。债权人撤销权中，应当在债权人利益保护、债务人的行", "为自由〈行动自由) 以及相对人的交易安全三者之间进行利益衡量。债权人撤销权", "系合同相对性原理的例外，债权人撤销权的行使范围只能以债权人的债权为限，超", "过部分，债权人无权行使债权人撤销权。因此，如果撤销债务人的部分行为就足以", "保护债权人利益，  条必要撤销全部行为，以免对债务人的行为进行不当 (过", "分) 干预 (司法裁判实践中，非常鼠讳对债务人的行为进行随意撤销)", "", "(9) 如债权人和曹某发现之日为2023 年4月21日，则自哪天起曹某不再享有债权人撤", "销权?", "", "答: 2024年4月22日。", "", "(10) 如债权人曹某在撤销权诉讼中同时请求债务人的相对人马某向债务人重某返还", "财产的，法院如何处理?", "", "答: 予以支持。", "", "法理与逻辑", "", "55", "民法 ,专题讲座精讲卷", "[新法速递]", "《民法典合同编通则解释》(共 9 部分 69 条) 冯支去", "条文序号      第 46 条", "", "条文主目 。 | 撤销权行使的法律效果", "", "条文来源   细化规定", "", "考试价值   相对重点〈客观阶段和主观阶段均要准备)", "", "关联法条        《民法典》第 542 条", "", "债权人在撤销权诉讼中同时请求债务人的相对人向债务人承担返还财产、折价补偿、", "履行到期债务等法律后果的，人民法院依法予以支持。", "", "债权人请求受理撤销权诉讼的人民法院二并审理其与债务人之间的债权债务关系，", "属于该人民法院管辖的，避以合并审理。不属于该人民法院管辖的，应当告知其向", "有管辖权的人民法院另行起诉。", "", "货权人依据其与债务人的诉讼、撤销权诉讼产生的生效法律文书申请强制执行的，人", "民法院:  务人对相对人享有的权利采取强制执行措施以    人的债权。什", "权人在撤销权诉讼中，申请对相对人的财产采取保全措施的，人民法院依法予以准许", "", "条文内容", "", "在债权人撤销权的情形下，债权人有两种选择: 其一，起诉债务人还款; 其二，起", "诉撤销债务人和相对人之间诈害债权的行为。债权人撤销权本身只具有使债务人不", "应减少而减少责任财产的诈害债权行为自始无效的法律效果。实践中， 法院判决债", "权人胜诉后，债务人通常不主动申请相对人向自己返还财产，对相对人强制执行", "法理与逻辑  (因为债务人本来就想许害债权/迷便) ，叶致大量出现 、 “胜诉但钱没拿到”的尴挫", "局面。这不符合债权人实现自己债权的终局目的。该条分 3 款层层说进，通过审判", "和执行程序的登加实现债权人的胜诉权益 〈拿到钱) ，不仅使债权人撤销权具有使", "债务人行为自始无效的效果，还产生使货权人债权实现的积极效果，有利于让债", "", "人少“走程序\" ，更加快捷地获得救济，减少“程序空转” ，浪费司法资源的现象", "", "(一) 基本原理", "", ". 含义。", "", "债权人撤销权，是指债权人对于债务人所为的危害债权的行为，可以请求法院予以撤销", "的权利。该权利最早起源于罗马法，由罗马法务官保罗所创设。因此，又称“保罗诉权”。", "", "2. 成立条件。", "", "债权人撤销权之诉的成立必须同时满足如下 4个条件，分别是:", "", "(1) 债权人对债务人享有合法有效的债权。", "", "债权的发生要合法，赌债等违法行为产生的债权因其自身都得不到法律的保护，亦不", "能行使债权人撤销权。", "", "(2) 主观上，债务人具有诈害债权的恶意。", "", "二在无偿行为情形下，不要求债务人具有主观恶意;", "", "@在有偿行为情形下，要求债务人具有主观恶意。", "", "(3) 客观上，债务人实施了诈害债权的行为。", "", "(4) 债务人的行为已危害债权人的债权 〈即导致自己陷入无资力而无法清偿其债务/", "因果关系) 。", "56", "", "党", "", "专题十七 @ 合同 (债) 的保全", "", "[ 萌主点拨 1」 继承权系综合性权利，既有财产性，又有人身性; 且人身性系前提。", "因此，通说认为，债权人不得对债务人的继承权主张行使债权人撤销权。继承人因放弃继", "承权，致其不能履行法定义务的，放弃继承权的行为无效。", "", "[戎主点拨2] 债务人实施的诈害债权的行为包括: “放弃债权和担保;恶意延长县知道;", "无偿转让要撤销\" 。其中, “放弃债权”包括放弃到期债权和放弃未到期债权两种; “担保”代", "表放弃债权担保、为他人债务提供担保和恶意串通的事后担保; “恶意延长”代表恶意延长其", "到期债权的履行期限; “且知道”代表以明显不合理低价转让财产且受让人明知和以明显不合", "理高价受让财产且转让人明知两种;“无偿转让”代表无偿转让财产 〈(如赠与或遗赠) 。", "", "(1) 放弃到期债权 〈假离婚逃债/离婚放弃财产) 。", "", "[例] 孟某对马某享有 1000 万元债权已到期，马某对曹某享有 2000 万元债权亦到期，", "马某未对曹某采取任何法律措施〈未起诉未仲裁) 且无其他责任财产。2023 年3月2日，", "重某向法院起诉曹某行使债权人代位权。马某听说后立即对曹某说:“你欠我的2000 万元", "债权不要啦。” 请问: 债权人和孟某可和否向法院提起诉讼撤销马某放弃到期债权的行为?", "", "答: 可以。因为放弃到期债权的行为使得债务人马某本不应减少的责任财产不当减", "少，系诈害债权的行为 〈逃债行为) ，债权人熏某可以提起债权人撤销权之诉。", "", "(2) 放弃未到期债权。", "", "[例] 重某对马某享有 1000 万元债权已到期，马某对曹某享有 2000 万元债权尚未到", "期。马某除了对曹某享有的 2000 万元债权外无其他责任财产。2023 年3月2 日，孟某向", "马某主张还款，马某立即对草某说: “你欠我的 2000 万元债权不要啦。” 请问: 俩权人备", "某可和否向法院提起诉讼撤销马某放弃未到期债权的行为?", "", "答: 可以。因为放弃未到期债权的行为使得债务人马某本不应减少的责任财产不当减", "少，系诈害债权的行为 〈逃债行为) ，债权人孟某可以提起债权人撤销权之诉。", "", "(3) 放弃债权担保。", "", "[例] 众森公司对佳黄公司享有 1000 万元债权已到期，佳芮公司对海螺公司享有", "2000 万元债权，该债权由海螺公司以办公楼作抵押并办理了抵押登记手续。佳芮公司", "除了对海螺公司享有的 2000 万元债权外无其他责任财产。2023 年3月2日，众森公司", "向佳黄公司主张还款，佳英公司立即通知海螺公司放弃办公楼的抵押权。4 月 21 日，", "海螺公司破产。请问: 货权人众森公司可否向法院提起诉讼撤销佳黄公司放弃办公楼鬼", "押权的行为?", "", "(债权人 ) 1000万元 (债务人 ) 2000万元 (相对人)", "众森公司    佳英公司    海螺公 ", "为自始无效。", "", "3. 债权人可以请求受让人将所获利益返还债务人，而非直接返还给债权人。", "", "4. 债权人胜诉的，诉讼费用、合理的律师代理费、差旅费等必要费用由债务人负担，", "第三人有过错的适当分担。", "", "[萌主点拨]“第三人有过错的情形”主要包括:", "", "(1) 恶意串通的事后担保;", "", "(2) 恶意延长其到期债权的履行期限;", "", "(3) 以明显不合理低价转让财产，且相对人知道或应当知道该情形 (俗称“低卖”) ;", "", "(4) 以明显不合理高价受让他人财产，且相对人知道或应当知道该情形 〈俗称“高", "买” )。", "", "(四) 双重除扩期间限制", "", "债权人撤销权的行使受除斥期间的限制，如人允许债权人长时间拥有撤销权，必然会影响", "交易安全; 同时，经过长时间后，证据容易灭失。因此，债权人的行权应受到期限限制。债", "权人撤销权自债权人知道或应当知道撤销事由之日起 1 年内行使。自债务人的行为发生之日", "起5 年内没有行使撤销权的，该撤销权消灭。据此可知，撤销权的行使包括两种情形，", "", "(1) 主观上: 自知道或应当知道撤销事由之日起 1 年内行使;", "", "(2) 客观上: 自行为发生之日起 5 年内行使。", "", "[ 萌主点拨]", "合同 (债) 的保全", "项目       债权人代位权之诉            债权人撤销权之诉", "类型    消极/被动型诈害债权 (和逃废债)      积极/主动型诈害债权 (和逃废债)", "本质      责任财产应增加而不增加         责任财产不应减少而减少", "主观恶性         较轻                  较重", "", "合同〈债 ) 的变更和转让", "", "合同 〈债) 的变更和转让规定在《民法典》第三编合同第一分编通则第六章 (第", "543一5536 条) ，共 14 条。本专题主要涉及四个方面的问题: 1. 合同的变更; 2. 债权转让", "(让与); 3. 债务承担; 4. 债权债务的概括承受。本专题系考试的重点和难点内容，特别", "是债务承担，在备考时应重点关注。", "", "序言: 广义债的变更体系", "", "狭义债的变更〈 主体不变内容变 )", "|              债权转让(通知 )", "", "免责的债务承担 (退出机制/同意 )", "并存的债务承担(加入机制/通知 )", "债权债务的概括承受 ( 同意 )", "", "[图释] 对于广义债的变更而言，主要包括两个部分，即主体不变内容变，称为“狭", "义债的变更”和内容不变主体变，称为“债的移转” 。", "", "当事人协商一致，可以变更合同。当事人对合同变更的内容约定不明确的，推定为未", "变更。", "", "债的移转，是指在债的关系不失其同一性吕的基础上，债的关系的一方当事人依法将", "其债权、债务全部或部分转让给第三人的现象。具体又可以分为三类，分别是债权让与", "(通过转让合同而移转合同权利) 、债务承担 〈通过转让合同而移转合同义务) 和债权债", "务的概括承受。", "", "一、合同的变更", "", "《民法典》第 543、544 条规定了合同的变更制度。", "", "(一) 含义", "", "合同的变更，是指合同成立后，当事人在原合同的基础上对合同的内容进行修改或补充。", "", "俩的移转( 内容不变主体变) 二 债务承担二", "", "驯”债的关系不失其同一性，是指债的效力依旧不变，不仅其原有的利益 〈如时效利益) 和下变 〈如各种抗关)", "均不受转移的影响，而且其从属的权利〈如担保) 原则上亦仍然继续存在。", "", "65", "民法 \\专题讲座精讲卷", "", "(二) 条件", "", "合同变更应当同时符合下列条件:", "", "1. 存在合法有效的合同关系。", "", "2. 合同内容发生变化。", "", "合同内容的变化，通常包括合同的标的物、数量、质量、履行期限或地点、价款、期", "限、违约责任等内容的变更，也可以包括合同的主给付义务、从给付义务、附随义务的", "变更。", "", "[ 萌主点拨] 合同的变更是主体不变内容变。", "", "3. 当事人就合同变更协商一致。", "", "人", "", "于意思自治原则 (自愿原则) ，当事人变更合同的，原则上应当协商一致。如一方", "机 经对方当事人同意擅自改变合同的内容，此变更后的内容对另一方没有法律约束", "力，而且还有悼于有约必守原则，属于违约行为，当事人应当承担违约责任。", "", "[例] 2023 年3月1日，孟某将自己位于北京市海淀区幸福小区2 号楼 2 单元 402 室", "的房屋以 850 万元出卖给马某，双方签订了书面房屋买卖合同，约定 10 月 10 日办理过户", "登记手续。4 月 21 日，和孟某通知马某，402 室的房屋已经出卖给曹某并办理了过户登记手", "续。自己在同小区 1 号楼 1 单元还有一套带小院的房屋问马某是否愿意购买。马某表示同", "意。4月22 日，双方将3月1 日签订的房屋买卖合同中的房屋由2 号楼 2 单元 402 室变更", "为1号楼1 单元 102 室即属于典型的合同变更 〈标的物的变更) 。", "", "(2) 例外。", "", "基于公平原则，在情势变更的情形下，继续履行合同对一方当事人明显不公平的，受", "不利影响的当事人可以与对方协商，在合理期限内协商不成的，当事人可以请求法院或促", "裁机构变更合同。", "", "[例] 2019年8月10日,杭州秒翔医疗科技有限公司 (以下简称秒翔公司) 与武汉", "市中心医院 (以下简称中心医院) 签订了一份口午买卖合同，双方约定: 秒翔公司向中心", "医院提供医用口罩 100 万个 〈1 元/个) ，其中，秒翔公司先于2020 年3月15日前交付货", "物，中心医院于 2020 年年底前支付 100 万元货款。2019 年 12 月 30 日，武汉爆发新冠肺", "0 医用口罩成为紧俏物资 ，市场价 45 元/个。2020 年3月1", "", "，中心医院通知秒翔公司做好交货准备。秒翔公司回函称，合同签订价格和市场价严重", "二 拒绝履行，除非中心医院愿意提高价格。中心医院不同意。此时，秒翔公司可以基", "于情势变更向人民法院起诉请求变更合同。", "", "(3) 约定不明的法律后果。", "", "为了减少当事人可能就合同的变更产生纠纷，维护合同关系的稳定性。当事人必须有", "明确的变更合同的合意，如果一方当事人请求变更合同，对方虽未反对，但也没有明确表", "示同意，或没有以行为表示同意的，则不能认定对方当事人同意该变更，即当事人对合同", "变更的内容约定不明确的，推定为未变更。", "", "专题十八 @ 合同 (债) 的变更和转让", "", "[ 焉型案例| 天津市元通房地产开发公司与天津市新华制衣总厂返还财产纠纷申请再", "审案中，最高人民法院裁判认为，只有法律有明确规定的情况下，默示才能产生相应的法", "律效力，虽然一方当事人有间接证据证明对方已经知道变更合同的情况，但对方当事人距", "未用语言或文字明确表示同意，又未用行为表示同意的，则不能直接认定对方已经同意变", "更合同的内容。", "", "二、债权转让 ( 让与)", "", "[ 温葵提示] 该考点历年来共直接考查4 次且主观感亦会考查,《民法典合同编通则解", "释》第 47一50条(共4条) 进一步解释债权转让(让与) ，在备考中必须重点关注。", "", "[例) 乙公司欠甲公司 30 万元，2023 年9月1 日到期。乙公司法定代表人和孟某为该俩", "务提供房屋抵押并办理了抵押登记手续。同时，甲公司须在 8 月 20 日清偿对乙公司的 20", "万元货款。甲公司在同年9月 18 日与两公司签订书面协议，转让其对乙公司的 30 万元债", "权。同年9月24 日乙公司(债务人) 和入某〈担保人) 接到了甲公司关于转让债权的通", "知后，乙公司便主张 20 万元抵销权 (简单形成权/通知) 。根据上述案情及示意图，请回", "答如下问题:", "", "向丙公司偿还欠款并享有抗辩权和法定抵销权", "", "(法定代表人/担保人 )", "熏某", "一二", "(新债权人 )         30万元         (原债权人 )              30万元/9月1日到期        (债务人)", "两公司 < 四公司                                               乙公司", "〈受让人)      9月18日      (让与人)        20万元/8月20日到期", "( 内部效力)", "甲公司或两公司均可以通知 (方式为不要式 )", "9月24日", "(外部效力)", "(债权转让/让与当事人法律关系示意图)", "(1) 乙公司法定代表人和孟某为乙公司欠甲公司 30 万元提供物的担保系职务行为还是", "", "非职务行为?", "", "答: 非职务行为〈个人行为) 。", "", "(2) 甲公司与两公司之间的债权转让合同于何时生效?", "", "答: 9月18 日。 记载的时间予以认定。当事人采用邮", "寄、通讯电子系统等方式发出通知的，人民法院应当以邮改时间或者通讯电子系统", "记载的时间等作为认定通知到达时间的依据", "", "俩权转让 (让与) 缺乏公示手段，因此，非常容易出现债权的多重让与现象。债权", "", "法理与刘辑 | 的多重转让，本质就是以“最先通知”为准", "", "(一) 含义", "", "债权转让 〈让与) ，是指在债的关系不失其同一性的基础上，债权人通过让与合同将", "其债权移转给第三人享有的法律现象。其中的债权人称为让与人，第三人称为受让人。债", "权让与制度的价值理念是衡平债权的自由流转和债务人利益的保护。", "", "(二) 生效要件", "", "1. 存在合法有效的债权。对合法有效的债权要进行扩大解释，包括已过诉讼时效的", "债权、可撤销的债权、享有选择权的合同债权等。", "", "2. 被计与的债权具有可让与性。", "", "基于鼓励交易，增加社会财富的视角而言，应当人允许绝大多数的合同债权能够转让。", "债权人可以将债权的全部或部分转让给第三人，但是有下列情形之一的除外:", "", "(1) 根据债权性质不得转让。", "", "在日常生活中，有些合同基于其性质不能转让，主要包括如下几项:", "", "@基于人身信任关系产生的债权; 如雇佣合同、委托合同和租赁合同等。", "", "@)专为特定人利益设定的债权; 如专门为特定人教授外语的合同，专门为特定人绘肖", "像画的合同等。", "", "@@不作为债权; 如竞业禁止的债权，但有时不作为债权可以附属于其他法律关系一同", "让与，如竞业禁止的债权可以与营业一同让与。", "", "图从债权; 如保证债权不得单独转让; 但是，如从权利可与主权利分离而单独存在，", "亦可单独转让，如已产生的利息债权可与本金债权相分离而单独转让。", "", "(2) 按照当事人约定不得转让。", "", "基于合同自由原则，人允许当事人在法律允许的范围内进行约定。为了兼顾和平衡财产", "权的流通性、意思自治、交易安全等价值，借鉴了《意大利民法典》第 1264 条的规定。", "如保证人与债权人明确约定禁止债权转让。但是，当事人约定非金钱债权不得转让的，不", "72", "", "专题十八 @ 合同 (债) 的变更和转让", "", "得对抗善意第三人。", "", "(3) 依照法律规定不得转让。", "", "3. 让与人与受让人达成债权转让协议 。", "", "(1) 基于债 (合同) 的相对性原理，让与人和受让人一经达成债权转让协议即在二", "者间产生债权转让的内部效力。", "", "(2) 转让协议要对债务人产生效力需以通知债务人为要件。", "", "人中通知人既可以是原债权人 (让与人) 亦可以是受让人。从保护债务人履行安全的角", "度考虑，受让人为转让通知时，必须提供取得债权的证据。例如债权转让协议、转让公证", "村等，和否则债务人可以拒绝履行。", "", "@通知方式为不要式，书面、口头、行为均可以。", "", "(3) 基于“折中主义立法例”，未经通知，该转让对债务人不发生效力，即不产生外", "部效力。", "", "凡有原则必有例外，债权人让与的通知义务亦不例外。如下情形，无需通知:", "", "@证券化债权让与不以通知债务人为必要。如无记名证券 (电影票、蛋糕券、月饼券", "等) 。", "", "@特殊债权的移转必须办理登记手续。如电话使用权的过户。", "", "图当事人之间特别约定债权不得让与的，债权人和欲让与债权，必须征得债务人的同意。", "", "(4) 债权转让的通知不得撤销，但是经受让人同意的除外 〈表见让与) 。", "", "表见让与，是指当债权人将债权让与第三人的事实通知债务人后，即使让与并未发生", "或让与无效，债务人基于对让与通知的信赖而向第三人所为的给付依然有效。通说认为，", "表见让与一般只有在债权人为让与通知行为时才能发生，如果由受让人进行让与通知，则", "不产生表见让与的效力。", "", "(三) 法律效力", "", "1. 内部效力。", "", "(1) 原债权人 (让与人) 退出〈脱离) 原债的关系，不再享有债权债务，受让人取", "代让与人的法律地位而成为新的债权人。", "", "(2) 债权人转让债权的，受让人取得与债权有关的从权利 〈如担保物权和其他从权", "利) ，但是该从权利专属于债权人自身的除外一。", "", "[ 戎主点拨] 受让人取得从权利不因该从权利未办理转移登记手续或未转移占有而受", "", "(3) 证与人对其让与的债权负甫普担保责任。", "", "2. 外部效力。", "", "(1) 债权转让成立并一经通知债务人，债务人只能向受让人履行。", "", "基于“债务人不能因债权让与而受到损害”的原则 ，债务人接到债权转让通知后，债", "务人对让与人的抗辩，可以向受让人主张。", "", "[ 萌主点拨] 基于债的同一性原理，抗辩权可以移转。", "", "钙”如保证合同约定专为特定债权人而设定保证责任的情况下，该保证责任便与原债权人不可分离，不随同主债", "权让与而移转于受让人。", "", "73", "民法 \\专题讲座精讲卷", "", "(2) 有下列情形之一的，债务人可以向受让人主张抵销:", "", "@@债务人接到债权转让通知时，债务人对让与人享有债权，并且债务人的债权先于转", "让的债权到期或同时到期;", "", "@债务人的债权与转让的债权是基于同一合同产生。", "", "[例] 2023年3月2日，重某将自己的房屋出租给马某，双方约定租期3年，月租金", "1 万元。租期内，房屋内的冰箱坏了，熏某拒绝维修，马某无奈，自行请人修理冰箱，花", "费 2000 元。后马某欠和孟某租金 1 万元未付。10 月2 日，重某将该 1 万元租金债权转让给", "曹某并于当日通知了马某。10 月3 日，草某向马某主张 1 万元债权。请问: 马某可否向曹", "某主张 2000 元的抵销权 (简单形成权)?", "", "(受让人)       1万元     (让与人/出租人)       ]万元         (承租人)", "昔基                                              孟基                                                      马某", "债权转让                                              2000元", "主张1万元债权", "", "(债权转让情形下抵销权行权当事人法律关系示意图)", "", "答: 可以。因为债务人马某的债权 (2000 元维修费债权) 与转让的债权 (1 万元租", "金债权) 是基于同一合同 (房屋租赁合同) 产生 (《民法典》第 549 条) 。", "", "3. 费用负担。", "", "因债权转让增加的履行费用，由让与人负担。", "", "(四) 债权转让和第三人代为接受 (清偿) 履行的区别", "", "在第三人代为接受履行的情况下，该第三人始终不是合同当事人，玖向该第三人履行", "不合格时，债务人仍应向债权人而不是该第三人承担违约责任。", "", "与此相对应，在债权转让(让与) 情况下，第三人 (受让人) 成为合同当事人，债", "务人履行不合格时，债务人应向该第三人【〈受让人) 承担违约责任，而与原债权人没有", "关系。", "", "三、债务承担", "", "[ 温馨提示] 该考点历年来共直接考查6 次且主观题亦会考查,《民法典合同编通则解", "释》第51条 (共1条) 进一步解释债务加入 (并存的债务承担) ，在备考中必须重点", "关注。", "", "F1第三人+债务人+债权人同意", "免责的债务承担 (退出机制/同意) -| 2第三人+债权人", "债务承担                                                                         一3.第三人+债务人+债权人", "", "F工第三人+债务人+通知债权人", "并存的债务承担(加入机制/通知 )", "", "一2第三人+债权人", "(债务承担体系框架图)", "", "74", "专题十八 忆 合同 (债) 的变更和转让", "", "[例] 2023 年5月1日，王某经众森公司股东徐某介绍购买众森公司矿粉，王某依约", "预付了 100 万元货款，众森公司仅交付部分矿粉，经结算欠王某 50 万元货款。众森公司", "法定代表人和孟某以一辆宝马轿车作抵押并办理了抵押登记手续。根据上述案情及示意图，", "请回答如下问题:", "", "(债权人)   50万元   (债务人)    债务转让《第三人/承担人)", "", "王某 < 一一一 众森公司                          海马公司", "", "50万元", "轿车/抵押", "", "登记", "", "备某", "〈担保人/抵押人)", "", "(债务承担当事人法律关系示意图)", "", "(1) 5月5日，众森公司和海马公司签订债务承担协议将 50 万元货款债务转让给海", "马公司，未经王某同意是否有效 生效)?", "" 能会与债权人约定“以物抵债协议”，即", "代物清偿 〈俗称“项账”) ，以他种给付代替原定给付〈如用手表抵债) 。该种约定属于", "代物清偿，法律对该种约定持“肯定性评价”态度，认定为有效。", "", "中 答案, BCD。", "", "82", "专题十九 @ 合同 (债) 的权利义务终止", "", "(三) 数项债务的清偿抵充", "", "[ 温堆提示] 该考点历年来共直接考查1次。", "", "《民法典》第 560 条共 1 条规定了清偿抵充制度。该条来源于原《合同法解释二》第", "20 条的规定并参酌大陆法系相关国家或地区的立法经验而成。", "", "1. 含义。", "", "清偿抵充，是指在债务人对于同一债权人负担数宗 (项) 同种类的债务而清偿人提供", "的给付不足以清偿全部债务时，决定以该给付抵充何宗 〈项) 债务的规则。", "", "2. 构成要件。", "", "通说认为，清偿抵充需要符合三个构成要件，分别是:", "", "(1) 须债务人对于同一债权人负担数宗 (项) 债务;", "", "(2) 须数宗 (项) 债务之给付种类相同;", "", "(3) 须债务人提出之给付不足以清偿全部债务。", "", "3. 方法。", "第一步: 约定抵充〈原则上清偿前或清偿时约定 )", "第二步: 指定抵充〈债务人在清偿时享有抵充指定权 )", "清偿抵充的方法", "", "第一顺序: 已到期的债务", "第二顺序: 缺乏担保或担保最少的债务", "第三步: 法定抵充 二第三顺序: 债务人负担较重的债务", "第四顺序: 到期在先的债务", "一第五顺序: 债务比例", "(清偿抵充的方法体系框架图)", "当出现债务人的给付不足以清偿全部债务时，究竟清偿的是哪一笔债务，对于债权", "人人、债务人和第三人(担保人) 的利益影响巨大。清偿抵充顺序的基本原则是: 有约定从", "约定，无约定从指定，无指定从法定。", "第一步: 约定抵充。", "第二步: 指定抵充。", "在债的清偿关系中，债务人(清偿人) 处于相对的弱势地位，法律为保护债务人的利", "益且充分尊重债务人的真实意思表示，赋予其抵充指定权。", "第三步: 法定抵充。", "法定抵充的顺序主要是保护债权人利益，采取“债权人利益优先，兼顾债务人利益”", "的立法原则。", "第一顺序: 已到期的债务 (未到期的债务视为无债务 ，债务人享有期限利益) 。", "第二顺序: 缺乏担保或担保最少的债务 (为保护债权人利益，使债权人未清偿的债务", "尽量存在担保) 。", "第三顺序: 债务人负担较重的债务。债务人负担较重的债务包括: (1) 有利息的债务", "相较于无利息的债务，属于负担较重的债务; 〈2) 利率较高的债务相较于利率较低的债", "务，属于负担较重的债务; (3) 约定违约金的债务相较于未约定违约金的债务，属于负担", "较重的债务; (4) 个人债务相较于连带债务，属于负担较重的债务; (5) 有执行依据的", "", "83", "", "民法 \\专题讲座精讲卷", "", "债务相较于无执行依据的债务，属于负担较重的债务。", "第四顺序: 到期在先的债务 。", "第五顺序: 按照债务比例履行。", "", "第一笔 2022年8月1 日LA和 2023年8月 1 日", "", "第二笔 2022年9月1 日 LIAO和 2023 年9月1日    5%利息", "网", "", "第三笔 2022年10月1日 LOZO二2023年10月1 日 10%%利息", "", "第四笔 2022年11月1日 ZE年 ?023年11月1日“保证担保", "", "(清偿抵充法律关系示意图)", "允 随堂练习 |", "", "胡某于2006年3月10 日向李某借款 100 万元，期限3 年。2009 年3月30 日，双方", "商议再借 100 万元，期限 3 年。两笔借款均先后由王某保证，未约定保证方式和保证期", "间。李某未向胡某和王某催讨。胡某仅于 2010 年 2 月归还借款 100 万元。关于胡某归", "还的 100 万元，下列哪一表述是正确的? (2014-3-13，单)了", "", "A. 因 2006 年的借款已到期，故归还的是该笔借款", "", "B. 因 2006 年的借款无担保，故归还的是该笔借款", "", "C. 因 2006 年和 2009 年的借款数额相同，故按比例归还该两笔借款", "", "D. 因 2006 年和2009 年的借款均有担保，故按比例归还该两笔借款", "", "(四) 费用、利息和本金的清偿抵充", "", "[ 温志提示] 该考点历年来尚未直接考查过。", "", "《民法典》第 561 条共 1 条确立了关于费用、利息和主债务的清偿抵充顺序。该条来", "源于原《合同法解释二》第 21 条的规定并参酌大陆法系相关国家或地区的立法经验而成。", "", "债务人在履行主债务外还应当支付利息和实现债权的有关费用，其给付不足以清偿全", "部债务的，基本原则是“有约定从约定，无约定按法定”。", "", "第一步: 有约从约。", "", "[例] 重某向马某借款 100 万元，期限1年，年息 10% (利息 10 万元) 。到期后，备", "某碟绝归还欠款，马某将孟某诉至法院，支付各项费用 2 万元。强制执行程序中，孟某向", "马某清偿了 50 万元，如双方约定该 50 万元用于抵充主债务，则有约从约。", "", "第二步: 无约法定。", "", "在当事人无特别约定的情况下，各国立法基本一致，基于保护债权人利益的考量，应", "当按照下列顺序履行;", "", "第一顺序: 实现债权的有关费用; 实现债权的有关费用，是指为实现债权而支出的必", "要费用。该费用为债权人一时之支出,包括保管费用、诉讼费用、执行费用等。", "", "第二顺序: 利息; 利息 (包括约定利息和法定利息) 是债权人预期〈计) 应有的收", "益，是资金占用的成本。", "", "第三顺序: 主债务 (主给付/本金) 。", "", "四 答案: A。", "专题十九 @ 合同 (债) 的权利义务终止", "", "[例] 孟某向马某借款 100 万元，期限1 年，年息 109% (利息 10 万元) 。到期后，孟", "某拒绝归还欠款，马某将重某诉至法院，支付各项费用 2 万元。强制执行程序中，熏某向", "马某清偿了 50 万元，如双方无特别约定，先抵充实现债权的费用 2 万元。后抵充利息 10", "万元，最后抵充主债务 100 万元，因此，未偿还的主债务还剩 62 万元，该 62 万元继续按", "年息 10% 计算利息。", "", "综上，关于费用、利息和主债务的清偿抵充顺序可以概括为: 约定>费用>利息>", "", "二、合同解除", "", "[ 温志提示] 该考点历年来共直接考查6 次且主观题亦重点考查,《民法典合同编通则", "解释》第 52-54 条 (共3条) 进一步细化解释合同解除权间题，在备考中必须重点关注。", "", "《民法典》第 562-567 条共 6 条规定了合同解除制度。合同解除共 5 个核心考点，分", "别是，", "", "1. 对象法定: 尚未履行或尚未履行完毕且合法有效的合同才可以被解除。", "", "2. 程度法定: 根本违约〈合同目的无法实现/落空) 才可以解除合同。", "", "3. 情形法定: 双方解除或单方解除。", "", "4. 行权法定: 或诉或裁或通知 (简单形成权) 。", "", "5. 效力法定: 合同解除三个不影响:", "", "(1) 不影响合同的效力;", "", "(2) 不影响违约责任;", "", "(3) 不影响担保责任。", "", "双方解除 (协议解除 )", "合同解除 |", "", "约定解除", "|                    一般法定解除", "", "|", "特殊法定解除 ( 任意解除 )", "(合同解除体系框架图)", "", "[图释] 基于鼓励交易原则和合同严守原则，使已经签订的合同处于稳定履行的状态，", "不轻易行使解除权乃立法之宗骨。因此， 合同解除权的行使系例外而非原则。从合同解除", "制度的目的来看，仓同生效后，由于客观情况的变化，合同的履行成为不必要或不可能，", "如果再让合同继续发生法律效力，约束合同当事人，对其中一方甚至各方有害而无益，只", "有解除合同才能使局面改观。", "", "(一) 含义", "", "合同解除，是指根据一方或双方当事人的意思表示使合同关系归于终了的制度。", "", "(二) 双方解除", "", "[ 温蕉提示]」 该考点历年来共直接考查1 次。", "", "双方解除，又称协议解除、合意解除，是指合同成立并生效后，在未履行或未完全履", "行之前，合同当事人通过协商解除合同，使合同效力归于消灭。", "", "85", "民法 \\专题讲座精讲卷", "", "双方解除的实质是在原合同当事人之间成立一个新合同，该新合同的目的在于解除当", "事人原先订立的合同关系，使基于原合同发生的债权债务关系归于消灭。", "", "第一份合同: 原台同    手表买卖合同    息某和马革", "消丈      消灭", "", "第二份合同: 新合同   协议解除手表买卖合同 备某和马某", "( 诉解除时合同解除时间的认定", "", "条文来源   细化规定、延续性规定 ( 《合同法解释二》第 24条;《九民纪要》第 46条)", "", "考试价值   相对重点〈客观阶段和主观阶段均要准备)", "", "关联法条     《民法典》第 565 条", "", "90", "专题十九 @ 合同 (债) 的权利义务终止", "", "续表", "第 53 条，当事人一方以通知方式解除合同，并以对方未在约定的异议期限或者其他", "含理期限内提出异议为由主张合同已经解除的，人民法院应当对其是否享有法律规", "定或者合同约定的解除权进行审查。经审查，享有解除权的，合同自通知到达对方", "时解除; 不享有解除权的，不发生合同解除的效力", "", "第 54 条，当事人一方未通知对方，直接以提起诉讼的方式主张解除合同，撤诉后再", "次起诉主张解除合同，人民法院经审理支持该主张的，合同自再次起诉的起诉状副", "本送达对方时解除。但是，当事人一方撤诉后又通知对方解除合同且该通知已经到", "达对方的除外", "", "条文内容", "", "以通知方式解除合同的前提条件是当事人必须享有法定或约定解除权。如果有，自", "通知到达对方时解除 (解除权属于形成权/单方意思表示即产生私法效果) ;如果没", "有，则不发生解除合同的效力。", "问题: 2022 年4月21 日，孟某和众森公司签订一份房屋买卖合同，价款 850 万元，", "双方约定1 年后交包并过户。后房价暴距，熏某反悔。11 月 16 日，孟某书面通知众", "森公司解除双方签订的房屋买卖合同，并在通知中明确载明，如众森公司有异议", "必须在 3 个月内提出。2023 年3月2日，众森公司通知各某收房，孟某以房屋买卖", "合同已解除为由，请求众森公司返还 850 万元本人金及利息。请问: 法宫是否应支持", "孟某的诉讼请求?", "签: 不支持", "", "(3$) 备某和众森公司谁可以向法院或仲裁机构提起确认解除行为的效力?", "", "答: 双方均可以〈任何一方) 。", "", "(6) 如11月16日,北京市昌平区人民法院判决支持孟某的诉讼请求? 请问， 和孟某和", "众森公司之间的房屋买卖合同何时解除?", "", "答:; 10月2日，即通知到达时合同解除。", "", "(7) 如11月16日,北京市昌平区人民法院判决驳回重某的诉讼请求? 请问: 孟某和", "众森公司之间的房屋买卖合同何时解除?", "", "答: 一直未解除。", "", "1. 行使期限。", "", "法理与逻辑", "", "(1) 性质。", "合同解除权系形成权，依法定或约定享有合同解除权的一方当事人，经其单方意思表", "", "孙即可使合同效力归于消灭 (私法效果) ，打破已有的交易秩序，对当事人的权利义务产", "生重大影响。因此，为保护交易安全和维护社会经济秩序稳定，合同解除权应受除斥期间", "的限制。", "", "[例] 2019 年2月，甲公司与乙公司签订施工合同，约定由乙为甲建房一栋。乙与丙", "签订《内部承包协议》， 约定由丙承包建设该楼房并承担全部经济和法律责任，乙收取丙", "支付的工程价款总额 $%的管理费。丙实际施工至主体封顶。2023 年 1 月，乙向法院起诉", "请求甲支付拖欠工程款并解除施工合同。甲辩称乙起诉时已超过3 年诉讼时效，要求法院", "驳回乙的诉讼请求。请问: 乙起诉请求解除合同是否适用诉讼时效规定?", "", "答: 不适用。因为解除权属于形成权，应受除乒期间限制。", "", "91", "民法 \\专题讲座精讲卷", "", "(2) 起算。", "", "法律规定或当事人约定解除权行使期限，期限届满当事人不行使的，该权利消灭。法", "律没有规定或当事人没有约定解除权行使期限，自解除权人知道或应当知道解除事由之日", "起 1 年内不行使，或经对方催告后在合理期限内不行使的，该权利消灭。", "", "2. 行使方式。", "", "我国合同解除的方式主要采德国模式，即解除合同应向相对人表达。有具体而言包括三类:", "", "(1) 通知解除。", "", "四当事人一方依法主张解除合同的，应当通知对方。合同自通知到达对方时解除。通", "知载明债务人在一定期限内不履行债务则合同自动解除，债务人在该期限内未履行债务", "的，合同自通知载明的期限届满时解除。", "", "@对方对解除合同有异议的，任何一方当事人均可以请求法院或仲裁机构确认解除行", "为的效力。", "", "(2) 行为解除。", "", "当事人一方未通知对方，直接以提起诉讼或申请仲裁的方式依法主张解除合同，法院", "或仲裁机构确认该主张的，合同自起诉状副本或仲裁申请书副本送达对方时解除。", "", "(五) 解除权的效力", "", "1. 合同解除后，尚未履行的，终止履行。", "", "2. 已经履行的，根据履行情况和合同性质，当事人可以请求恢复原状或采取其他补", "救措施，并有权请求赔偿损失。", "", "(1) 履行情况。", "", "根据“履行情况”，是指根据履行部分对合同债权的影响。如果解除合同后，债务人", "已经履行的部分对债权人根本无意义，可以请求恢复原状; 如果根据合同履行情况无法恢", "复或不容恢复 (例如标的物已经毁损无法直接返还的) 的，不必恢复原状，可以采取其他", "补救措施，即请求修理、更换、重作、减价等。", "", "(2) 合同性质。", "", "根据“合同性质”，是指根据合同标的物的属性。", "", "人以金钱给付为标的物。", "", "以金钱给付为标的物的，当事人应当返还所取得的给付。", "", "@@继续性合同。", "", "继续性合同的性质决定了解除的效力只能向未来发生，已经履行的部分应当继续有", "效，无法恢复原状。继续性合同包括 :", "", "第一，以使用标的物为内容的继续性合同。如承租人擅自转租的，出租人得解除租赁", "合同。但是，租赁合同承租人一方在使用标的物后，无法就已经使用部分作出返还。", "", "第二，以行为为标的物的合同。如劳务合同，对于已经支付的劳务，很难用同样的劳", "动者和同质量的劳务返还。", "", "3. 合同因违约解除的，解除权人可以请求违约方承担违约责任，但是当事人另有约", "定的除外。主合同解除后，担保人对债务人应当承担的民事责任仍应当承担担保责任，但", "是担保合同另有约定的除外。", "", "[戎主点拨] 合同解除不影响合同效力、不影响违约责任、不影响", "", "适", "", "担保", "", "水", "", "任。", "", "92", "专题十九 @ 合同 (债) 的权利义务终止", "", "4. 合同的权利义务关系终止，不影响合同中结算和清理条款的效力。", "合同中的结算和清理条款，其效力具有独立性。合同权利义务关系终止的，有关结算", "和清理条款仍然有效。", "", "[例] 2023 年3月2日，天津花莱莉服装厂 (以下简称花菜莉公司) 和新疆棉花产业", "集团有限公司 (以下简称新疆棉花公司) 签订了一份 100 吨棉花采购协议，价款 2000 万", "元。双方约定，花茉莉公司应于合同签订后的 10 日内将 2000 万元全部给付给新疆棉花公", "司，新疆棉花公司于5 月底一次性交付全部棉花。3 月 3 日，西安投融资担保公司 〈以下", "简称西安担保公司) 和花茉莉公司签订了一份担保协议，该协议约定，如到期新疆棉花公", "司不履行合同义务，本公司无条件承担责任。合同签订后，花茉莉公司分别与 A 物流公司", "签订了运输合同，与 B 仓储公司签订了仓储合同，与 C 劳务派遗公司签订了劳务派遣合", "同。5 月底，新疆棉花公司仅能交付 40 吨棉花，导致花菜莉公司的含同目的无法实现", "(根本违约) ，造成实际损失 850 万元。根据上述案情及示意图，请回答如下问题:", "", "(出卖人/后履行 )               2000万元               〈买受人/先履行 )", "新疆棉花公司                棉花/100吨                 花茉莉公司", "西安担保公司", "(连带责任保证人)", "", "(解除权行使效力当事人法律关系示意图)", "", "(1) 新疆棉花公司与花菜莉公司之间的棉花采购协议效力如何?", "", "答: 合法有效。因为完全符合《民法典》第 143 条的规定 〈(强、公、主、意) 。", "", "(2) 花茉莉公司是否有权解除与新疆棉花公司的采购协议? 为什么?", "", "答: 有权。因为新疆棉花公司部分履行导致花菜莉公司合同目的无法实现〈根本违", "约) ，非违约方花菜莉公司有权行使法定解除权解除棉花采购协议。", "", "(3) 花菜莉公司可否通知新疆棉花公司解除合同?", "", "答: 可以。因为解除权属于简单形成权，通知即可行权。", "", "(4) 花莱莉公司解除合同后，尚未履行的 60 吨棉花是否需要继续履行?", "", "答: 不需要。因为合同解除后，尚未履行的，终止履行 (即不再履行) 。", "", "(5) 花莱莉公司解除合同后，已经履行的 40 吨棉花可否请求新疆棉花公司拉走以恢", "复原状?", "", "答: 可以。因为部分履行对花菜莉公司而言毫无意义，不符合合同目的。", "", "(6) 花莱莉公司解除合同后，可和否追究新疆棉花公司的违约责任，赔偿 850 万元的实", "际损失?", "", "答: 可以。因为合同解除，不影响违约责任的承担。", "", "(7) 花菜莉公司解除合同后，可和否请求西安担保公司承担担保责任?", "", "答: 可以。因为合同解除，不影响担保责任的承担。", "", "93", "民法 \\专题讲座精讲卷", "", "三、抵销", "[ 温葡提示] 该考点历年来共直接考查 3 次，属于常考点，《民法典合同编通则解释》", "第55-58 条 (共4条) 进一步对抵销权问题进行了重大制度修改和完善。在客观阶段和主", "", "观阶段备考时均应当重点关注。", "《民法典》第 568 、569 条共 2 条确立了抵销制度。", "", "互债", "法定抵销 上", "oo        主动债权已到期", "", "意定抵销 (意思自治原则 )", "(抵销制度体系框架图)", "", "[图释] 具有简化清偿功能和担保功能的抵销制度，主要保护的是主动债权人的利益，", "并以促进市场交易、降低交易成本为制度目的，  法表的从全要全站  “效率\" 。抵销的简", "化清偿功能体现为，主动债权人只需向被动债权人作出抵销的意     示即可 (具有强制", "性) ，既无需双方协商，也不存在清偿行为， 其法律后果是双方互负 的债务在同等数额内", "消灭。抵销的担保功能主要体现在提高了自己债权实现的可能性。作为形成权的抵销权一", "旦行使即可导致交叉债权在相应范围内互相消灭，一方面，是对自身债务的履行; 2 人", "面，也使自己的债权在相应范围内获得全额清偿，相当于在抵销权行使范围内获得", "法定的担保的权利。", "", "(一) 含义", "", "抵销，是指互负债务的双方当事人将两项债务互相充抵，以使双方债务在对等数额内", "消灭的行为。", "", "(二) 类型", "", "依照产生根据的不同，抵销分为法定抵销和意定抵销两类。", "", "1. 法定抵销。", "", "(1) 含义。", "", "法定抵销，是指依法律规定以当事人一方的意思表示所作的抵销。用作抵销的债权称", "为主动债权或自动债权，被抵销的债权称为被动债权。", "", "(债务人) 100万元/3月2日到期 (债权人 )", "", "备某                                           马某", "(债权人) 200万元/4月21日到期 (债务人)", "", "(法定抵销权当事人法律关系示意图)", "", "[例| 重某欠马某 100 万元，3 月2 日到期。马某欠重某 200 万元，4 月21 日到期。", "假设今天是 10 月 10 日。", "", "情形 1: 如孟某通知马鞭抵销，则和孟某的 200 万元债权称为主动债权或自动债权; 马", "某的 100 志元债权称 为被动债权。", "", "情形 2， 如马某通知重某抵销，则马某的 100 万元债权称为主动债权或自动债权; 和孟", "某的 200 万元债权称为被动债权。", "94", "", "专题十九 @ 合同 (债", "", "(2) 构成要件。", "中积极要件。", "第一，双方当事人互负债务。简称为“互债”。", "", "[新法束 递]", "《民法典合同编通则解释》(共 9 部分 69 条) 六冯六", "", "的权利义", "", "务终止", "", "条文序号      第 56 条", "", "条文主旨   抵销参照适用抵充规则", "", "条文来源   新增制度", "", "考试价值   相对重点 〈客观阶段和主观阶段均要准备)", "", "关联法条  《民法典》第 568 条", "", "行使皂销权的一方负担", "当事人因抵销的才", "处理。", "", "条文内容", "", "法典第五百六十一条的规定处理", "", "行使抵销权的一方享有的债权不足以的销其负担的包括主债务、利息", "有关费用在内的全部债务，当事人因抵销的顺序发生争议的，人民法院可以参照民", "", "沁现信", "", "的数项债务种类相同，但是享有的债权不足以抵销全部债务", "生争议的，人民法院可以参昭民法典第五百六十条的规定", "", "货权的", "", "第二，双方债务的标的物种类、品质相同。简称为“同类” 。", "", "[例| 孟某于2月3 日向马某信风一台彩中，  马某于2月6日向乔某借用了一部手机。", "到期后，孟某未向马某归还彩电，马某因此也拒绝向重某归还手机。请问:

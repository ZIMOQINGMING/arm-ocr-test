name: MediaBoard-build-test
on:
  push:
    paths:
      - "mediaboard/**"
      - ".github/workflows/led_mediaboard.yml"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check scripts
        run: |
          bash -n mediaboard/start.sh
          bash -n mediaboard/install.sh
          bash -n mediaboard/stop.sh
          echo "syntax OK"

      - name: Functional test in Debian bookworm (real chromium, arm64)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/mediaboard debian:bookworm bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq chromium imagemagick python3 >/dev/null 2>&1
            chromium --version
            # 造分区测试图：左区红->绿，右区蓝->黄->紫
            mkdir -p content/左区 content/右区
            convert -size 1280x720 xc:red     -pointsize 90 -fill white -gravity center -annotate 0 "L1-RED"    content/左区/01-red.png
            convert -size 1280x720 xc:green   -pointsize 90 -fill white -gravity center -annotate 0 "L2-GREEN"  content/左区/02-green.png
            convert -size 1280x720 xc:blue    -pointsize 90 -fill white -gravity center -annotate 0 "R1-BLUE"   content/右区/01-blue.png
            convert -size 1280x720 xc:yellow  -pointsize 90 -fill black -gravity center -annotate 0 "R2-YELLOW" content/右区/02-yellow.png
            convert -size 1280x720 xc:purple  -pointsize 90 -fill white -gravity center -annotate 0 "R3-PURPLE" content/右区/03-purple.png
            printf "左区=0,0,70,88,4\n右区=70,0,30,88,6\n时钟=70,76,30,12\n" > layout.txt
            echo "麒麟播放板分区测试字幕 ABC123" > ticker.txt
            printf "DURATION=4\nSOUND=no\nRELOAD_MINUTES=0\nTICKER_SPEED=60\nTICKER_COLOR=#ffff00\nTICKER_BGCOLOR=#ff00ff\n" > settings.txt
            # 1) playlist 生成测试
            MEDIABOARD_TEST=1 bash start.sh
            grep -q "左区" playlist.js || { echo "FAIL: zone 左区 missing"; exit 1; }
            grep -q "右区" playlist.js || { echo "FAIL: zone 右区 missing"; exit 1; }
            grep -q "clock:true" playlist.js || { echo "FAIL: clock zone missing"; exit 1; }
            ZL=$(grep -o "content/左区/[^\"]*" playlist.js | wc -l)
            ZR=$(grep -o "content/右区/[^\"]*" playlist.js | wc -l)
            echo "zone slides: left=$ZL right=$ZR"
            [ "$ZL" -eq 2 ] && [ "$ZR" -eq 3 ] || { echo "FAIL: zone slide count wrong"; exit 1; }
            grep -q "麒麟播放板分区测试字幕" playlist.js || { echo "FAIL: ticker text missing"; exit 1; }
            # 2) 渲染测试：虚拟时间快进验证两个分区各自独立推进
            chromium --headless --no-sandbox --disable-gpu --window-size=1280,720 \
              --virtual-time-budget=1500 --screenshot=/w/shot1.png "file:///w/mediaboard/player.html" 2>/dev/null
            chromium --headless --no-sandbox --disable-gpu --window-size=1280,720 \
              --virtual-time-budget=13000 --screenshot=/w/shot2.png "file:///w/mediaboard/player.html" 2>/dev/null
            ls -l /w/shot1.png /w/shot2.png
            python3 - <<PYEOF
          import re, subprocess
          def region(f, x, y, w, h):
              out = subprocess.run(["convert", f, "-crop", "%dx%d+%d+%d" % (w, h, x, y),
                                    "+repage", "-resize", "1x1", "txt:-"],
                                   capture_output=True, text=True).stdout
              m = re.search(r"srgb\(([\d.]+)%,([\d.]+)%,([\d.]+)%\)", out)
              return tuple(float(v) for v in m.groups())
          # t=1.5s: 左区第1张(红) 右区第1张(蓝)
          l1 = region("/w/shot1.png", 300, 260, 128, 72)
          r1 = region("/w/shot1.png", 1000, 260, 128, 72)
          print("t=1.5s left:", l1, "right:", r1)
          assert l1[0] > 80 and l1[1] < 10, "FAIL: left zone not red at t=1.5s"
          assert r1[2] > 80 and r1[0] < 10, "FAIL: right zone not blue at t=1.5s"
          # t=13s: 左区第2张(绿: 4s/张 floor(13/4)%2=1) 右区第3张(紫: 6s/张 floor(13/6)=2)
          l2 = region("/w/shot2.png", 300, 260, 128, 72)
          r2 = region("/w/shot2.png", 1000, 260, 128, 72)
          print("t=13s  left:", l2, "right:", r2)
          assert l2[1] > 60 and l2[0] < 10, "FAIL: left zone not green at t=13s"
          assert r2[0] > 30 and r2[2] > 30 and r2[1] < 20, "FAIL: right zone not purple at t=13s"
          print("PASS: two zones advance independently")
          # 3) 字幕条(测试用品红底色)
          strip = region("/w/shot1.png", 200, 665, 300, 40)
          print("ticker strip:", strip)
          assert strip[0] > 50 and strip[2] > 50, "FAIL: ticker bar not rendered"
          print("PASS: ticker bar rendered")
          # 4) 时钟窗口: 右下角应有非均匀内容(白色数字)
          out = subprocess.run(["convert", "/w/shot1.png", "-crop", "384x86+896+547", "+repage",
                                "-format", "%[standard-deviation]", "info:"],
                               capture_output=True, text=True).stdout
          print("clock stddev:", out)
          assert float(out) > 1.0, "FAIL: clock zone blank"
          print("PASS: clock zone rendered")
          print("ALL FUNCTIONAL TESTS PASSED")
          PYEOF
          '

      - name: Package clean bundle
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w debian:bookworm bash -c '
            rm -rf /w/mediaboard/content/左区 /w/mediaboard/content/右区 \
                   /w/mediaboard/playlist.js /w/shot1.png /w/shot2.png
            apt-get update -qq >/dev/null && apt-get install -y -qq imagemagick >/dev/null 2>&1
            convert -size 1280x720 "xc:#103050" -pointsize 60 -fill white -gravity center \
              -annotate 0 "MediaBoard Ready" /w/mediaboard/content/00-welcome.png
          '
          # 恢复 layout.txt 为注释样例（测试时改成了真实分区）
          printf '# 分屏布局（可选，仿 LEDvision 节目窗口）\n# 每行一个窗口: 名称=起点X,起点Y,宽,高[,图片停留秒数]\n# 数字都是占屏幕的百分比。素材放进 content/同名目录/ 里。\n# 名称写「时钟」则该窗口显示实时时钟。\n# 示例: 主画面=0,0,70,90 / 侧栏=70,0,30,90,15 / 时钟=85,90,15,10\n# 全部注释掉（默认）= 全屏轮播 content/ 顶层素材。\n' > mediaboard/layout.txt
          cd "$GITHUB_WORKSPACE"
          tar czf mediaboard-kylin-arm64.tar.gz mediaboard
          ls -lh mediaboard-kylin-arm64.tar.gz
          tar tzf mediaboard-kylin-arm64.tar.gz

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediaboard-kylin-arm64
          path: mediaboard-kylin-arm64.tar.gz

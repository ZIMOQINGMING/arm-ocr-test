name: MediaBoard-demo-shots
on:
  push:
    paths:
      - ".github/workflows/led_mediaboard_demo.yml"
  workflow_dispatch:
jobs:
  demo:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Real-time run under Xvfb, capture real screenshots + geometry
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/mediaboard debian:bookworm bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq chromium xvfb imagemagick fonts-noto-cjk python3 python3-pil >/dev/null 2>&1
            chromium --version

            mkdir -p content/主画面 content/侧栏
            F=Noto-Sans-CJK-SC
            convert -size 896x619 gradient:"#0b3f7a"-"#2277dd" \
              -font $F -pointsize 46 -fill white -gravity north -annotate +0+50 "季度工作汇报" \
              -pointsize 24 -fill "#d6e8ff" -gravity northwest \
              -annotate +70+170 "一、项目进展顺利" -annotate +70+250 "二、质量指标全面达标" \
              -annotate +70+330 "三、下季度重点计划" content/主画面/01-封面.png
            convert -size 896x619 gradient:"#7a1250"-"#e01e6e" \
              -font $F -pointsize 44 -fill white -gravity north -annotate +0+50 "通 知 公 告" \
              -pointsize 24 -fill "#ffd9ec" -gravity northwest \
              -annotate +70+170 "本周五 15:00 三楼会议室" -annotate +70+250 "全员参加，请提前安排工作" \
              -annotate +70+330 "带好笔记本与工牌" content/主画面/02-通知.png
            convert -size 896x619 gradient:"#0a5c46"-"#27c489" \
              -font $F -pointsize 44 -fill white -gravity north -annotate +0+50 "安全生产宣传" \
              -pointsize 24 -fill "#d4ffef" -gravity northwest \
              -annotate +70+170 "安全第一  预防为主" -annotate +70+250 "规范操作  谨慎作业" \
              -annotate +70+330 "人人讲安全  事事为安全" content/主画面/03-宣传.png
            convert -size 384x403 gradient:"#f0a52a"-"#e0761a" \
              -font $F -pointsize 40 -fill "#4a2c00" -gravity center -annotate 0 "图\n片\n栏" content/侧栏/01.png
            convert -size 384x403 gradient:"#12a8bd"-"#0a7288" \
              -font $F -pointsize 40 -fill white -gravity center -annotate 0 "产\n品\n图" content/侧栏/02.png
            convert -size 384x403 gradient:"#8266cf"-"#4c33a0" \
              -font $F -pointsize 40 -fill white -gravity center -annotate 0 "风\n景\n图" content/侧栏/03.png

            printf "主画面=0,0,70,86,8\n侧栏=70,0,30,56,5\n时钟=70,56,30,30\n" > layout.txt
            echo "麒麟V10 播放板运行中 · 分区组合播放演示 · 图片与PPT自动轮播 · 底部滚动字幕" > ticker.txt
            printf "DURATION=8\nSOUND=no\nRELOAD_MINUTES=0\nTICKER_SPEED=60\nTICKER_COLOR=#ffffff\nTICKER_BGCOLOR=#16325c\nFILL=cover\n" > settings.txt
            MEDIABOARD_TEST=1 bash start.sh

            Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
            XPID=$!
            sleep 2
            export DISPLAY=:99
            # 显式指定窗口尺寸与位置：Xvfb 没有窗口管理器，kiosk 全屏请求不会被满足
            chromium --no-sandbox --test-type --disable-gpu --noerrdialogs --disable-infobars \
              --no-first-run --no-default-browser-check --disable-background-networking \
              --force-device-scale-factor=1 --lang=zh-CN \
              --window-position=0,0 --window-size=1280,720 --start-fullscreen \
              --autoplay-policy=no-user-gesture-required \
              "file:///w/mediaboard/player.html" >/dev/null 2>&1 &
            CPID=$!
            sleep 4;  import -window root /w/shot_1.png
            sleep 7;  import -window root /w/shot_2.png
            sleep 8;  import -window root /w/shot_3.png
            sleep 9;  import -window root /w/shot_4.png
            kill $CPID 2>/dev/null || true

            # 诊断信息截图（画面左上角打印 viewport 与各分区实际像素矩形）
            chromium --no-sandbox --test-type --disable-gpu --noerrdialogs --disable-infobars \
              --no-first-run --force-device-scale-factor=1 --lang=zh-CN \
              --window-position=0,0 --window-size=1280,720 --start-fullscreen \
              "file:///w/mediaboard/player.html?diag=1" >/dev/null 2>&1 &
            DPID=$!
            sleep 5; import -window root /w/shot_diag.png
            kill $DPID $XPID 2>/dev/null || true
            ls -l /w/shot_*.png
          '

      - name: Verify with pixel measurement (PIL)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w debian:bookworm bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null && apt-get install -y -qq python3 python3-pil >/dev/null 2>&1
            python3 - <<PYEOF
          from PIL import Image
          import hashlib, os

          def segments_col(im, x):
              W, H = im.size
              out, cur = [], None
              for y in range(H):
                  c = im.getpixel((x, y))
                  if cur is None: cur = [y, y, c]
                  elif max(abs(c[i]-cur[2][i]) for i in range(3)) > 18:
                      out.append(tuple(cur)); cur = [y, y, c]
                  else: cur[1] = y
              out.append(tuple(cur))
              return [s for s in out if s[1]-s[0] >= 6]

          def segments_row(im, y):
              W, H = im.size
              out, cur = [], None
              for x in range(W):
                  c = im.getpixel((x, y))
                  if cur is None: cur = [x, x, c]
                  elif max(abs(c[i]-cur[2][i]) for i in range(3)) > 18:
                      out.append(tuple(cur)); cur = [x, x, c]
                  else: cur[1] = x
              out.append(tuple(cur))
              return [s for s in out if s[1]-s[0] >= 6]

          shots = ["/w/shot_%d.png" % i for i in (1,2,3,4)]
          im1 = Image.open(shots[0]).convert("RGB")
          W, H = im1.size
          print("screenshot size:", W, H, "| file sizes:", [os.path.getsize(f) for f in shots])

          # --- 几何: 分区边界必须落在布局声明处 ---
          row = segments_row(im1, 250)
          print("row y=250 segments:", [(s[0], s[1], s[2]) for s in row])
          assert row[0][0] == 0, "FAIL: main zone does not start at x=0"
          main_right = row[0][1]
          print("main zone right edge:", main_right, "expected", int(W*0.70), "(70%% of %d)" % W)
          assert abs(main_right + 1 - W*0.70) <= 14, "FAIL: main zone width wrong"
          assert row[-1][1] >= W - 3, "FAIL: sidebar does not reach right edge"

          col = segments_col(im1, 400)
          print("col x=400 segments:", [(s[0], s[1], s[2]) for s in col])
          assert col[0][0] == 0, "FAIL: main zone does not start at y=0 (infobar/letterboxing)"
          top_px = im1.getpixel((400, 2))
          print("top pixel:", top_px)
          assert not (top_px[0] > 240 and top_px[1] > 240 and top_px[2] > 240), \
              "FAIL: white bar at top (browser infobar still visible)"
          main_bottom = col[0][1]
          print("main zone bottom:", main_bottom, "expected", int(H*0.86), "(86%% of %d)" % H)
          assert abs(main_bottom + 1 - H*0.86) <= 14, "FAIL: main zone height wrong"

          # --- 内容推进 ---
          def avg(im, x, y, w, h):
              px = im.crop((x, y, x+w, y+h)).resize((1,1)).getpixel((0,0))
              return px
          mains = [avg(Image.open(f).convert("RGB"), 350, 250, 200, 120) for f in shots]
          sides = [avg(Image.open(f).convert("RGB"), 950, 150, 120, 80) for f in shots]
          print("main zone colors:", mains)
          print("side zone colors:", sides)
          assert len(set(mains)) >= 2, "FAIL: main zone never advanced"
          assert len(set(sides)) >= 2, "FAIL: side zone never advanced"
          print("PASS: two zones advance independently")

          # --- 字幕滚动 ---
          hs = []
          for f in shots:
              band = Image.open(f).convert("L").crop((0, 660, 1280, 715)).resize((200, 10))
              hs.append(hashlib.md5(band.tobytes()).hexdigest()[:10])
          print("ticker band hashes:", hs)
          assert len(set(hs)) >= 3, "FAIL: ticker not scrolling"
          # 字幕条底色到位 + 文字非空
          bar = Image.open(shots[0]).convert("RGB")
          print("ticker bg color at (5,700):", bar.getpixel((5, 700)))
          assert bar.getpixel((5, 700))[2] > 60, "FAIL: ticker band missing"
          print("PASS: ticker scrolling with background band")
          print("ALL DEMO CHECKS PASSED")
          PYEOF
          '

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediaboard-demo-shots
          path: shot_*.png

name: MediaBoard-demo-shots
on:
  push:
    paths:
      - ".github/workflows/led_mediaboard_demo.yml"
  workflow_dispatch:
jobs:
  demo:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Real-time run under Xvfb, capture 4 real screenshots
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/mediaboard debian:bookworm bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq chromium xvfb imagemagick fonts-noto-cjk python3 >/dev/null 2>&1
            chromium --version

            mkdir -p content/主画面 content/侧栏
            F=Noto-Sans-CJK-SC

            convert -size 896x619 gradient:"#0b3f7a"-"#2277dd" \
              -font $F -pointsize 46 -fill white -gravity north -annotate +0+50 "季度工作汇报" \
              -pointsize 24 -fill "#d6e8ff" -gravity northwest \
              -annotate +70+170 "一、项目进展顺利" -annotate +70+250 "二、质量指标全面达标" \
              -annotate +70+330 "三、下季度重点计划" content/主画面/01-封面.png
            convert -size 896x619 gradient:"#7a1250"-"#e01e6e" \
              -font $F -pointsize 44 -fill white -gravity north -annotate +0+50 "通 知 公 告" \
              -pointsize 24 -fill "#ffd9ec" -gravity northwest \
              -annotate +70+170 "本周五 15:00 三楼会议室" -annotate +70+250 "全员参加，请提前安排工作" \
              -annotate +70+330 "带好笔记本与工牌" content/主画面/02-通知.png
            convert -size 896x619 gradient:"#0a5c46"-"#27c489" \
              -font $F -pointsize 44 -fill white -gravity north -annotate +0+50 "安全生产宣传" \
              -pointsize 24 -fill "#d4ffef" -gravity northwest \
              -annotate +70+170 "安全第一  预防为主" -annotate +70+250 "规范操作  谨慎作业" \
              -annotate +70+330 "人人讲安全  事事为安全" content/主画面/03-宣传.png

            convert -size 384x403 gradient:"#f0a52a"-"#e0761a" \
              -font $F -pointsize 40 -fill "#4a2c00" -gravity center -annotate 0 "图\n片\n栏" content/侧栏/01.png
            convert -size 384x403 gradient:"#12a8bd"-"#0a7288" \
              -font $F -pointsize 40 -fill white -gravity center -annotate 0 "产\n品\n图" content/侧栏/02.png
            convert -size 384x403 gradient:"#8266cf"-"#4c33a0" \
              -font $F -pointsize 40 -fill white -gravity center -annotate 0 "风\n景\n图" content/侧栏/03.png

            printf "主画面=0,0,70,86,8\n侧栏=70,0,30,56,5\n时钟=70,56,30,30\n" > layout.txt
            echo "麒麟V10 播放板运行中 · 分区组合播放演示 · 图片与PPT自动轮播 · 底部滚动字幕" > ticker.txt
            printf "DURATION=8\nSOUND=no\nRELOAD_MINUTES=0\nTICKER_SPEED=60\nTICKER_COLOR=#ffffff\nTICKER_BGCOLOR=#16325c\nFILL=cover\n" > settings.txt

            MEDIABOARD_TEST=1 bash start.sh

            Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
            XPID=$!
            sleep 2
            export DISPLAY=:99
            # 与 start.sh 完全相同的启动参数（含关闭翻译提示条）
            chromium --kiosk --noerrdialogs --disable-infobars \
              --no-first-run --no-default-browser-check \
              --disable-features=Translate,TranslateUI,TranslateNewUX \
              --disable-session-crashed-bubble --disable-restore-session-state \
              --disable-background-networking --disable-component-update \
              --force-device-scale-factor=1 --lang=zh-CN \
              --autoplay-policy=no-user-gesture-required --no-sandbox --disable-gpu \
              "file:///w/mediaboard/player.html" >/dev/null 2>&1 &
            CPID=$!
            sleep 4;  import -window root /w/shot_1.png
            sleep 7;  import -window root /w/shot_2.png
            sleep 8;  import -window root /w/shot_3.png
            sleep 9;  import -window root /w/shot_4.png
            kill $CPID $XPID 2>/dev/null || true
            ls -l /w/shot_*.png
          '

      - name: Verify screenshots (geometry, content advance, ticker scroll, clock)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w debian:bookworm bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null && apt-get install -y -qq imagemagick python3 >/dev/null 2>&1
            python3 - <<PYEOF
          import subprocess, re, hashlib, os

          def hexmap(f, geom):
              out = subprocess.run(["convert", f, "-crop", geom, "+repage", "txt:-"],
                                   capture_output=True, text=True).stdout
              res = []
              for line in out.splitlines()[1:]:
                  m = re.search(r"^(\d+),(\d+):.*#([0-9A-Fa-f]{6})", line)
                  if m:
                      res.append((int(m.group(1)), int(m.group(2)), m.group(3)))
              return res

          def segs(points, key_axis, other_axis):
              # 按主轴聚合颜色分段（颜色变化 > 20 视为边界）
              out, cur = [], None
              for p in points:
                  c = tuple(int(p[2][i:i+2], 16) for i in (0, 2, 4))
                  a = p[key_axis]
                  if cur is None:
                      cur = [a, a, c]
                  else:
                      d = max(abs(c[i] - cur[2][i]) for i in range(3))
                      if d > 20:
                          out.append(tuple(cur))
                          cur = [a, a, c]
                      else:
                          cur[1] = a
              if cur: out.append(tuple(cur))
              return [s for s in out if s[1] - s[0] >= 8]

          shots = ["/w/shot_%d.png" % i for i in (1, 2, 3, 4)]
          for f in shots:
              print(f, os.path.getsize(f), "bytes")

          # --- 几何: 竖线扫描 x=400 (主画面) 与 x=1000 (侧栏/时钟) ---
          print("\n[geometry] column x=400 segments (y_start,y_end,rgb):")
          for s in segs(hexmap(shots[0], "1x720+400+0"), 1, 0):
              print("   ", s)
          print("[geometry] column x=1000 segments:")
          for s in segs(hexmap(shots[0], "1x720+1000+0"), 1, 0):
              print("   ", s)
          print("[geometry] row y=300 segments (x_start,x_end,rgb):")
          for s in segs(hexmap(shots[0], "1280x1+0+300"), 0, 1):
              print("   ", s)

          # --- 内容推进 ---
          def px(f, x, y, w, h):
              out = subprocess.run(["convert", f, "-crop", "%dx%d+%d+%d" % (w,h,x,y), "+repage",
                                    "-resize", "1x1", "txt:-"], capture_output=True, text=True).stdout
              m = re.search(r"#([0-9A-Fa-f]{6})", out)
              if not m:
                  m2 = re.search(r"srgb\(([^)]+)\)", out)
                  if m2:
                      v = [c.strip() for c in m2.group(1).split(",")]
                      rgb = []
                      for c in v:
                          rgb.append(int(round(float(c[:-1]) * 2.55)) if c.endswith("%") else int(float(c)))
                      return tuple(rgb)
                  raise SystemExit("parse fail: " + repr(out))
              hx = m.group(1)
              return tuple(int(hx[i:i+2], 16) for i in (0, 2, 4))
          mains = [px(f, 350, 300, 200, 120) for f in shots]
          sides = [px(f, 900, 150, 120, 100) for f in shots]
          print("\nmain zone colors:", mains)
          print("side zone colors:", sides)
          assert len(set(mains)) >= 2, "FAIL: main zone never advanced"
          assert len(set(sides)) >= 2, "FAIL: side zone never advanced"
          print("PASS: zones advance independently")

          # --- 字幕滚动 ---
          hs = []
          for f in shots:
              out = subprocess.run(["convert", f, "-crop", "1280x60+0+660", "+repage",
                                    "-colorspace", "gray", "-resize", "200x10!", "txt:-"],
                                   capture_output=True, text=True).stdout
              hs.append(hashlib.md5(out.encode()).hexdigest()[:10])
          print("ticker strip hashes:", hs)
          assert len(set(hs)) >= 3, "FAIL: ticker not scrolling"
          print("PASS: ticker scrolling")
          print("ALL DEMO CHECKS PASSED")
          PYEOF
          '

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediaboard-demo-shots
          path: shot_*.png

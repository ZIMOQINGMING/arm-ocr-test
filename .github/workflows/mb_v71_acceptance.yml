name: MediaBoard-v7.1-acceptance
on:
  push:
    paths:
      - "dist/mediaboard-kylin-arm64-v7.1.tar.gz"
      - "tools/v7_1_acceptance.py"
      - "tools/v71_special.py"
      - ".github/workflows/mb_v71_acceptance.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare output dir
        run: mkdir -p /tmp/out/shots /tmp/out/special && chmod -R 777 /tmp/out

      - name: 70-case regression + Chapter 14 defect re-verification
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -v /tmp/out:/out debian:bookworm bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq chromium imagemagick python3-pil xvfb fonts-noto-cjk nodejs procps >/dev/null 2>&1
            chromium --version
            printf "#!/bin/sh\nexec /usr/bin/chromium --no-sandbox --test-type --disable-dev-shm-usage \"\$@\"\n" > /usr/local/bin/chromium
            chmod +x /usr/local/bin/chromium
            rm -rf /w/mediaboard
            tar xzf /w/dist/mediaboard-kylin-arm64-v7.1.tar.gz -C /w
            cat /w/mediaboard/VERSION | head -4
            export DISPLAY=:99
            Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
            sleep 2
            xdpyinfo -display :99 >/dev/null || { echo "Xvfb failed"; exit 1; }
            cd /w
            mkdir -p /w/work
            MB_PKG=/w/mediaboard MB_WORK=/w/work/mediaboard MB_SHOT=/out/shots MB_CHROME=chromium python3 /w/tools/v7_1_acceptance.py || true
            echo "---- 回归结果 ----"
            head -80 /out/acceptance_results.tsv
          '

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediaboard-v7.1-regression
          path: |
            /tmp/out/shots
            /tmp/out/acceptance_results.json
            /tmp/out/acceptance_results.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = "/tmp/out/acceptance_results.json"
          if not os.path.exists(p):
              print("no results")
              raise SystemExit(0)
          rs = json.load(open(p, encoding="utf-8"))
          ok = sum(1 for r in rs if r["ok"])
          print("PASS %d / %d" % (ok, len(rs)))
          for r in rs:
              if not r["ok"]:
                  print("FAIL", r["id"], r["title"])
                  for n in r["notes"]:
                      if n.startswith("FAIL"):
                          print("   ", n)
          PY
